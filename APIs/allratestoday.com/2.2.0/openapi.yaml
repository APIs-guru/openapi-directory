          - json
          - csv
          - xlsx
          default: json
      responses:
        '200':
          description: Latest table (raw cache shape) or file download
          content:
            application/json:
              schema:
                type: object
                properties:
                  bank:
                    type: string
                    example: ecb
                  rate_date:
                    type: string
                    format: date
                    example: '2026-08-10'
                  rates:
                    type: array
                    items:
                      type: object
                      properties:
                        base_ccy:
                          type: string
