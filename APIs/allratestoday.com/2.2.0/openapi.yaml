components:
  parameters:
    Format:
      name: format
      in: query
      required: false
      description: Response format (default json). csv is UTF-8 with a BOM; xlsx is a real Excel workbook with typed dates and numbers; xml mirrors the JSON fields.
      schema:
        type: string
        enum:
        - json
        - csv
        - xml
        - xlsx
        default: json
    BankCode:
      name: bank
      in: path
      required: true
      description: Source code from /api/v1/central-banks (e.g. ecb, boc, cbsl, banxico, ustreasury)
      schema:
        type: string
        pattern: ^[a-z0-9_-]{2,20}$
        example: ecb
    PairSource:
      name: source
      in: query
      required: false
      description: 'Pair mode: source currency, 3-letter code (requires target)'
      schema:
        type: string
        minLength: 3
        maxLength: 3
        example: USD
    PairTarget:
      name: target
      in: query
      required: false
      description: 'Pair mode: target currency, 3-letter code (requires source)'
      schema:
        type: string
        minLength: 3
        maxLength: 3
        example: LKR
  responses:
    BadRequest:
      description: Invalid or missing parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 'Authentication required — provide an API key via `Authorization: Bearer art_live_...` (free keys at https://allratestoday.com/register)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PaidPlanRequired:
      description: Historical central-bank data requires a paid plan; /latest is available on all plans
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              upgrade_url:
                type: string
                example: https://allratestoday.com/pricing
    QuotaExceeded:
      description: Monthly request limit exceeded (X-Monthly-Limit / X-Monthly-Used / X-Monthly-Resets headers included)
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Request limit exceeded
              used:
                type: integer
              limit:
                type: integer
              plan:
                type: string
                example: free
              resets_at:
                type: string
                format: date-time
              upgrade_url:
                type: string
                example: https://allratestoday.com/pricing
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: string
          description: Error message
        hint:
          type: string
          description: Optional remediation hint
    CbRate:
      type: object
      properties:
        base:
          type: string
          example: EUR
        quote:
          type: string
          example: USD
        type:
          type: string
          description: Rate type as labeled by the bank (reference, buying, selling, indicative, ...)
          example: reference
        value:
          type: number
          format: double
          example: 1.0853
    CbTable:
      type: object
      properties:
        bank:
          type: string
          example: ecb
        name:
          type: string
          example: European Central Bank
        rate_date:
          type: string
          format: date
          example: '2026-08-10'
        rates:
          type: array
          items:
            $ref: '#/components/schemas/CbRate'
        disclaimer:
          type: string
    CbPair:
      type: object
      properties:
        bank:
          type: string
          example: cbsl
        name:
          type: string
          example: Central Bank of Sri Lanka
        rate_date:
          type: string
          format: date
        source:
          type: string
          example: USD
        target:
          type: string
          example: LKR
        rate:
          type: number
          format: double
          example: 298.7654
        rate_type:
          type: string
          example: indicative
        derived:
          type: boolean
          description: True when not directly published by the bank (inverse or cross-computed)
        method:
          type: string
          enum:
          - published
          - inverse
          - cross
        disclaimer:
          type: string
    CbTableDated:
      allOf:
      - $ref: '#/components/schemas/CbTable'
      - type: object
        properties:
          requested_date:
            type: string
            format: date
          published_on_requested_date:
            type: boolean
            description: False when the bank did not publish on the requested date and the most recent prior table is returned
    CbPairDated:
      allOf:
      - $ref: '#/components/schemas/CbPair'
      - type: object
        properties:
          requested_date:
            type: string
            format: date
          published_on_requested_date:
            type: boolean
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'API key from your AllRatesToday dashboard. Example: `Authorization: Bearer art_live_xxxxx`. Free keys at https://allratestoday.com/register. Agents without an account: `POST /api/agent/keys` issues a 100-call trial key instantly.'
    apiKeyQuery:
      type: apiKey
      in: query
      name: key
      description: API key as a query parameter (accepted on /api/rate only; `apiKey` is an alias)
    sessionCookie:
      type: apiKey
      in: cookie
      name: art_session
      description: Session cookie for logged-in dashboard users
