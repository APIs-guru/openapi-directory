openapi: 3.0.3
servers:
- url: https://allratestoday.com
  description: Production
info:
  title: AllRatesToday Exchange Rate & Central Bank Rates API
  description: |-
    Live mid-market exchange rates for 160+ currencies plus official rates from 121 central banks and 3 tax authorities (ECB, the Fed, Bank of Canada, CBSL, Banxico, HMRC, US Treasury and more).

    ## Data
    - **Market rates** (`/api/rate`, `/api/v1/rates`, `/api/historical-rates`): live mid-market rates, refreshed roughly every 60 seconds.
    - **Central-bank rates** (`/api/v1/central-bank/*`, `/api/open/central-bank/*`): the official tables exactly as published by each institution, one table per publication date. History reaches back to 2000 and earlier for major sources (ECB from 1999, Bank of Canada from 1950s-era series where published).
    - **Daily Reference Rate** (`/api/open/reference-rate`, `/api/v1/reference-rate/*`): one immutable mid-market USD table per business day, fixed at 16:00 London (median of a five-minute sampling window). For index calculation, research and reporting; not a registered benchmark. Methodology: https://allratestoday.com/reference-rate/

    ## Authentication
    Most endpoints require an API key sent as `Authorization: Bearer art_live_...`. Get a free key at https://allratestoday.com/register, or self-issue a 100-call trial key with no account via `POST /api/agent/keys` (built for AI agents). Logged-in dashboard users can also authenticate with their session cookie.

    Keyless endpoints: `/api/v1/symbols` and `/api/open/central-bank/{bank}` (attribution required), plus JSON reads of `/api/public/central-bank/{bank}`.

    ## Output formats
    Endpoints that return tabular data accept `?format=json|csv|xml|xlsx` (CSV is UTF-8 with BOM; XLSX is a real Excel workbook; default json).

    ## Plans
    Free plan: 300 requests in total (a lifetime allowance that never resets), latest central-bank tables included. Historical central-bank dates and time series require a paid plan. See https://allratestoday.com/pricing.
  version: 2.2.0
  contact:
    name: AllRatesToday Support
    url: https://allratestoday.com
    email: support@allratestoday.com
  termsOfService: https://allratestoday.com/terms/
  x-apisguru-categories:
  - financial
  x-logo:
    backgroundColor: '#FFFFFF'
    url: https://allratestoday.com/apple-touch-icon.png
  x-origin:
  - format: openapi
    url: https://allratestoday.com/openapi.json
    version: '3.0'
  x-providerName: allratestoday.com
externalDocs:
  description: API documentation
  url: https://allratestoday.com/docs/
tags:
- name: Market Rates
  description: Live and historical mid-market rates (updated ~every 60 seconds)
- name: Central Bank Rates
  description: Official reference rates as published by central banks and tax authorities (API key required)
- name: Open Endpoints
  description: Keyless endpoints — no API key needed
- name: Compatibility
  description: Drop-in JSON shapes for exchangeratesapi.io, Fixer, exchangerate.host and Frankfurter, served from the ECB reference table.
paths:
  /api/rate:
    get:
      tags:
      - Market Rates
      operationId: getRate
      summary: Current exchange rate for one currency pair
      description: 'Live mid-market rate between two currencies, refreshed roughly every 60 seconds. Requires an API key: pass it as `Authorization: Bearer art_live_...` or, for simple cross-origin GETs, as `?key=` (alias `?apiKey=`). CORS-enabled.'
      security:
      - bearerAuth: []
      - apiKeyQuery: []
      parameters:
      - name: source
        in: query
        required: true
        description: Source currency code (ISO 4217)
        schema:
          type: string
          minLength: 3
          maxLength: 3
          example: USD
      - name: target
        in: query
        required: true
        description: Target currency code (ISO 4217)
        schema:
          type: string
          minLength: 3
          maxLength: 3
          example: EUR
      - name: key
        in: query
        required: false
        description: API key (alternative to the Authorization header; `apiKey` also accepted)
        schema:
          type: string
          example: art_live_xxxxx
      - name: apiKey
        in: query
        required: false
        description: Alias for `key` — the same query-string fallback under its camelCase name.
        schema:
          type: string
      responses:
        '200':
          description: Current rate
          content:
            application/json:
              schema:
                type: object
                required:
                - rate
                - source
                properties:
                  rate:
                    type: number
                    format: double
                    example: 0.92145
                  source:
                    type: string
                    description: Data source class
                    example: mid-market
              example:
                rate: 0.92145
                source: mid-market
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '502':
          description: Upstream rate provider error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/historical-rates:
    get:
      tags:
      - Market Rates
      operationId: getHistoricalRates
      summary: Historical market rates for a currency pair
      description: Time series of mid-market rates for one pair over a preset period. `1d` returns hourly points; `7d` and `30d` daily points; `1y` weekly-sampled points. Requires an API key (Bearer header) or a logged-in session.
      security:
      - bearerAuth: []
      - sessionCookie: []
      parameters:
      - name: source
        in: query
        required: true
        description: Source currency code (ISO 4217)
        schema:
          type: string
          example: USD
      - name: target
        in: query
        required: true
        description: Target currency code (ISO 4217)
        schema:
          type: string
          example: LKR
      - name: period
        in: query
        required: false
        description: Time window
        schema:
          type: string
          enum:
          - 1d
          - 7d
          - 30d
          - 1y
          default: 7d
      - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Historical series (oldest first)
          content:
            application/json:
              schema:
                type: object
                required:
                - source
                - target
                - data
                - period
                properties:
                  source:
                    type: string
                    example: USD
                  target:
                    type: string
                    example: LKR
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          description: YYYY-MM-DD (ISO date-time for 1d period)
                          example: '2026-08-10'
                        rate:
                          type: number
                          format: double
                          example: 302.4512
                        timestamp:
                          type: integer
                          format: int64
                          description: Unix time in milliseconds
                  source_api:
                    type: string
                    example: mid-market
                  period:
                    type: string
                    enum:
                    - 1d
                    - 7d
                    - 30d
                    - 1y
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '500':
          description: Server or upstream error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/rates:
    get:
      tags:
      - Market Rates
      operationId: getRatesV1
      summary: Live and historical market rates (Wise-compatible)
      description: The main authenticated rates endpoint, parameter-compatible with the Wise `/v1/rates` API. Refreshed roughly every 60 seconds (responses cached 60s). Omit `target` for all rates from `source`; pass comma-separated targets (e.g. `target=EUR,GBP,JPY`) for multiple pairs in one call; use `time` for a point-in-time rate or `from`/`to` (+ optional `group`) for a series.
      security:
      - bearerAuth: []
      - sessionCookie: []
      parameters:
      - name: source
        in: query
        required: false
        description: Source currency code (ISO 4217)
        schema:
          type: string
          example: USD
      - name: target
        in: query
        required: false
        description: Target currency code; comma-separated list allowed (e.g. `EUR,GBP,JPY`)
        schema:
          type: string
          example: EUR
      - name: time
        in: query
        required: false
        description: Historical point-in-time (ISO 8601)
        schema:
          type: string
          format: date-time
      - name: from
        in: query
        required: false
        description: Series start date (YYYY-MM-DD)
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        description: Series end date (YYYY-MM-DD, exclusive)
        schema:
          type: string
          format: date
      - name: group
        in: query
        required: false
        description: Series granularity when using from/to
        schema:
          type: string
          enum:
          - minute
          - hour
          - day
      - $ref: '#/components/parameters/Format'
      - name: amount
        in: query
        required: false
        description: Convert this amount instead of returning a bare rate. Changes the response to a conversion object and requires exactly one source and one target (400 with a comma-separated target list). Must be non-negative.
        schema:
          type: number
          minimum: 0
        example: 1000
      - name: api_key
        in: query
        required: false
        description: API key as a query parameter, for callers that cannot set a header (browser address bar, spreadsheet IMPORTDATA). Prefer the Authorization header in production.
        schema:
          type: string
      responses:
        '200':
          description: Array of rate objects
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    rate:
                      type: number
                      format: double
                      example: 0.92145
                    source:
                      type: string
                      example: USD
                    target:
                      type: string
                      example: EUR
                    time:
                      type: string
                      format: date-time
                      example: '2026-08-11T09:00:00Z'
              example:
              - rate: 0.92145
                source: USD
                target: EUR
                time: '2026-08-11T09:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '500':
          description: Server or upstream error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/symbols:
    get:
      tags:
      - Market Rates
      - Open Endpoints
      operationId: getSymbols
      summary: List supported currencies
      description: All supported currency codes, names, and symbols. No authentication required; CORS-enabled; cached 24 hours; does not count toward your monthly quota.
      parameters:
      - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Supported currencies
          content:
            application/json:
              schema:
                type: object
                properties:
                  currencies:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: USD
                        name:
                          type: string
                          example: US Dollar
                        symbol:
                          type: string
                          example: $
                  count:
                    type: integer
                    example: 161
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/central-banks:
    get:
      tags:
      - Central Bank Rates
      operationId: listCentralBanks
      summary: List covered central banks and official sources
      description: 'Every covered source (37+ central banks, monetary authorities, and tax authorities) with metadata: country, home currency, published rate types, latest available date, days of history, official source URL, and ready-made endpoint URLs. Available on all plans.'
      security:
      - bearerAuth: []
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Covered sources
          content:
            application/json:
              schema:
                type: object
                properties:
                  banks:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: ecb
                        name:
                          type: string
                          example: European Central Bank
                        country:
                          type: string
                          example: Euro area
                        home_ccy:
                          type: string
                          example: EUR
                        kind:
                          type: string
                          description: Source type, e.g. central_bank or tax_authority
                          example: central_bank
                        rate_types:
                          type: array
                          items:
                            type: string
                          example:
                          - reference
                        latest_date:
                          type: string
                          format: date
                          example: '2026-08-10'
                        days_of_history:
                          type: integer
                          description: Distinct publication dates stored (major sources reach back to 2000 and earlier)
                          example: 6890
                        source_url:
                          type: string
                          example: https://www.ecb.europa.eu/stats/eurofxref/
                        endpoints:
                          type: object
                          properties:
                            latest:
                              type: string
                            by_date:
                              type: string
                            history:
                              type: string
                  disclaimer:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
  /api/v1/central-banks/rates:
    get:
      tags:
      - Central Bank Rates
      operationId: compareCentralBankRates
      summary: Every bank's latest official rate for one pair
      description: 'Cross-bank comparison: each covered source''s most recent official rate for the requested pair in a single call, with min/max/median and spread in basis points. Pairs a bank does not publish directly are cross-computed via that bank''s own table only (never mixing banks) and flagged `derived`. Sources whose newest publication is older than 30 days are flagged `stale` and excluded from the spread stats. Banks that cannot produce the pair are skipped. Methodology: https://allratestoday.com/official-rates-methodology/. Available on all plans.'
      security:
      - bearerAuth: []
      - sessionCookie: []
      parameters:
      - name: source
        in: query
        required: true
        description: Source currency, 3-letter code
        schema:
          type: string
          minLength: 3
          maxLength: 3
          example: USD
      - name: target
        in: query
        required: true
        description: Target currency, 3-letter code
        schema:
          type: string
          minLength: 3
          maxLength: 3
          example: EUR
      - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Latest rate for the pair from every source that can produce it
          content:
            application/json:
              schema:
                type: object
                properties:
                  source:
                    type: string
                    example: USD
                  target:
                    type: string
                    example: EUR
                  as_of:
                    type: string
                    format: date
                    description: Newest rate_date among the returned banks; each bank also carries its own rate_date
                    example: '2026-08-10'
                  count:
                    type: integer
                    example: 41
                  banks:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: ecb
                        name:
                          type: string
                          example: European Central Bank
                        rate:
                          type: number
                          example: 0.9214
                        rate_date:
                          type: string
                          format: date
                          example: '2026-08-10'
                        rate_type:
                          type: string
                          example: reference
                        derived:
                          type: boolean
                          description: True when the pair was inverted or cross-computed from the bank's own table rather than printed directly
                          example: true
                        method:
                          type: string
                          enum:
                          - published
                          - inverse
                          - cross
                          example: inverse
                        stale:
                          type: boolean
                          description: True when the bank's newest publication is older than 30 days (e.g. quarterly sources)
                          example: false
                  stats:
                    type: object
                    nullable: true
                    description: Computed over non-stale banks only; null when no fresh source covers the pair
                    properties:
                      min:
                        type: number
                        example: 0.9187
                      max:
                        type: number
                        example: 0.9241
                      median:
                        type: number
                        example: 0.9214
                      spread_bps:
                        type: number
                        description: (max - min) / median in basis points
                        example: 58.6
                      banks_in_stats:
                        type: integer
                        example: 38
                  methodology:
                    type: string
                    example: https://allratestoday.com/official-rates-methodology/
                  disclaimer:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No covered source publishes rates covering the requested pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
  /api/v1/central-bank/{bank}/latest:
    get:
      tags:
      - Central Bank Rates
      operationId: getCentralBankLatest
      summary: Latest official rate table for a bank
      description: The bank's most recent published table (e.g. `ecb`, `boc`, `cbsl`, `banxico`). Pass `source`+`target` to get a single pair — cross-computed via the bank's home currency when not directly published and flagged `derived`. Available on all plans.
      security:
      - bearerAuth: []
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/BankCode'
      - $ref: '#/components/parameters/PairSource'
      - $ref: '#/components/parameters/PairTarget'
      - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Latest published table (or single resolved pair when source+target given)
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/CbTable'
                - $ref: '#/components/schemas/CbPair'
              example:
                bank: ecb
                name: European Central Bank
                rate_date: '2026-08-10'
                rates:
                - base: EUR
                  quote: USD
                  type: reference
                  value: 1.0853
                disclaimer: Official rates as published by the named central bank. On weekends/holidays the most recent published rate_date is returned.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown bank, or the bank does not publish the requested pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '503':
          description: No rates ingested yet for this bank
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/central-bank/{bank}/{date}:
    get:
      tags:
      - Central Bank Rates
      operationId: getCentralBankByDate
      summary: Official rate table for a specific date
      description: The bank's published table in force on a date. Weekends and holidays return the most recent published date on or before the requested one — `rate_date` says which, and `published_on_requested_date` is false when they differ (this is the rate compliance users must apply). Optional `source`+`target` narrows to one pair. History reaches back to 2000 and earlier for major sources. Paid plans only. JSON only.
      security:
      - bearerAuth: []
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/BankCode'
      - name: date
        in: path
        required: true
        description: Requested date (YYYY-MM-DD)
        schema:
          type: string
          format: date
          example: '2026-06-30'
      - $ref: '#/components/parameters/PairSource'
      - $ref: '#/components/parameters/PairTarget'
      responses:
        '200':
          description: Table (or single pair) in force on the date
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/CbTableDated'
                - $ref: '#/components/schemas/CbPairDated'
              example:
                bank: cbsl
                name: Central Bank of Sri Lanka
                requested_date: '2026-06-28'
                rate_date: '2026-06-26'
                published_on_requested_date: false
                source: USD
                target: LKR
                rate: 298.7654
                rate_type: indicative
                derived: false
                method: published
                disclaimer: Official rates as published by the named central bank. On weekends/holidays the most recent published rate_date is returned.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PaidPlanRequired'
        '404':
          description: Unknown bank, no data on/before the date, or pair not covered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
  /api/v1/central-bank/{bank}/history:
    get:
      tags:
      - Central Bank Rates
      operationId: getCentralBankHistory
      summary: Official rate time series
      description: Daily series over a date range (defaults to the last year; capped at 5000 rows — narrow the range if `truncated` is true). Use `symbol` for every published pair involving one currency, or `source`+`target` for a single resolved pair per date (cross-computed via the home currency when needed, flagged `derived`). Archives reach back to 2000 and earlier for major sources. Paid plans only.
      security:
      - bearerAuth: []
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/BankCode'
      - name: symbol
        in: query
        required: false
        description: 3-letter currency code matching either side of the pair. Required unless source+target are given.
        schema:
          type: string
          example: USD
      - $ref: '#/components/parameters/PairSource'
      - $ref: '#/components/parameters/PairTarget'
      - name: from
        in: query
        required: false
        description: 'Range start (YYYY-MM-DD; default: one year before `to`)'
        schema:
          type: string
          format: date
          example: '2025-01-01'
      - name: to
        in: query
        required: false
        description: 'Range end (YYYY-MM-DD; default: today)'
        schema:
          type: string
          format: date
          example: '2025-12-31'
      - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Ascending daily series
          content:
            application/json:
              schema:
                type: object
                properties:
                  bank:
                    type: string
                    example: ecb
                  name:
                    type: string
                    example: European Central Bank
                  symbol:
                    type: string
                    example: USD
                  source:
                    type: string
                    description: Present in pair mode
                    example: USD
                  target:
                    type: string
                    description: Present in pair mode
                    example: LKR
                  from:
                    type: string
                    format: date
                  to:
                    type: string
                    format: date
                  count:
                    type: integer
                    example: 254
                  truncated:
                    type: boolean
                    description: True when the 5000-row cap was hit
                  rates:
                    type: array
                    items:
                      type: object
                      properties:
                        rate_date:
                          type: string
                          format: date
                        date:
                          type: string
                          format: date
                          description: Used instead of rate_date in pair mode
                        base:
                          type: string
                        quote:
                          type: string
                        type:
                          type: string
                        value:
                          type: number
                          format: double
                        rate:
                          type: number
                          format: double
                          description: Pair mode
                        derived:
                          type: boolean
                          description: 'Pair mode: true when not directly published'
                        method:
                          type: string
                          enum:
                          - published
                          - inverse
                          - cross
                          description: Pair mode
                  disclaimer:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PaidPlanRequired'
        '404':
          description: Unknown bank or pair not covered in range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
  /api/v1/central-bank/{bank}/availability:
    get:
      tags:
      - Central Bank Rates
      operationId: getCentralBankAvailability
      summary: Publication calendar for a bank
      description: The dates a bank actually published a table, for one year (`?year=2026`) or a date range (defaults to the last year; capped at 3700 dates). Weekends, holidays, and weekly/quarterly cadences show up as missing dates. Dates only, no values — available on all plans.
      security:
      - bearerAuth: []
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/BankCode'
      - name: year
        in: query
        required: false
        description: Whole calendar year (overrides from/to)
        schema:
          type: integer
          example: 2026
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Ascending list of published dates
          content:
            application/json:
              schema:
                type: object
                properties:
                  bank:
                    type: string
                    example: boc
                  name:
                    type: string
                    example: Bank of Canada
                  from:
                    type: string
                    format: date
                  to:
                    type: string
                    format: date
                  count:
                    type: integer
                    example: 251
                  truncated:
                    type: boolean
                  dates:
