    get:
      tags:
      - Authentication
      - Open Endpoints
      operationId: describeTrialKeys
      summary: How to self-issue a trial key — keyless
      description: Describes the trial-key contract (method, body, limits) so an agent that only knows the URL can use it.
      responses:
        '200':
          description: Endpoint manifest
          content:
            application/json:
              schema:
                type: object
    post:
      tags:
      - Authentication
      - Open Endpoints
      operationId: issueTrialKey
      summary: Self-issue a 100-call trial API key — no account, no email
      description: 'Built for AI agents and other machine callers that cannot complete the human sign-up (captcha + email verification). Returns a key with 100 lifetime calls, valid 7 days, that unlocks everything a free account gets: real-time rates, latest central-bank tables, publication calendars (historical and dated rates, market and central-bank, are on paid plans). Limits: 3 keys per IP per day, 100 per day in total. Exhausted keys answer 429 with an upgrade_url. For a lasting key register at https://allratestoday.com/register (300 calls, free). Send `Content-Type: application/json` (an empty JSON object is fine); a POST without it is rejected as a cross-site form.'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                agent:
                  type: string
                  maxLength: 80
                  description: 'Optional: the agent or product requesting the key.'
                purpose:
                  type: string
                  maxLength: 200
                  description: 'Optional: one line on what the rates are for.'
        description: 'Optional fields. Always send `Content-Type: application/json`, with `{}` if you have nothing to say.'
      responses:
        '201':
          description: Trial key issued
          content:
            application/json:
              schema:
                type: object
                required:
                - api_key
                - calls_included
                - expires_at
                properties:
                  api_key:
                    type: string
                    example: art_live_k3j9x2m7q1w8e5r4t6y0u2i8o3p5a7s1
                  calls_included:
                    type: integer
                    example: 100
                  expires_at:
                    type: string
                    format: date-time
                  how_to_use:
                    type: string
                  mcp_url:
                    type: string
                    format: uri
                  included:
                    type: string
                  upgrade:
                    type: object
                    properties:
                      free_account:
                        type: string
                      paid_plans:
                        type: string
                  attribution:
                    type: string
        '429':
          description: Per-IP cap reached or too many attempts
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  retry_after_s:
                    type: integer
        '503':
          description: Today's global allocation is used up
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
