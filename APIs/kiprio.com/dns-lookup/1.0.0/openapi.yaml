openapi: 3.0.3
servers:
  - url: https://kiprio.com/v1/dns-lookup
info:
  description: >-
    Look up DNS records for any domain. Supports A, AAAA, MX, TXT, CNAME, NS,
    SOA, PTR, and CAA record types. No API key required for free tier.
  title: DNS Lookup API
  version: 1.0.0
  x-apisguru-categories:
    - network
  x-logo:
    url: https://kiprio.com/logo.png
  x-origin:
    - format: openapi
      url: https://kiprio.com/v1/dns-lookup/openapi.json
paths:
  /lookup:
    get:
      summary: Look up DNS records for a domain
      parameters:
        - name: domain
          in: query
          required: true
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            default: A
      responses:
        "200":
          description: DNS records for the domain