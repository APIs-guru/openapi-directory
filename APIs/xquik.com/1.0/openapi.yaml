                    },
                    "example": [
                      "#giveaway"
                    ]
                  },
                  "requiredKeywords": {
                    "type": "array",
                    "items": {
                      "type": "string"
                    },
                    "example": [
                      "entered"
                    ]
                  },
                  "requiredMentions": {
                    "type": "array",
                    "items": {
                      "type": "string"
                    },
                    "example": [
