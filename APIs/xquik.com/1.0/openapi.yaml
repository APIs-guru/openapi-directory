    "/api/v1/guest-wallets": {
      "post": {
        "operationId": "createGuestWallet",
        "summary": "Create an accountless prepaid wallet checkout",
        "description": "Create a one-use Stripe-hosted checkout after the user explicitly confirms a $10-$250 USD amount. This request creates no charge by itself. The user opens checkout_url on Stripe. This endpoint returns the paid-read API key without requiring an Xquik account, email, dashboard, or Xquik web page. An idempotent replay returns the same key.\n",
        "tags": [
          "Guest Wallets"
        ],
        "security": [],
        "parameters": [
          {
            "$ref": "#/components/parameters/GuestIdempotencyKey"
          }
        ],
        "requestBody": {
          "required": true,
          "description": "Confirmed USD amount in cents.",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/GuestWalletPurchaseRequest"
              },
              "example": {
                "amount_minor": 1000,
                "currency": "usd"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Stripe-hosted checkout, guest API key, and API status URL.\n",
            "headers": {
              "Cache-Control": {
                "description": "Prevents storage of the secret-bearing response.",
                "schema": {
                  "type": "string",
                  "const": "no-store, private"
                }
              },
              "Idempotent-Replayed": {
                "description": "Present as true when replaying the same request.",
                "schema": {
                  "type": "string",
                  "const": "true"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/GuestWalletCreateResponse"
                },
                "example": {
                  "account_required": false,
                  "amount": {
                    "amount_minor": 1000,
                    "currency": "usd"
                  },
                  "api_key": "xq_example_returned_once",
                  "authorization": {
                    "header": "Authorization",
                    "scheme": "Bearer"
                  },
                  "checkout_url": "https://buy.stripe.com/example",
                  "credential_notice": "Store api_key and the Idempotency-Key securely before sharing checkout_url. No email recovery is available.",
                  "credits": "66666",
                  "expires_at": "2026-07-13T13:00:00.000Z",
                  "instructions": "Give checkout_url to the user. They must complete payment on Stripe. Never submit payment for them. After payment, poll status_url every poll_after_seconds until latest_purchase.status is no longer pending.",
                  "poll_after_seconds": 2,
                  "purchase_id": "gp_example",
                  "requires_user_interaction": true,
                  "status": "pending",
                  "status_url": "https://xquik.com/api/v1/guest-wallets/status",
                  "wallet_id": "gw_example"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/InvalidInput"
          },
          "409": {
            "description": "Idempotency-Key was reused with a different request.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "410": {
            "description": "Checkout expired or can no longer be used.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "413": {
            "description": "Request body is too large.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "415": {
            "description": "Content-Type must be application/json.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "423": {
            "description": "Guest wallet is unavailable.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "429": {
            "$ref": "#/components/responses/RateLimitExceeded"
          },
          "503": {
            "description": "Guest wallet checkout is unavailable.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
