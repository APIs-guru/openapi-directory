  "paths": {
    "/api/v1/account": {
      "get": {
        "operationId": "getAccount",
        "summary": "Get account info",
        "tags": [
          "Account"
        ],
        "security": [
          {
            "apiKey": []
          },
          {
            "oauthBearer": []
          }
        ],
        "responses": {
          "200": {
            "description": "Account info",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "plan",
                    "monitorsUsed",
                    "monitorsAllowed",
                    "monitorBilling"
                  ],
                  "properties": {
                    "plan": {
                      "type": "string",
                      "enum": [
                        "active",
                        "inactive"
                      ],
                      "example": "active"
                    },
                    "monitorsUsed": {
                      "type": "integer",
                      "example": 3
                    },
                    "monitorsAllowed": {
                      "type": "integer",
                      "deprecated": true,
                      "x-stainless-deprecation-message": "Monitor slots are unlimited. Use monitorBilling.unlimitedSlots instead.",
                      "description": "Deprecated. Monitor slots are unlimited, so this is always Number.MAX_SAFE_INTEGER.",
                      "example": 9007199254740991
                    },
                    "monitorBilling": {
                      "type": "object",
                      "required": [
                        "activeDailyEstimate",
                        "activeHourlyBurn",
                        "creditsPerActiveMonitorDay",
                        "creditsPerActiveMonitorHour",
                        "eventsIncluded",
                        "instantCheckIntervalSeconds",
                        "unlimitedSlots"
                      ],
                      "properties": {
                        "activeDailyEstimate": {
                          "type": "string",
                          "description": "Estimated daily credits for currently active monitors.",
                          "example": "1500"
                        },
                        "activeHourlyBurn": {
                          "type": "string",
                          "description": "Credits charged each hour for currently active monitors.",
                          "example": "63"
                        },
                        "creditsPerActiveMonitorDay": {
                          "type": "string",
                          "description": "Estimated daily credits for 1 active instant monitor.",
                          "example": "500"
                        },
                        "creditsPerActiveMonitorHour": {
                          "type": "string",
                          "description": "Hourly credits charged for 1 active instant monitor.",
                          "example": "21"
                        },
                        "eventsIncluded": {
                          "type": "boolean",
                          "description": "Webhook and event deliveries are included in monitor billing.",
                          "example": true
                        },
                        "instantCheckIntervalSeconds": {
                          "type": "integer",
                          "description": "Active monitors check every 1 second.",
                          "example": 1
                        },
                        "unlimitedSlots": {
                          "type": "boolean",
                          "description": "Monitor slot count is unlimited.",
                          "example": true
                        }
                      }
                    },
                    "creditInfo": {
                      "type": "object",
                      "required": [
                        "balance",
                        "lifetimePurchased",
                        "lifetimeUsed",
                        "autoTopupEnabled",
                        "autoTopupAmountDollars",
                        "autoTopupThreshold"
                      ],
                      "properties": {
                        "balance": {
                          "type": "string",
                          "description": "Bigint string to preserve precision above Number.MAX_SAFE_INTEGER.",
                          "example": "50000"
                        },
                        "lifetimePurchased": {
                          "type": "string",
                          "description": "Total purchased credits as a bigint string.",
                          "example": "140000"
                        },
                        "lifetimeUsed": {
                          "type": "string",
                          "description": "Total consumed credits as a bigint string.",
                          "example": "90000"
                        },
                        "autoTopupEnabled": {
                          "type": "boolean",
                          "example": false
                        },
                        "autoTopupAmountDollars": {
                          "type": "number",
                          "description": "Dollar amount charged when automatic top-up runs.",
                          "example": 10
                        },
                        "autoTopupThreshold": {
                          "type": "string",
                          "description": "Bigint string threshold that triggers automatic top-up when enabled.",
                          "example": "50000"
                        }
                      },
                      "example": {
                        "balance": "50000",
                        "lifetimePurchased": "140000",
                        "lifetimeUsed": "90000",
                        "autoTopupEnabled": false,
                        "autoTopupAmountDollars": 10,
                        "autoTopupThreshold": "50000"
                      }
                    },
                    "xUsername": {
                      "type": "string",
                      "description": "Linked X username, omitted when no X account is connected.",
                      "example": "elonmusk"
                    }
                  }
                },
                "example": {
                  "plan": "active",
                  "monitorsUsed": 3,
                  "monitorsAllowed": 9007199254740991,
                  "monitorBilling": {
                    "activeDailyEstimate": "1500",
                    "activeHourlyBurn": "63",
                    "creditsPerActiveMonitorDay": "500",
                    "creditsPerActiveMonitorHour": "21",
                    "eventsIncluded": true,
                    "instantCheckIntervalSeconds": 1,
                    "unlimitedSlots": true
                  },
                  "creditInfo": {
                    "balance": "50000",
                    "lifetimePurchased": "140000",
                    "lifetimeUsed": "90000",
                    "autoTopupEnabled": false,
                    "autoTopupAmountDollars": 10,
                    "autoTopupThreshold": "50000"
                  },
                  "xUsername": "elonmusk"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthenticated"
          },
          "429": {
            "$ref": "#/components/responses/RateLimitExceeded"
          }
        }
      },
      "patch": {
        "operationId": "updateAccount",
        "summary": "Update account locale",
        "tags": [
          "Account"
        ],
        "security": [
          {
            "apiKey": []
          },
          {
            "oauthBearer": []
          }
        ],
        "requestBody": {
          "required": true,
          "description": "Locale preference for the account.",
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "locale"
                ],
                "properties": {
                  "locale": {
                    "type": "string",
                    "enum": [
                      "en",
                      "tr",
                      "es"
                    ],
                    "example": "en"
                  }
                }
              },
              "example": {
                "locale": "en"
              }
            }
          }
        },
        "responses": {
          "200": {
            "$ref": "#/components/responses/Success"
          },
          "400": {
            "$ref": "#/components/responses/InvalidInput"
          },
          "401": {
            "$ref": "#/components/responses/Unauthenticated"
          },
          "429": {
            "$ref": "#/components/responses/RateLimitExceeded"
          }
        }
      }
    },
