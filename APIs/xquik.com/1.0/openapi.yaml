                      "example": []
                    }
                  }
                },
                "example": {
                  "keys": []
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthenticated"
          },
          "429": {
            "$ref": "#/components/responses/RateLimitExceeded"
          }
        }
      },
      "post": {
        "operationId": "createApiKey",
        "summary": "Create API key",
        "tags": [
          "API Keys"
        ],
        "security": [
          {
            "cookieSession": []
          }
        ],
        "requestBody": {
          "required": true,
          "description": "Optional display name for the new API key.",
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "name": {
                    "type": "string",
                    "example": "My API Key"
                  }
                }
              },
              "example": {
                "name": "My API Key"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "API key created",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "id",
                    "fullKey",
                    "name",
                    "prefix",
                    "createdAt"
                  ],
                  "properties": {
                    "id": {
                      "type": "string",
                      "example": "42"
                    },
                    "fullKey": {
                      "type": "string",
                      "example": "xq_live_abc123def456"
                    },
                    "name": {
                      "type": "string",
                      "example": "My API Key"
                    },
                    "prefix": {
                      "type": "string",
                      "example": "xq_live_abc1"
                    },
                    "createdAt": {
                      "type": "string",
                      "format": "date-time",
                      "example": "2025-01-15T12:00:00Z"
                    }
                  }
                },
                "example": {
                  "id": "42",
                  "fullKey": "xq_live_abc123def456",
                  "name": "My API Key",
                  "prefix": "xq_live_abc1",
                  "createdAt": "2025-01-15T12:00:00Z"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthenticated"
          },
          "403": {
            "description": "API key limit reached",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "error",
                    "limit",
                    "message"
                  ],
                  "properties": {
                    "error": {
                      "type": "string",
                      "const": "api_key_limit_reached",
                      "example": "api_key_limit_reached"
                    },
                    "limit": {
                      "type": "integer",
                      "example": 100
                    },
                    "message": {
                      "type": "string",
                      "example": "API key limit reached. Delete an existing key first."
                    }
                  }
                },
                "example": {
                  "error": "api_key_limit_reached",
                  "limit": 100,
                  "message": "API key limit reached. Delete an existing key first."
                }
              }
            }
          },
          "429": {
            "$ref": "#/components/responses/RateLimitExceeded"
          }
        }
      }
    },
