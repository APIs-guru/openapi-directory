                    "description": "Array of public media URLs to attach. Supports up to 4 images or exactly 1 MP4 video up to 100 MB. Each URL must be publicly reachable. Attached media adds 2 credits per started MB across all files.",
                    "example": [
                      "https://example.com/video.mp4"
                    ]
                  }
                }
              },
              "example": {
                "account": "@elonmusk",
                "text": "Just launched our new feature!"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Tweet created",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "tweetId",
                    "success",
                    "charged",
                    "chargedCredits"
                  ],
                  "properties": {
                    "tweetId": {
                      "type": "string",
                      "example": "1234567890"
                    },
                    "success": {
                      "type": "boolean",
                      "const": true,
                      "example": true
                    },
                    "charged": {
                      "type": "boolean",
                      "example": true
                    },
                    "chargedCredits": {
                      "type": "string",
                      "description": "Credits charged for this tweet. Text-only tweets and replies cost 30 credits; attached media adds 2 credits per started MB.",
                      "example": "32"
                    },
                    "writeActionId": {
                      "type": "string",
                      "example": "42"
                    }
                  }
                },
                "example": {
                  "tweetId": "1234567890",
                  "success": true,
                  "charged": true,
                  "chargedCredits": "32"
                }
              }
            }
          },
          "202": {
            "description": "Write was dispatched but final confirmation is still pending. Do not retry-send the same write. Poll the write action status instead.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "error",
                    "status",
                    "writeActionId",
                    "charged",
                    "chargedCredits",
                    "retryable"
                  ],
                  "properties": {
                    "error": {
                      "type": "string",
                      "const": "x_write_unconfirmed"
                    },
                    "status": {
                      "type": "string",
                      "const": "pending_confirmation"
                    },
                    "writeActionId": {
                      "type": "string",
                      "example": "42"
                    },
                    "charged": {
                      "type": "boolean",
                      "const": false
                    },
                    "chargedCredits": {
                      "type": "string",
                      "example": "0"
                    },
                    "retryable": {
                      "type": "boolean",
                      "const": false
                    },
                    "message": {
                      "type": "string",
                      "example": "Action may have completed, but confirmation is still pending."
                    }
                  }
                },
                "example": {
                  "error": "x_write_unconfirmed",
                  "status": "pending_confirmation",
                  "writeActionId": "42",
                  "charged": false,
                  "chargedCredits": "0",
                  "retryable": false,
                  "message": "Action may have completed, but confirmation is still pending."
                }
              }
            }
          },
          "400": {
            "description": "Invalid input or unsupported field",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "examples": {
                  "InvalidInput": {
                    "summary": "Invalid input",
                    "value": {
                      "error": "invalid_input",
                      "message": "Either text or media is required"
                    }
                  },
                  "UnsupportedField": {
                    "summary": "Unsupported field on POST /x/tweets",
                    "value": {
                      "error": "unsupported_field",
                      "message": "media_ids is not supported on POST /x/tweets. Pass media as an array of public image or MP4 video URLs.",
                      "retryable": false,
                      "details": {
                        "action": "create_tweet",
                        "suggestion": "Use the media field with public URLs instead of media_ids. Send up to 4 images or exactly 1 MP4 video."
                      }
                    }
                  }
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthenticated"
          },
          "402": {
            "$ref": "#/components/responses/PaymentRequired"
          },
          "403": {
            "$ref": "#/components/responses/AccountAuthError"
          },
          "422": {
            "$ref": "#/components/responses/WriteRejected"
          },
          "429": {
            "$ref": "#/components/responses/WriteRateLimited"
          },
          "500": {
            "$ref": "#/components/responses/WriteError"
          },
          "503": {
            "$ref": "#/components/responses/TransientError"
          }
        }
      }
