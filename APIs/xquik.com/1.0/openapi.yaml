                    "type": "integer",
                    "default": 1,
                    "example": 3
                  },
                  "backupCount": {
                    "type": "integer",
                    "example": 2
                  },
                  "uniqueAuthorsOnly": {
                    "type": "boolean",
                    "example": true
                  },
                  "mustRetweet": {
                    "type": "boolean",
                    "example": true
                  },
                  "mustFollowUsername": {
                    "type": "string",
                    "example": "elonmusk"
                  },
                  "filterMinFollowers": {
                    "type": "integer",
                    "example": 50
                  },
