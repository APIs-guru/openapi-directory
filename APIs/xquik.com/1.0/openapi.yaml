      },
      "WriteError": {
        "description": "Write operation failed. Possible error codes include x_write_failed, x_write_ambiguous, x_duplicate_action, x_daily_limit (429 - account reached daily posting limit, wait 24 hours), and x_write_unconfirmed (202 - action may have completed but could not be confirmed, verify before retrying).\n",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            },
            "example": {
              "error": "x_write_failed",
              "message": "Write action failed unexpectedly. Contact support if this persists."
            }
          }
        }
      },
      "WriteRejected": {
        "description": "X rejected the write or the media URL could not be downloaded. Possible codes: `x_content_too_long`, `x_duplicate_action`, `x_account_suspended`, `x_account_protected`, `x_dm_not_allowed`, `x_target_not_found`, `x_account_feature_required`, `x_rejected`, `media_download_failed` (URL fetch path only - body.url not HTTPS, resolves to private IP, file too large, origin error, or timeout).\n",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            },
            "example": {
              "error": "x_rejected",
              "message": "X rejected this request. Wait a few minutes and try again."
            }
          }
        }
      },
      "RateLimitedByX": {
        "description": "X throttled the write. Possible codes: `x_rate_limited` (short-term throttle) or `x_daily_limit` (daily cap hit). Back off and retry later. Distinct from Xquik tier-based 429.\n",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            },
            "example": {
              "error": "x_rate_limited",
              "message": "Rate limited by X. Wait before retrying."
            }
          }
        }
      },
      "WriteRateLimited": {
        "description": "A write was throttled by Xquik's tier or action limits (`rate_limit_exceeded`) or by X (`x_rate_limited`, `x_daily_limit`). Respect the `Retry-After` header when present, otherwise back off before retrying.\n",
        "content": {
          "application/json": {
            "schema": {
              "allOf": [
                {
                  "$ref": "#/components/schemas/Error"
                },
                {
                  "type": "object",
                  "properties": {
                    "retryAfter": {
                      "type": "integer",
                      "example": 60
                    }
                  }
                }
              ]
            },
            "examples": {
              "xquikLimit": {
                "summary": "Xquik tier or action limit",
                "value": {
                  "error": "rate_limit_exceeded",
                  "message": "Too many requests. Try again later.",
                  "retryAfter": 60
                }
              },
              "xLimit": {
                "summary": "X rate limit",
                "value": {
                  "error": "x_rate_limited",
                  "message": "Rate limited by X. Wait before retrying."
                }
              }
            }
          }
        }
      },
      "TransientError": {
        "description": "A transient upstream issue occurred. Safe to retry with exponential backoff. Returns error code `x_transient_error`.\n",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            },
            "example": {
              "error": "x_transient_error",
              "message": "X is temporarily unavailable. Retry after a short delay."
            }
          }
        }
      },
      "XApiError": {
        "description": "Dependency unavailable, unauthorized, or rate limited. Default v1 returns 502. The best-practice response contract returns 424 for transparent dependency failures.\n",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            },
            "example": {
              "error": "x_api_unavailable",
              "message": "X data source temporarily unavailable. Try again later."
            }
          }
        }
      },
      "FavoritersUnavailable": {
        "description": "X reports likes for the post but does not expose the corresponding user identities. Returns error code `favoriters_unavailable`.\n",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            },
            "example": {
              "error": "favoriters_unavailable",
              "message": "Users who liked this post are unavailable. Use retweeters or replies instead."
            }
          }
        }
      },
      "RepliesIncomplete": {
        "description": "The direct replies page ended before the post's reported reply count. Returns error code `replies_incomplete` so verification workflows do not treat partial coverage as exhaustive.\n",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            },
            "example": {
              "error": "replies_incomplete",
              "message": "Replies are incomplete. Use tweet search with a conversation_id filter."
            }
          }
        }
      },
      "ConnectAlreadyConnected": {
        "description": "The specified X account is already connected to this Xquik account. Returns error code `account_already_connected`.\n",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            },
            "example": {
              "error": "account_already_connected",
              "message": "This X account is already connected."
            }
          }
        }
      },
      "ConnectLoginFailed": {
        "description": "Could not authenticate with X. The provided credentials (username, password, or TOTP secret) were rejected. Returns error code `login_failed`.\n",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            },
            "example": {
              "error": "login_failed",
              "message": "Login failed. Check credentials and try again."
            }
          }
        }
      },
      "ConnectLoginCooldown": {
        "description": "A prior login attempt triggered a cooldown. Response includes `reason`, `retryAfterMs`, and a `Retry-After` header in seconds. Returns error code `login_cooldown`.\n",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            },
            "example": {
              "error": "login_cooldown",
              "message": "Login is temporarily paused"
            }
          }
        }
      },
      "ConnectRateLimitExceeded": {
        "description": "Too many requests. Either the generous connection safety limit was exceeded (`rate_limit_exceeded`, `retryAfter` seconds, `Retry-After: 900` header) or a prior login attempt triggered a cooldown (`login_cooldown`, `reason`, `retryAfterMs`, `Retry-After` header in seconds).\n",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            },
            "example": {
              "error": "rate_limit_exceeded",
              "message": "Too many requests. Retry later."
            }
          }
        }
      },
      "RateLimitExceeded": {
        "description": "Xquik tier rate limit exceeded. The response includes a `Retry-After` header with the number of seconds to wait before retrying.\n",
        "content": {
          "application/json": {
            "schema": {
              "allOf": [
                {
                  "$ref": "#/components/schemas/Error"
                },
                {
                  "type": "object",
                  "properties": {
                    "retryAfter": {
                      "type": "integer",
                      "example": 60
                    }
                  }
                }
              ]
            },
            "example": {
              "error": "rate_limit_exceeded",
              "message": "Too many requests. Try again later.",
              "retryAfter": 60
            }
          }
        }
      },
      "ConnectUserLookupFailed": {
        "description": "The X username could not be resolved. Verify the handle is correct and the account exists. Default v1 returns 502. The best-practice response contract returns 424. Error code: `x_user_lookup_failed`.\n",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            },
            "example": {
              "error": "x_user_lookup_failed",
              "message": "X username lookup failed. Try again later."
            }
          }
        }
      },
      "ConnectServiceUnavailable": {
        "description": "The X connection service is temporarily unavailable. Retry after a short delay. Returns error code `service_unavailable`.\n",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            },
            "example": {
              "error": "service_unavailable",
              "message": "Service temporarily unavailable. Try again later."
            }
          }
        }
      },
      "ReauthAccountNotFound": {
        "description": "No X account with this ID belongs to the authenticated user. Returns error code `account_not_found`.\n",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            },
            "example": {
              "error": "account_not_found",
              "message": "X account not found."
            }
          }
        }
      }
    },
    "schemas": {
      "PaginatedTweets": {
        "description": "Paginated tweet results. The item count can be lower than pageSize when the source returns fewer tweets, filters remove tweets, or remaining credits cover fewer results. Follow next_cursor while has_next_page is true. An empty page can still have has_next_page true after filtering. Zero affordable results returns 402 insufficient_credits.\n",
        "type": "object",
        "required": [
          "tweets",
          "has_next_page",
          "next_cursor"
        ],
        "properties": {
          "tweets": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/SearchTweet"
            },
            "example": [
              {
                "id": "1234567890",
                "text": "Just launched our new feature!",
                "retweetCount": 5,
                "replyCount": 3,
                "likeCount": 42,
                "quoteCount": 1,
                "viewCount": 1500,
                "bookmarkCount": 2
              }
            ]
          },
          "has_next_page": {
            "type": "boolean",
            "example": true
          },
          "next_cursor": {
            "type": "string",
            "example": "DAACCgACGRElMJcAAA"
          }
        }
      },
      "PaginatedUsers": {
        "description": "Paginated user profiles. The item count can be lower than pageSize when the source returns fewer profiles or remaining credits cover fewer results. Follow next_cursor while has_next_page is true. A relationship can naturally contain fewer profiles than requested. Zero affordable results returns 402 insufficient_credits.\n",
        "type": "object",
        "required": [
          "users",
          "has_next_page",
          "next_cursor"
        ],
        "properties": {
          "users": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/UserProfile"
            },
            "example": [
              {
                "id": "9876543210",
                "username": "elonmusk",
                "name": "Elon Musk"
              }
            ]
          },
          "has_next_page": {
            "type": "boolean",
            "example": true
          },
          "next_cursor": {
            "type": "string",
            "example": "DAACCgACGRElMJcAAA"
          }
        }
      },
      "BatchUsers": {
        "description": "Batch user lookup results. Duplicate requested IDs are ignored while preserving first-seen order. unavailable_ids identifies processed IDs with no returned profile. unprocessed_ids identifies IDs skipped when available credits limit processing.\n",
        "type": "object",
        "required": [
          "users",
          "has_next_page",
          "next_cursor",
          "requested_count",
          "processed_count",
          "returned_count",
          "unavailable_ids",
          "unprocessed_ids"
        ],
        "properties": {
          "users": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/UserProfile"
            }
          },
          "has_next_page": {
            "type": "boolean",
            "const": false,
            "description": "Batch lookups never paginate."
          },
          "next_cursor": {
            "type": "string",
            "description": "Empty because batch lookups never paginate.",
            "maxLength": 0,
            "example": ""
          },
          "requested_count": {
            "type": "integer",
            "minimum": 0,
            "maximum": 100,
            "description": "Number of unique IDs requested."
          },
          "processed_count": {
            "type": "integer",
            "minimum": 0,
            "maximum": 100,
            "description": "Number of requested IDs included in the lookup."
          },
          "returned_count": {
            "type": "integer",
            "minimum": 0,
            "maximum": 100,
            "description": "Number of user profiles returned and charged."
          },
          "unavailable_ids": {
            "type": "array",
            "description": "Processed IDs with no returned profile, in first-seen request order.",
            "items": {
              "type": "string",
              "pattern": "^\\d+$"
            }
          },
          "unprocessed_ids": {
            "type": "array",
            "description": "Requested IDs skipped because available credits limited processing. Retry these IDs after adding credits.",
            "items": {
              "type": "string",
              "pattern": "^\\d+$"
            }
          }
        }
      },
      "GuestWalletAmount": {
        "description": "Confirmed USD amount for a guest wallet purchase.",
        "type": "object",
        "additionalProperties": false,
        "required": [
          "amount_minor",
          "currency"
        ],
        "properties": {
          "amount_minor": {
            "type": "integer",
            "minimum": 1000,
            "maximum": 25000,
            "description": "USD amount in cents. Accepted range is $10-$250.",
            "example": 1000
          },
          "currency": {
            "type": "string",
            "const": "usd"
          }
        }
      },
      "GuestWalletAmountBounds": {
        "description": "Accepted guest wallet purchase range in USD cents.",
        "type": "object",
        "additionalProperties": false,
        "required": [
          "currency",
          "maximum_minor",
          "minimum_minor"
        ],
        "properties": {
          "currency": {
            "type": "string",
            "const": "usd"
          },
          "maximum_minor": {
            "type": "integer",
            "const": 25000
          },
          "minimum_minor": {
            "type": "integer",
            "const": 1000
          }
        }
      },
      "GuestWalletPurchaseRequest": {
        "description": "User-confirmed guest wallet checkout request.",
        "type": "object",
        "additionalProperties": false,
        "required": [
          "amount_minor",
          "currency"
        ],
        "properties": {
          "amount_minor": {
            "type": "integer",
            "minimum": 1000,
            "maximum": 25000,
            "description": "Confirmed USD amount in cents.",
            "example": 1000
          },
          "currency": {
            "type": "string",
            "const": "usd"
          }
        }
      },
      "GuestWalletCheckoutResponse": {
        "description": "Pending Stripe checkout and guest wallet purchase details.",
        "type": "object",
        "additionalProperties": false,
        "required": [
          "account_required",
          "amount",
          "checkout_url",
          "credits",
          "expires_at",
          "instructions",
          "poll_after_seconds",
          "purchase_id",
          "requires_user_interaction",
          "status",
          "status_url",
          "wallet_id"
        ],
        "properties": {
          "account_required": {
            "type": "boolean",
            "const": false
          },
          "amount": {
            "$ref": "#/components/schemas/GuestWalletAmount"
          },
          "api_key": {
            "type": "string",
            "format": "password",
            "description": "Paid-read bearer credential returned only by initial creation. Store it as a secret. Never place it in a URL or log.\n",
            "example": "xq_example_returned_once"
          },
          "authorization": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "header",
              "scheme"
            ],
            "properties": {
              "header": {
                "type": "string",
                "enum": [
                  "Authorization"
                ],
                "example": "Authorization"
              },
              "scheme": {
                "type": "string",
                "enum": [
                  "Bearer"
                ],
                "example": "Bearer"
              }
            }
          },
          "checkout_url": {
            "type": "string",
            "format": "uri",
            "pattern": "^https://buy\\.stripe\\.com/",
            "description": "Raw Stripe-hosted checkout URL for user interaction.",
            "example": "https://buy.stripe.com/example"
          },
          "credits": {
            "type": "string",
            "pattern": "^\\d+$",
            "description": "Credits granted after verified payment.",
            "example": "66666"
          },
          "credential_notice": {
            "type": "string",
            "const": "Store api_key and the Idempotency-Key securely before sharing checkout_url. No email recovery is available."
          },
          "expires_at": {
            "type": "string",
            "format": "date-time",
            "description": "Time when the pending checkout expires.",
            "example": "2026-07-13T13:00:00.000Z"
          },
          "instructions": {
            "type": "string",
            "const": "Give checkout_url to the user. They must complete payment on Stripe. Never submit payment for them. After payment, poll status_url every poll_after_seconds until latest_purchase.status is no longer pending."
          },
          "poll_after_seconds": {
            "type": "integer",
            "const": 2,
            "description": "Wait at least this long before polling status_url."
          },
          "purchase_id": {
            "type": "string",
            "pattern": "^gp_[A-Za-z0-9_-]+$",
            "example": "gp_example"
          },
          "requires_user_interaction": {
            "type": "boolean",
            "const": true
          },
          "status": {
            "type": "string",
            "enum": [
              "creating",
              "pending",
              "paid",
              "expired",
              "failed",
              "refunded",
              "disputed"
            ],
            "example": "pending"
          },
          "status_url": {
            "type": "string",
            "format": "uri",
            "const": "https://xquik.com/api/v1/guest-wallets/status"
          },
          "wallet_id": {
            "type": "string",
            "pattern": "^gw_[A-Za-z0-9_-]+$",
            "example": "gw_example"
          }
        }
      },
      "GuestWalletCreateResponse": {
        "description": "Initial guest wallet response containing the one-time key.",
        "allOf": [
          {
            "$ref": "#/components/schemas/GuestWalletCheckoutResponse"
          },
          {
            "type": "object",
            "required": [
              "api_key",
              "authorization",
              "credential_notice"
            ]
          }
        ]
      },
      "GuestWalletTopupResponse": {
        "description": "Existing guest wallet top-up response without a new key.",
        "allOf": [
          {
            "$ref": "#/components/schemas/GuestWalletCheckoutResponse"
          },
          {
            "not": {
              "anyOf": [
                {
                  "type": "object",
                  "properties": {
                    "api_key": {
                      "type": "string"
                    }
                  },
                  "required": [
                    "api_key"
                  ]
                },
                {
                  "type": "object",
                  "properties": {
                    "authorization": {
                      "type": "object"
                    }
                  },
                  "required": [
                    "authorization"
                  ]
                }
              ]
            }
          }
        ]
      },
      "GuestWalletPurchaseStatus": {
        "description": "Latest guest wallet purchase fulfillment state.",
        "type": "object",
        "additionalProperties": false,
        "required": [
          "amount",
          "checkout_url",
          "credits",
          "expires_at",
          "purchase_id",
          "status"
        ],
        "properties": {
          "amount": {
            "$ref": "#/components/schemas/GuestWalletAmount"
          },
          "checkout_url": {
            "anyOf": [
              {
                "type": "string",
                "format": "uri",
                "pattern": "^https://buy\\.stripe\\.com/"
              },
              {
                "type": "null"
              }
            ],
            "description": "Present only while the purchase is pending.",
            "example": null
          },
          "credits": {
            "type": "string",
            "pattern": "^\\d+$",
            "example": "66666"
          },
          "expires_at": {
            "type": "string",
            "format": "date-time",
            "example": "2026-07-13T13:00:00.000Z"
          },
          "purchase_id": {
            "type": "string",
            "pattern": "^gp_[A-Za-z0-9_-]+$",
            "example": "gp_example"
          },
          "status": {
            "type": "string",
            "enum": [
              "creating",
              "pending",
              "paid",
              "expired",
              "failed",
              "refunded",
              "disputed"
            ],
            "example": "paid"
          }
        }
      },
      "GuestWalletStatusResponse": {
        "description": "Current balance, usability, and latest guest purchase state.",
        "type": "object",
        "additionalProperties": false,
        "required": [
          "balance",
          "latest_purchase",
          "poll_after_seconds",
          "scope",
          "status",
          "top_up",
          "usable",
          "wallet_id"
        ],
        "properties": {
          "balance": {
            "type": "string",
            "pattern": "^\\d+$",
            "example": "66666"
          },
          "latest_purchase": {
            "description": "Latest purchase state. This does not determine usability.",
            "anyOf": [
              {
                "$ref": "#/components/schemas/GuestWalletPurchaseStatus"
              },
              {
                "type": "null"
              }
            ],
            "example": {
              "amount": {
                "amount_minor": 1000,
                "currency": "usd"
              },
              "checkout_url": null,
              "credits": "66666",
              "expires_at": "2026-07-13T13:00:00.000Z",
              "purchase_id": "gp_example",
              "status": "paid"
            }
          },
          "poll_after_seconds": {
            "description": "Polling delay while payment is pending. Null means stop.",
            "anyOf": [
              {
                "type": "integer",
                "const": 2
              },
              {
                "type": "null"
              }
            ]
          },
          "scope": {
            "type": "string",
            "const": "paid_reads"
          },
          "status": {
            "type": "string",
            "description": "Combined wallet and pending-checkout state. A pending top-up can coexist with usable true. Terminal expired or failed states require a new guest wallet.\n",
            "enum": [
              "active",
              "pending",
              "expired",
              "failed",
              "frozen",
              "closed"
            ],
            "example": "active"
          },
          "top_up": {
            "description": "Top-up action when usable and no checkout is pending.",
            "anyOf": [
              {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "method",
                  "path"
                ],
                "properties": {
                  "method": {
                    "type": "string",
                    "const": "POST"
                  },
                  "path": {
                    "type": "string",
                    "const": "/api/v1/guest-wallets/topups"
                  }
                }
              },
              {
                "type": "null"
              }
            ]
          },
          "usable": {
            "type": "boolean",
            "description": "Authoritative paid-read readiness. Use instead of status.",
            "example": true
          },
          "wallet_id": {
            "type": "string",
            "pattern": "^gw_[A-Za-z0-9_-]+$",
            "example": "gw_example"
          }
        }
      },
      "GuestWalletCreateCheckoutAction": {
        "description": "Explicit direct REST action for a new guest wallet checkout.",
        "type": "object",
        "additionalProperties": false,
        "required": [
          "account_required",
          "amount_bounds",
          "body",
          "creates",
          "method",
          "path",
          "provider",
          "required_headers",
          "requires_authentication",
          "requires_user_confirmation",
          "requires_user_interaction",
          "response_fields",
          "response_url_field"
        ],
        "properties": {
          "account_required": {
            "type": "boolean",
            "const": false
          },
          "amount_bounds": {
            "$ref": "#/components/schemas/GuestWalletAmountBounds"
          },
          "body": {
            "$ref": "#/components/schemas/GuestWalletPurchaseRequest"
          },
          "creates": {
            "type": "string",
            "const": "checkout_url"
          },
          "method": {
            "type": "string",
            "const": "POST"
          },
          "path": {
            "type": "string",
            "const": "/api/v1/guest-wallets"
          },
          "provider": {
            "type": "string",
            "const": "stripe"
          },
          "required_headers": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "Idempotency-Key"
            ],
            "properties": {
              "Idempotency-Key": {
                "type": "string",
                "const": "<cryptographically random UUID v4>"
              }
            }
          },
          "requires_authentication": {
            "type": "boolean",
            "const": false
          },
          "requires_user_confirmation": {
            "type": "boolean",
            "const": true
          },
          "requires_user_interaction": {
            "type": "boolean",
            "const": true
          },
          "response_fields": {
            "type": "array",
            "minItems": 3,
            "maxItems": 3,
            "prefixItems": [
              {
                "type": "string",
