                    },
                    "author": {
                      "$ref": "#/components/schemas/TweetAuthor"
                    }
                  }
                },
                "example": {
                  "tweet": {
                    "id": "1234567890",
                    "text": "Just launched our new feature!",
                    "createdAt": "2025-01-15T12:00:00Z",
                    "retweetCount": 5,
                    "replyCount": 3,
                    "likeCount": 42,
                    "quoteCount": 1,
                    "viewCount": 1500,
                    "bookmarkCount": 2
                  },
                  "author": {
                    "id": "9876543210",
                    "username": "elonmusk",
                    "followers": 150000000,
                    "verified": true
                  }
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/InvalidInput"
