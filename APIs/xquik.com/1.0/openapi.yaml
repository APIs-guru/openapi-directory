    "/api/v1/x/media/download": {
      "post": {
        "operationId": "downloadMedia",
        "summary": "Download images and videos from tweets",
        "tags": [
          "Media"
        ],
        "security": [
          {
            "apiKey": []
          },
          {
            "oauthBearer": []
          }
        ],
        "requestBody": {
          "required": true,
          "description": "Single tweet URL/ID, accepted aliases, or array of up to 50 tweet URLs/IDs for bulk download. When `tweetIds` contains at least one string value, bulk mode is used.",
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "tweetInput": {
                    "type": "string",
                    "description": "Tweet URL or ID (single tweet)",
                    "example": "https://x.com/elonmusk/status/1234567890"
                  },
                  "tweetId": {
                    "type": "string",
                    "description": "Numeric tweet ID alias for tweetInput",
                    "example": "1234567890"
                  },
                  "tweetUrl": {
                    "type": "string",
                    "description": "Tweet URL alias for tweetInput",
                    "example": "https://x.com/elonmusk/status/1234567890"
                  },
                  "tweetIds": {
                    "type": "array",
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 50,
                    "description": "Array of tweet URLs or IDs (bulk, max 50 string items)",
                    "example": [
                      "1234567890",
                      "1234567891"
                    ]
                  }
                }
              },
              "example": {
                "tweetInput": "https://x.com/elonmusk/status/1234567890"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Media download result. Single: tweetId + galleryUrl + cacheHit. Bulk: galleryUrl + totalTweets + totalMedia.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "tweetId": {
                      "type": "string",
                      "example": "1234567890"
                    },
                    "galleryUrl": {
                      "type": "string",
                      "example": "https://xquik.com/gallery/abc123"
                    },
                    "cacheHit": {
                      "type": "boolean",
                      "example": false
                    },
                    "totalTweets": {
                      "type": "integer",
                      "example": 2
                    },
                    "totalMedia": {
                      "type": "integer",
                      "example": 5
                    }
                  }
                },
                "example": {
                  "tweetId": "1234567890",
                  "galleryUrl": "https://xquik.com/gallery/abc123",
                  "cacheHit": false
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/InvalidInput"
          },
          "401": {
            "$ref": "#/components/responses/Unauthenticated"
          },
          "402": {
            "$ref": "#/components/responses/PaymentRequired"
          },
          "404": {
            "description": "Tweet media source not found",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
                  "error": "tweet_not_found",
                  "message": "Tweet not found."
                }
              }
            }
          },
          "424": {
            "$ref": "#/components/responses/XApiError"
          },
          "429": {
            "$ref": "#/components/responses/RateLimitExceeded"
          },
          "502": {
            "$ref": "#/components/responses/XApiError"
          }
        }
      }
    },
