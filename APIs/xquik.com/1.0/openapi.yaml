      "get": {
        "operationId": "getRadar",
        "summary": "Get trending topics from curated sources",
        "tags": [
          "Composition"
        ],
        "security": [
          {
            "apiKey": []
          },
          {
            "oauthBearer": []
          }
        ],
        "parameters": [
          {
            "name": "after",
            "in": "query",
            "schema": {
              "type": "string"
            },
            "description": "Cursor for pagination (from prior response nextCursor)."
          },
          {
            "name": "category",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "general",
                "tech",
                "dev",
                "science",
                "culture",
                "politics",
                "business",
                "entertainment"
              ]
            },
            "description": "Filter by category."
          },
          {
            "name": "hours",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 72,
              "default": 6
            },
            "description": "Lookback window in hours (1-72, default 6)."
          },
          {
            "name": "limit",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 50
            },
            "description": "Number of items to return (1-100, default 50)."
          },
          {
            "name": "region",
            "in": "query",
            "schema": {
              "type": "string",
              "default": "global"
            },
            "description": "Region filter. Use `global` or a region code such as `US`, `GB`, `TR`, or `ES`."
          },
          {
            "name": "source",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "github",
                "google_trends",
                "hacker_news",
                "polymarket",
                "reddit",
                "trustmrr",
                "wikipedia"
              ]
            },
            "description": "Source filter. One of: github, google_trends, hacker_news, polymarket, reddit, trustmrr, wikipedia"
          }
        ],
