        "description": "Authentication required for a non-MPP paid read. The Bearer challenge requests authentication and is not a Payment challenge. Requests without credentials advertise accountless Stripe checkout, but create no checkout. Explicit invalid credentials return the plain error shape. Call an advertised action only after explicit user confirmation.\n",
        "headers": {
          "Cache-Control": {
            "description": "Prevents storage of the guest checkout action.",
            "schema": {
              "type": "string",
              "const": "no-store"
            }
          },
