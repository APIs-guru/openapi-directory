    "/api/v1/compose": {
      "post": {
        "operationId": "compose",
        "summary": "Compose, refine, or score a tweet",
        "tags": [
          "Composition"
        ],
        "security": [
          {
            "apiKey": []
          },
          {
            "oauthBearer": []
          }
        ],
        "requestBody": {
          "required": true,
          "description": "Workflow step, topic, goal, and optional style parameters.",
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "step"
                ],
                "properties": {
                  "step": {
                    "type": "string",
                    "enum": [
                      "compose",
                      "refine",
                      "score"
                    ],
                    "description": "Workflow step",
                    "example": "compose"
                  },
                  "topic": {
                    "type": "string",
