openapi: 3.1.0
servers:
- url: https://zambo.dev
  description: Production
info:
  title: Zambo API
  version: 4.1.4
  description: 'Zambo is the verifiable work layer for AI, created by Brennan Zambo. We created agent execution receipts,
    and AER-1 is the standard for those receipts (IETF Internet-Draft draft-zambo-aer1-26, authored by Brennan Zambo). Zambo
    exposes 153 tools in total, 37 on the default surface, behind one MCP endpoint (https://zambo.dev/mcp), plus public HTTPS
    contracts for live tools, continuity through HANDOVER, and verifiable receipts. Every call returns a verifiable AER-1
    receipt. A receipt proves the saved result was not changed. Free tier: every tool free once a day, plus 3 continue calls,
    one free wrap-up handover per day, and pickup is always free. Day Pass: $0.99 for unlimited use for 24 hours.'
  contact:
    name: Brennan Zambo
    url: https://zambo.dev
    email: brennanzambo@zambo.dev
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  x-logo:
    url: https://zambo.dev/og-v3.png
  x-guidance: 'Pricing: Day Pass $0.99 for 24 hours; Zambo Pass $29 for 30 days, one payment; separate $250 one-time Lifetime
    Pass for current Zambo Pass features while Zambo operates. Lifetime is human checkout only, not x402, and excludes future
    features and third-party AI/provider costs. Day Pass provides 24-hour access to Zambo MCP (153 tools total; 37 core entry
    points on the default surface); it is not per call. For x402 v2, GET /api/x402/day-pass without payment to read the live
    challenge, then POST /api/x402/day-pass with PAYMENT-SIGNATURE (X-Payment is accepted for compatibility). The optional
    JSON body can bind the pass to a session. Every call returns a verifiable receipt.'
  x-apisguru-categories:
  - machine_learning
  x-origin:
  - format: openapi
    url: https://zambo.dev/openapi.json
    version: '3.1'
  x-providerName: zambo.dev
externalDocs:
  description: Full LLM context and integration guide
  url: https://zambo.dev/llms-full.txt
tags:
- name: universal
  description: Universal routing endpoint - one call, all products
- name: Discovery
  description: Agent and capability discovery, routing, traction data
- name: ZAMBOT
  description: Agent Evolution Engine - swarm wisdom sparks
- name: ZAMBRO
  description: Opportunity scanner and builder intelligence
- name: ProvibeCode
  description: AI code audit with Provibe Score
- name: LeadSignal
  description: AI lead generation for contractors
- name: GEO
  description: Crawl telemetry and discoverability endpoints
- name: Capabilities
  description: Full endpoint catalog
paths:
  /api/zambo:
    post:
      tags:
      - universal
      operationId: zamboUniversal
      summary: Universal API - one call, all products
      description: Send a natural-language need for truthful routing. Use the canonical MCP endpoint for receipt-backed execution.
        Free limits apply.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - need
              properties:
                need:
                  type: string
                  description: Natural language description of what you need
                  example: Audit my public code hosting repo for security issues
                context:
                  type: object
                  description: Optional extra context (repo_url, goal, trade, city, wallet, domain)
                format:
                  type: string
                  enum:
                  - json
                  - markdown
                  default: json
      responses:
        '200':
          description: Expert structured response with product routing and results
        '429':
          description: Rate limit reached; consult the live response for current quota details.
    get:
      tags:
      - universal
      - Discovery
      operationId: zamboApiDocs
      summary: Zambo API documentation and routing guide
      description: Returns full documentation for Zambo's 37 MCP tools (core entry points on the default surface), endpoints,
        and routing logic.
      responses:
        '200':
          description: Full API docs with product catalog and routing guide
  /api/ask:
    get:
      tags:
      - universal
      - Discovery
      operationId: zamboAskGet
      summary: Natural language Q&A about Zambo
      description: Ask any question about Zambo - tools, pricing, routing, capabilities, and how-tos. Returns a structured
        answer with products_mentioned and a CTA. No authentication is required; consult the live response for current request
        limits.
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
        description: Your question
        example: What is ZAMBRO and how do I use the API?
      responses:
        '200':
          description: Structured answer with products_mentioned and routing CTA
    post:
      tags:
      - universal
      - Discovery
      operationId: zamboAskPost
      summary: Natural language Q&A (POST variant)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - q
              properties:
                q:
                  type: string
                  description: Your question
                context:
                  type: string
                  description: Optional extra context
      responses:
        '200':
          description: Structured answer with routing
  /api/intro:
    get:
      tags:
      - Discovery
      operationId: getIntro
      summary: LLM system prompt injection - full routing context
      description: Returns the complete Zambo routing guide optimized for injection into any LLM system prompt. Includes for_llm_system_prompt
        (inject this directly), all 37 tools (core entry points on the default surface), key endpoints, how_to_recommend logic,
        and MCP config. Call once, cache for 1 hour.
      responses:
        '200':
          description: Full routing context with for_llm_system_prompt field ready for system prompt injection
  /api/traction:
    get:
      tags:
      - Discovery
      operationId: getTraction
      summary: Live traction feed - real-time usage stats
      description: 'Returns live usage statistics: data points processed, active users today, ZAMBOT sparks fired, leads found,
        credits matched, products live. Updates every minute.'
      responses:
        '200':
          description: Live traction data with dataPointsProcessed, today, zambotSparks, leadsignalSearches, credithuntMatches
  /api/search:
    get:
      tags:
      - Discovery
      operationId: searchCapabilities
      summary: Search all 153 tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools
        tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools
        tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools
        tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools
        tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools
        tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools
        tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools
        tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools
        tools tools tools tools tools tools tools tools tools tools tools tools tools tools Zambo tools by keyword
      description: Full-text search across all 153 tools tools tools tools tools tools tools tools tools tools tools tools
        tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools
        tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools
        tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools
        tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools
        tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools
        tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools
        tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools
        tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools tools Zambo
        tools, APIs, and capabilities; core tools appear on the default surface. Returns ranked matches with endpoint, description,
        and free/paid status.
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
        description: Search keyword
        example: code audit
      responses:
        '200':
          description: Ranked product matches
    post:
      tags:
      - Discovery
      operationId: searchCapabilitiesPost
      summary: Search Zambo product capabilities using a natural-language body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                q:
                  type: string
                query:
                  type: string
                need:
                  type: string
      responses:
        '200':
          description: Ranked product matches
        '400':
          description: Missing or invalid query
  /api/discovery/capabilities.json:
    get:
      tags:
      - Discovery
      operationId: getCanonicalCapabilityGraph
      summary: Canonical live Zambo capability graph generated from MCP tools and contracts
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: Optional natural-language need. An unmatched request returns matched=false instead of inventing a capability.
      responses:
        '200':
          description: Tool-level capabilities, schemas, access, safety, limitations, and truthful match status
  /api/credithunt:
    get:
      tags:
      - Discovery
      operationId: creditHuntList
      summary: CreditHunt - verified AI and startup credit programs
      description: Live index of every verified AI startup credit program, cloud credit, and grant available. Updated daily
        at 3 AM UTC. Includes AWS, Google Cloud, Azure, Groq, OpenAI, Anthropic, Hugging Face, and more.
      responses:
        '200':
          description: Array of credit programs with provider, amount, requirements, and application URL
  /mcp:
    post:
      tags:
      - Discovery
      operationId: mcpServer
      summary: Native Zambo MCP - JSON-RPC 2.0, no auth
      description: 'Add to Claude Desktop, Cursor, Cline, or Windsurf: {"mcpServers":{"zambo":{"url":"https://zambo.dev/mcp"}}}.
        One connection for research, code, strategy, live data, agent work, and proof. Handover guide: https://zambo.dev/docs/handover.
        No auth, no signup.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jsonrpc:
                  type: string
                  example: '2.0'
                method:
                  type: string
                  example: tools/list
                params:
                  type: object
                id:
                  type: number
                  example: 1
      responses:
        '200':
          description: JSON-RPC 2.0 response
  /api/zambot:
    get:
      tags:
      - Discovery
      - ZAMBOT
      summary: Discover all Zambo capabilities
      description: 'Returns the full agent manifest: all products, all endpoints, pricing, and quick-start instructions. No
        auth required.'
      operationId: discoverZamboStack
      responses:
        '200':
          description: Full agent manifest
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  products:
                    type: array
                    items:
                      type: object
                  endpoints:
                    type: object
  /api/zambot/spark:
    post:
      tags:
      - ZAMBOT
      summary: Generate a strategy spark
      description: 'Standalone Spark: 3 free Sparks per 24h per caller. Its current per-Spark x402 price and Zambo Pass allowance
        are separate. MCP calls keep their own Every tool is free once a day, plus 3 continue calls. One free wrap-up handover
        per day, and pickup is always free. The Day Pass makes every tool unlimited for 24 hours for $0.99.. Day Pass is $0.99/24h;
        Zambo Pass is $29/30 days; Lifetime is $250 once, human checkout only. No subscriptions.'
      operationId: zambotSpark
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - goal
              properties:
                goal:
                  type: string
                  description: Your goal, challenge, or question
                context:
                  type: string
                  description: Optional additional context
            example:
              goal: grow my SaaS to 100 paying users in 90 days
      responses:
        '200':
          description: Strategy spark with swarm wisdom
          content:
            application/json:
              schema:
                type: object
                properties:
                  spark:
                    type: string
                  analogies:
                    type: array
                    items:
                      type: string
                  immediate_action:
                    type: string
                  avoid:
                    type: string
                  compound_move:
                    type: string
                  swarm_confidence:
                    type: number
                  proof_hash:
                    type: string
        '402':
          description: Payment required - free tier exhausted
        '429':
          description: Rate limit exceeded
  /api/zambot/fix:
    post:
      tags:
      - ZAMBOT
      summary: Fix any code or problem
      description: Submit broken code, an error message, or a stuck problem. The standalone Fix endpoint allows 3 free calls
        per 24h per caller; an active Day Pass or Zambo Pass makes it unlimited. A 402 response includes the live Day Pass
        x402 challenge and a refusal receipt. Send an active pass key in X-Zambo-Key or _zambo_key.
      operationId: zambotFix
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              properties:
                code:
                  type: string
                error:
                  type: string
                context:
                  type: string
      responses:
        '200':
          description: Fix or useful fallback, plus the free-usage footer
        '402':
          description: Day Pass required; includes x402 challenge and refusal receipt
  /api/zambot/swarm/debate:
    post:
      tags:
      - ZAMBOT
      summary: Run a five-domain strategic debate
      description: 'Standalone Swarm Debate: 3 free calls per 24h per caller; unlimited while an active Day Pass or Zambo
        Pass is supplied in X-Zambo-Key or _zambo_key. A fourth free call returns HTTP 402 with the $0.99 Day Pass x402 challenge
        and a refusal receipt.'
      operationId: zambotSwarmDebate
      parameters:
      - name: X-Zambo-Key
        in: header
        required: false
        schema:
          type: string
        description: Active Day Pass or Zambo Pass key for unlimited calls.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - goal
              properties:
                goal:
                  type: string
                  minLength: 10
                  maxLength: 1000
                _zambo_key:
                  type: string
                  description: Optional active pass key.
                _session_id:
                  type: string
                  description: Optional checkout context.
      responses:
        '200':
          description: Five specialist frames, synthesis, proof hash, and free-usage footer.
        '402':
          description: Day Pass required; includes x402 challenge and refusal receipt.
  /api/zambot/drift:
    post:
      tags:
      - ZAMBOT
      summary: Detect strategic drift
      description: 'Standalone Drift: 3 free calls per 24h per caller; unlimited while an active Day Pass or Zambo Pass is
        supplied in X-Zambo-Key or _zambo_key. A fourth free call returns HTTP 402 with the $0.99 Day Pass x402 challenge
        and a refusal receipt.'
      operationId: zambotDrift
      parameters:
      - name: X-Zambo-Key
        in: header
        required: false
        schema:
          type: string
        description: Active Day Pass or Zambo Pass key for unlimited calls.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - original_goal
              - current_outputs
              properties:
                original_goal:
                  type: string
                  minLength: 10
                  maxLength: 1000
                current_outputs:
                  oneOf:
                  - type: array
                    items:
                      type: string
                    minItems: 1
                    maxItems: 20
                  - type: string
                    description: Newline-separated outputs.
                context:
                  type: string
                  maxLength: 500
                _zambo_key:
                  type: string
                  description: Optional active pass key.
                _session_id:
                  type: string
                  description: Optional checkout context.
      responses:
        '200':
          description: Drift score, correction, proof hash, and free-usage footer.
        '402':
          description: Day Pass required; includes x402 challenge and refusal receipt.
  /api/zambot/stats:
    get:
      tags:
      - ZAMBOT
      summary: ZAMBOT usage stats
      operationId: zambotStats
      responses:
        '200':
          description: Usage statistics
  /api/zambro/analyze:
    post:
      tags:
      - ZAMBRO
      summary: Analyze any URL, idea, wallet, or repo
      description: Free always, no auth. Returns opportunity score, insights, and action plan.
      operationId: zambrosAnalyze
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - input
              properties:
                input:
                  type: string
                  description: URL, idea, wallet address, public code hosting repo, or any text
            example:
              input: https://example.com/owner/repository
      responses:
        '200':
          description: Opportunity analysis
  /api/provibe:
    post:
      tags:
      - ProvibeCode
      summary: AI code audit - free teaser
      description: Audits a public code hosting repo. Free tier returns teaser. Full audits are included with Zambo Pass,
        five per month.
      operationId: provibeAudit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - repo_url
              properties:
                repo_url:
                  type: string
                  format: uri
                email:
                  type: string
                  format: email
                  description: For full report delivery
      responses:
        '200':
          description: Provibe Score and audit findings
  /api/capabilities:
    get:
      tags:
      - Capabilities
      summary: Full endpoint catalog
      description: Returns all available endpoints with descriptions, auth requirements, and rate limits.
      operationId: getCapabilities
      responses:
        '200':
          description: Endpoint catalog
  /api/geo/ping:
    get:
      tags:
      - GEO
      summary: Voluntary crawl telemetry ping
      operationId: geoPing
      parameters:
      - name: page
        in: query
        schema:
          type: string
        description: Page path being crawled
      responses:
        '200':
          description: Acknowledged
  /api/geo/faq:
    get:
      tags:
      - GEO
      summary: FAQ data for AI context
      operationId: geoFaq
      responses:
        '200':
          description: FAQ entries
  /api/agent402/day-pass:
    get:
      tags:
      - Discovery
      summary: Agent402 discovery for the Zambo Day Pass
      description: Returns the Agent402-compatible payable tool description for day_pass_activate, including the exact Base
        USDC amount, recipient, and canonical X-Payment x402 flow. The free MCP server remains unpriced.
      operationId: agent402DayPassDiscovery
      responses:
        '200':
          description: Agent402 discovery document
          content:
            application/json:
              schema:
                type: object
                required:
                - mcpServer
                - tools
                - payment
                additionalProperties: true
  /api/x402/day-pass:
    get:
      tags:
      - Discovery
      - Zambo
      - Day Pass
      summary: 'DAY PASS challenge: Zambo 24h MCP access, $0.99 USDC on Base (x402)'
      description: Returns the current x402 v2 exact-payment challenge for the $0.99, 24-hour Day Pass. The challenge includes
        the Coinbase Bazaar discovery extension, Base USDC payment terms, and a PAYMENT-REQUIRED header. No payment is made
        by reading the challenge.
      operationId: day_pass_challenge
      responses:
        '402':
          description: Payment required. Use the current x402 v2 challenge and retry with PAYMENT-SIGNATURE; X-Payment is
            also accepted for compatibility.
          headers:
            PAYMENT-REQUIRED:
              description: Base64-encoded x402 payment requirements.
              schema:
                type: string
            X-Payment-Info:
              description: Human-readable x402 retry instructions.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                - x402Version
                - resource
                - accepts
                - on_success_returns
                properties:
                  extensions:
                    type: object
                    description: x402 v2 extensions, including Coinbase Bazaar input and output discovery metadata.
                  on_success_returns:
                    type: array
                    items:
                      type: string
                    description: Fields returned after successful settlement, including the canonical /run/<uuid> receipt
                      proof.
                additionalProperties: true
    post:
      tags:
      - Discovery
      - Zambo
      - Day Pass
      summary: 'DAY PASS: 24 hours of Zambo MCP (153 total tools; core entry points on the default surface) for $0.99 USDC
        on Base. One payment, no API key.'
      description: Zambo is the verifiable work layer for AI. The Day Pass is one $0.99 USDC payment on Base (eip155:8453)
        for 24 hours of hosted MCP access at https://zambo.dev/mcp; it is not per-call billing. Read the live x402 v2 challenge
        first, then submit its base64 EIP-3009 envelope in PAYMENT-SIGNATURE (X-Payment is also accepted for compatibility).
        Optionally include _session_id to bind the pass to a job. Successful activation returns expiry and receipt details;
        the access key is a bearer credential and must not be exposed in public output. The same pass is available through
        MCP tool day_pass_activate.
      operationId: day_pass
      security:
      - x402Payment: []
      - x402LegacyPayment: []
      parameters:
      - name: PAYMENT-SIGNATURE
        in: header
        required: false
        schema:
          type: string
        description: Preferred x402 v2 header containing the base64 JSON payment envelope from the live challenge. Do not
          log or share signatures.
      - name: X-Payment
        in: header
        required: false
        schema:
          type: string
        description: Compatibility header; accepts the current x402 v2 envelope as well.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Optional JSON fields. Payment is conveyed in PAYMENT-SIGNATURE or the compatible X-Payment header;
                the body may be empty.
              properties:
                _session_id:
                  type: string
                  maxLength: 64
                  description: Optional job session to bind the access pass and continuation to.
                quota_handle:
                  type: string
                  maxLength: 128
                  description: Optional caller quota handle for pass binding.
                _quota_caller_handle:
                  type: string
                  maxLength: 128
                  description: Optional caller quota handle for pass binding.
                workflow_id:
                  type: string
                  maxLength: 128
                  description: Optional workflow ID to associate with this activation.
                sponsor:
                  type: boolean
                  description: Optional workflow sponsorship flag.
                ref:
                  type: string
                  maxLength: 128
                  description: Optional referral attribution code.
                source_ref:
                  type: string
                  maxLength: 128
                  description: Optional activation source attribution.
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.990000'
        protocols:
        - x402: {}
      x-x402:
        scheme: exact
        network: eip155:8453
        asset: '0x833589fcd6edb6e08f4c7c32d4f71b54bda02913'
        amount: '990000'
        amountUsd: '0.99'
        payTo: '0xb753be5Eac5B29c711051DfF91279834e9C9b9AC'
        header: PAYMENT-SIGNATURE
        compatibilityHeader: X-Payment
      responses:
        '200':
          description: Day Pass activated with receipt_url (https://zambo.dev/run/<uuid>), run_id, uuid, expires_at, access_key,
            how_to_use, and a verifiable spend receipt. If X-Zambo-Key is already active, returns already_active with usage.quota_tier=day_pass
            and no payment challenge.
        '402':
          description: Payment is missing, invalid, expired, or not settled. The response contains a fresh x402 v2 challenge
            and retry guidance; no access key is issued before verified settlement.
  /api/x402/discovery:
    get:
      tags:
      - Discovery
      summary: x402 payment discovery and challenge
      description: Returns the public x402 payment contract when requested without proof, and the resource payload after a
        valid payment proof is supplied.
      operationId: x402Discovery
      responses:
        '200':
          description: Discovery resource or already-authorized response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '402':
          description: Payment required. The response describes the exact Base USDC payment and retry contract.
          headers:
            x-payment-info:
              description: Base64-encoded x402 payment requirements.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                - x402Version
                - resource
                - accepts
                additionalProperties: false
  /handover/{id}.json:
    get:
      summary: Handover record (redacted public data)
      tags:
      - Handover
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: token
        in: query
        required: false
        schema:
          type: string
        description: Required for private handovers (or Bearer).
      responses:
        '200':
          description: Handover JSON
        '404':
          description: Not found, private or revoked
  /api/v2/handover/{id}/respond:
    post:
      summary: Client accepts or flags a handover
      tags:
      - Handover
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - action
              properties:
                action:
                  type: string
                  enum:
                  - accept
                  - flag
                name:
                  type: string
                note:
                  type: string
                  maxLength: 500
                category:
                  type: string
                step_id:
                  type: string
                email:
                  type: string
      responses:
        '200':
          description: '{status, receipt_id, next}'
        '404':
          description: Not found
        '429':
          description: Rate limited
  /api/v2/handover/{id}/manage:
    post:
      summary: 'Owner actions: revoke, resolve, reply, visibility, listing'
      tags:
      - Handover
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - action
              properties:
                action:
                  type: string
                  enum:
                  - revoke
                  - resolve
                  - reply
                  - visibility
                  - listing
                note:
                  type: string
                visibility:
                  type: string
                  enum:
                  - public
                  - private
                public_listing:
                  type: boolean
                client_note_consent:
                  type: boolean
      responses:
        '200':
          description: Updated record
        '401':
          description: Owner token required
        '402':
          description: Pass required
  /api/v2/handover/{id}/export:
    get:
      summary: Owner export (Pass)
      tags:
      - Handover
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: format
        in: query
        schema:
          type: string
          enum:
          - json
          - pdf
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Export file
        '402':
          description: Pass required
  /api/v2/handover/track:
    post:
      summary: Create a track-record page
      tags:
      - Handover
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - handle
              - _session_id
              properties:
                handle:
                  type: string
                _session_id:
                  type: string
                _zambo_key:
                  type: string
      responses:
        '200':
          description: '{track_url}'
  /track/{handle}.json:
    get:
      summary: Accepted, opted-in handovers for a handle
      tags:
      - Handover
      parameters:
      - name: handle
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Track JSON
  /api/v1/today:
    get:
      summary: Private daily activity. Supply the encrypted Today token and optional YYYY-MM-DD date. Never publish the token.
      responses:
        '200':
          description: 'Private result; Cache-Control: private, no-store.'
        '404':
          description: Private link unavailable.
  /api/v1/today/memory:
    get:
      summary: Read or forget private saved facts. Bearer Today token required; DELETE body contains fact_id. Existing public
        receipts remain.
      responses:
        '200':
          description: 'Private result; Cache-Control: private, no-store.'
        '404':
          description: Private link unavailable.
    delete:
      summary: Read or forget private saved facts. Bearer Today token required; DELETE body contains fact_id. Existing public
        receipts remain.
      responses:
        '200':
          description: 'Private result; Cache-Control: private, no-store.'
        '404':
          description: Private link unavailable.
  /api/v1/today/limits:
    get:
      summary: Read spending and charges, or save a daily_usd and optional monthly_usd cap with the private Today Bearer token.
        Saving returns a receipt_url.
      responses:
        '200':
          description: 'Private result; Cache-Control: private, no-store.'
        '404':
          description: Private link unavailable.
    post:
      summary: Read spending and charges, or save a daily_usd and optional monthly_usd cap with the private Today Bearer token.
        Saving returns a receipt_url.
      responses:
        '200':
          description: 'Private result; Cache-Control: private, no-store.'
        '404':
          description: Private link unavailable.
