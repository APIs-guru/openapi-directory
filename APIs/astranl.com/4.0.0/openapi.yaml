openapi: 3.1.0
info:
  title: AstraNL Protocol API
  version: 4.0.0
  contact:
    email: astranl@astranl.com
    name: AstraNL
    url: https://astranl.com
  description: 'Coordination protocol for AI agents and real-world tasks. Multi-provider mesh: dispatch to Anthropic / OpenAI
    / Gemini / xAI Grok via measured task-classes. Flat per-task pricing €0.005-€0.05.'
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  x-apisguru-categories:
  - developer_tools
  - machine_learning
  x-logo:
    url: https://astranl.com/brand/astranl-logo-512.png
    backgroundColor: '#0B1020'
  x-origin:
  - format: openapi
    url: https://astranl.com/openapi.json
    version: '3.1'
  x-providerName: astranl.com
  x-unofficialSpec: true
paths:
  /coordination/universe:
    get:
      tags:
      - coordination-universe
      summary: Universe
      description: The full coordination universe — three classes of executors.
      operationId: universe_coordination_universe_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /coordination/route:
    post:
      tags:
      - coordination-universe
      summary: Route Intent
      description: 'Given a natural-language intent, return the recommended executor

        class and concrete next-step endpoint.'
      operationId: route_intent_coordination_route_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /coordination/executors/{kind}:
    get:
      tags:
      - coordination-universe
      summary: Executors
      description: List concrete executors of a given class.
      operationId: executors_coordination_executors__kind__get
      parameters:
      - name: kind
        in: path
        required: true
        schema:
          type: string
          title: Kind
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /coordination/manifest:
    get:
      tags:
      - coordination-universe
      summary: Coordination Manifest
      operationId: coordination_manifest_coordination_manifest_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /scaling/status:
    get:
      tags:
      - scaling-brain
      summary: Scaling Status
      operationId: scaling_status_scaling_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /scaling/metrics_now:
    get:
      tags:
      - scaling-brain
      summary: Scaling Metrics Now
      operationId: scaling_metrics_now_scaling_metrics_now_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/agents/wallet/manifest:
    get:
      tags:
      - agent-wallet
      summary: Manifest
      operationId: manifest_api_agents_wallet_manifest_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/agents/wallet/balance:
    get:
      tags:
      - agent-wallet
      summary: Wallet Balance
      operationId: wallet_balance_api_agents_wallet_balance_get
      parameters:
      - name: X-Agent-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Agent-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/agents/wallet/topup:
    post:
      tags:
      - agent-wallet
      summary: Wallet Topup
      operationId: wallet_topup_api_agents_wallet_topup_post
      parameters:
      - name: X-Agent-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Agent-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopupIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/agents/wallet/stripe_webhook:
    post:
      tags:
      - agent-wallet
      summary: Stripe Webhook
      description: Stripe webhook. Verifies signature, credits wallet on success.
      operationId: stripe_webhook_api_agents_wallet_stripe_webhook_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /capabilities/manifest:
    get:
      tags:
      - direct-execution
      summary: Capabilities Manifest
      description: Public catalogue of what AstraNL executes directly without commission.
      operationId: capabilities_manifest_capabilities_manifest_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /capabilities/classify:
    post:
      tags:
      - direct-execution
      summary: Classify
      operationId: classify_capabilities_classify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassifyIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /capabilities/execute:
    post:
      tags:
      - direct-execution
      summary: Execute
      description: "Execute capability with strict billing.\n\nRules (AstraNL coordinates and executes at the highest level;\
        \ AstraNL\ndoes NOT subsidise):\n\n  - X-Agent-Key required. No anonymous execution.\n  - Wallet balance must cover\
        \ real inference cost. AstraNL margin = 0%.\n  - Insufficient balance → HTTP 402 with topup_url.\n  - No free trial.\
        \ The first call already debits the wallet."
      operationId: execute_capabilities_execute_post
      parameters:
      - name: X-Agent-Key
        in: header
        required: false
        schema:
          type: string
          title: X-Agent-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /capabilities/stats:
    get:
      tags:
      - direct-execution
      summary: Stats
      description: Public stats on direct executions performed by AstraNL.
      operationId: stats_capabilities_stats_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /capabilities/dispatch:
    post:
      tags:
      - dispatch
      summary: Dispatch
      description: "Compound-task dispatch through Decomposer Brain.\n\nReturns: {\n    result, task_class, strategy, n_subtasks,\
        \ quality, cost_eur breakdown,\n    opus_baseline_eur, savings_pct, escalated (bool), action_id\n}"
      operationId: dispatch_capabilities_dispatch_post
      parameters:
      - name: X-Agent-Key
        in: header
        required: false
        schema:
          type: string
          title: X-Agent-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /capabilities/dispatch/manifest:
    get:
      tags:
      - dispatch
      summary: Dispatch Manifest
      description: Public list of dispatchable task classes with measured economics.
      operationId: dispatch_manifest_capabilities_dispatch_manifest_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/demand/leads:
    get:
      summary: Xdem Leads
      operationId: xdem_leads_api_demand_leads_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
