      - calculator_cart_page
      summary: Cart Page
      operationId: cart_page__lang__calculator_cart__cart_id__get
      parameters:
      - name: lang
        in: path
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 4
          title: Lang
      - name: cart_id
        in: path
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 64
          title: Cart Id
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/calculator/recipes:
