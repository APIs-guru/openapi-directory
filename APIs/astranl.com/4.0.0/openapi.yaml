      summary: Bom To Cart
      description: Convert a saved BoM into a cart (uses existing cart_build extension).
      operationId: bom_to_cart_api_calculator_bom__bom_id__to_cart_post
      parameters:
      - name: bom_id
        in: path
        required: true
        schema:
          type: string
          title: Bom Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BomToCartIn'
      responses:
        '200':
