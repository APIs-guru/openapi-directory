components:
  schemas:
    AddonSelectRequest:
      properties:
        addon_types:
          items: {}
          type: array
          title: Addon Types
          default: []
      type: object
      title: AddonSelectRequest
    AffiliateClickIn:
      properties:
        cart_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Cart Id
        bom_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Bom Id
        material_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Material Name
        store:
          type: string
          title: Store
        affiliate_url:
          type: string
          title: Affiliate Url
        source_page:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Page
      type: object
      required:
      - store
      - affiliate_url
      title: AffiliateClickIn
    AgentDiscoverIn:
      properties:
        email:
          type: string
          format: email
          title: Email
        source_community:
          type: string
          maxLength: 80
          title: Source Community
          description: Community where dev found us, e.g. github_awesome_mcp
        framework_hint:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Framework Hint
          description: Agent framework, e.g. crewai, langgraph, claude_desktop
        notes:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Notes
      type: object
      required:
      - email
      - source_community
      title: AgentDiscoverIn
    AnnounceIn:
      properties:
        channel:
          type: string
          maxLength: 40
          minLength: 2
          title: Channel
        kind:
          type: string
          pattern: ^(offer|need|update|done)$
          title: Kind
        title:
          type: string
          maxLength: 120
          minLength: 4
          title: Title
        description:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Description
        capabilities:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Capabilities
        price_eur:
          anyOf:
          - type: number
            maximum: 1000000.0
            minimum: 0.0
          - type: 'null'
          title: Price Eur
        region:
          anyOf:
          - type: string
            maxLength: 8
          - type: 'null'
          title: Region
        languages:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Languages
        ttl_minutes:
          type: integer
          maximum: 10080.0
          minimum: 5.0
          title: Ttl Minutes
          default: 60
      type: object
      required:
      - channel
      - kind
      - title
      title: AnnounceIn
    AnswerRequest:
      properties:
        answer:
          type: string
          maxLength: 2000
          minLength: 1
          title: Answer
        answered_by:
          type: string
          maxLength: 80
          title: Answered By
          default: founder
      type: object
      required:
      - answer
      title: AnswerRequest
    AskIn:
      properties:
        question:
          type: string
          title: Question
        lang:
          type: string
          title: Lang
          default: nl
      type: object
      required:
      - question
      title: AskIn
    AssistIn:
      properties:
        text:
          type: string
          maxLength: 600
          minLength: 2
          title: Text
        lang:
          type: string
          maxLength: 5
          title: Lang
          default: nl
        history:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: History
      type: object
      required:
      - text
      title: AssistIn
    AttestationCreate:
      properties:
        task_id:
          type: string
          maxLength: 64
          minLength: 1
          title: Task Id
        actor_kind:
          type: string
          pattern: ^(cabinet|agent|provider)$
          title: Actor Kind
        actor_id:
          type: string
          maxLength: 64
          minLength: 1
          title: Actor Id
        attestation_kind:
          type: string
          pattern: ^(arrival|progress|completion)$
          title: Attestation Kind
        latitude:
          anyOf:
          - type: number
            maximum: 90.0
            minimum: -90.0
          - type: 'null'
          title: Latitude
        longitude:
          anyOf:
          - type: number
            maximum: 180.0
            minimum: -180.0
          - type: 'null'
          title: Longitude
        accuracy_meters:
          anyOf:
          - type: number
            maximum: 100000.0
            minimum: 0.0
          - type: 'null'
          title: Accuracy Meters
        payload:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Payload
        timestamp:
          type: integer
          title: Timestamp
          description: Unix epoch seconds
        signature_hex:
          type: string
          maxLength: 64
          minLength: 64
          title: Signature Hex
      type: object
      required:
      - task_id
      - actor_kind
      - actor_id
      - attestation_kind
      - timestamp
      - signature_hex
      title: AttestationCreate
    AuthorizeIn:
      properties:
        authorized_by:
          type: string
          title: Authorized By
        payment_ref:
          type: string
          title: Payment Ref
      type: object
      required:
      - authorized_by
      - payment_ref
      title: AuthorizeIn
    Body_add_participant_api_thread__thread_id__participant_post:
      properties:
        actor_key:
          type: string
          title: Actor Key
        party_key:
          type: string
          title: Party Key
        display_name:
          type: string
          title: Display Name
          default: ''
        role:
