  /api/inbound/email/webhook:
    post:
      summary: Api Inbound Email Webhook
      description: "Email ESP webhook endpoint. Supports Brevo Inbound Parse + generic JSON.\n\nAuth: requires INBOUND_WEBHOOK_SECRET\
        \ env var matched by X-AstraNL-Webhook-Secret\nheader, OR a signature header the ESP provides (Brevo: no signature\
        \ yet,\nMailgun: X-Mailgun-Signature). For Brevo we fall back to secret header.\n\nAccepts JSON. Canonical fields\
        \ tried in order:\n  - Brevo: items[0].To, items[0].From, items[0].Subject, items[0].RawHtmlBody / RawTextBody\n \
        \ - Generic: from, subject, text / body"
      operationId: api_inbound_email_webhook_api_inbound_email_webhook_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
