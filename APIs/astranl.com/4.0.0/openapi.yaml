      tags:
      - calculator_cart
      summary: Cart Refine
      description: User unticks items / changes quantities. Returns refined list.
      operationId: cart_refine_api_calculator_cart__cart_id__refine_post
      parameters:
      - name: cart_id
        in: path
        required: true
        schema:
          type: string
          title: Cart Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartRefineIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/calculator/cart/{cart_id}:
