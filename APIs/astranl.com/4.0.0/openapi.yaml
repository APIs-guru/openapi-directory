          title: Lead Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /capabilities/dispatch/benchmark:
    post:
      tags:
      - dispatch_benchmark
      summary: Benchmark
      description: 'Run the public reproducible benchmark suite.


        Returns per-prompt cost/quality and aggregate savings vs Opus baseline.

        Caller is billed for the actual inference run, like any /dispatch call.'
      operationId: benchmark_capabilities_dispatch_benchmark_post
      parameters:
      - name: X-Agent-Key
        in: header
        required: false
        schema:
          type: string
          title: X-Agent-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/calculator/cart/_stats:
    get:
      tags:
      - calculator_cart
      summary: Cart Stats
      description: 'Public lightweight stats: how many carts, click-throughs by supplier.'
      operationId: cart_stats_api_calculator_cart__stats_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/calculator/cart/{cart_id}/refine:
