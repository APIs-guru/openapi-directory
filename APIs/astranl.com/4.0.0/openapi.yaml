            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/calculator/cart/{cart_id}/checkout:
    get:
      tags:
      - calculator_cart
      summary: Cart Checkout
      description: "Click handler. Logs the click and 302-redirects to the partner.\n\nQuery parameters:\n  supplier=Gamma\
        \  → redirect to bulk search at that supplier\n  item_id=123     → redirect to that single material's buy URL\n  (none)\
        \          → redirect to the largest-subtotal supplier bulk URL"
      operationId: cart_checkout_api_calculator_cart__cart_id__checkout_get
      parameters:
      - name: cart_id
        in: path
        required: true
        schema:
          type: string
          title: Cart Id
      - name: supplier
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Supplier
      - name: item_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Item Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
