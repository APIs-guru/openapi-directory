security:
  - BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Your EnvoiSMS API key
  schemas:
    ConsentEvent:
      type: object
      properties:
        id:
          type: string
          example: cns_9f2a...
        phone:
          type: string
          example: '+212612345678'
        channel:
          type: string
          enum:
            - whatsapp
            - sms
            - any
        purpose:
          type: string
          enum:
            - marketing
            - transactional
            - otp
            - service
        status:
          type: string
          enum:
            - granted
            - withdrawn
        source:
          type: string
          enum:
            - api
            - form
            - import
            - dashboard
            - whatsapp_keyword
            - sms_keyword
            - whatsapp_inbound
            - ctwa
        evidence:
          type: object
          nullable: true
        recorded_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    Message:
      type: object
      description: Response to POST /messages — the message as accepted into the send queue.
      properties:
        id:
          type: string
          example: msg_8f2da1b2c3d4e5f6a7b8c9d0
        to:
          type: string
          example: '+212612345678'
        channel:
          type: string
          enum:
            - sms
            - whatsapp
            - voice
            - rcs
          description: sms is generally available with multi-operator routing. whatsapp sends from your own connected WhatsApp Business number (templates, text, media, interactive messages, reactions, contacts, locations) via the official WhatsApp Cloud API. voice and rcs are available on request.
        cascade:
          type: boolean
        status:
          type: string
          example: queued
        cost:
          type: object
          description: What was actually charged. Always zero on a sandbox key.
          properties:
            eur:
              type: number
              example: 0.072
            mad:
              type: number
              example: 0.79
        segments:
          type: integer
          example: 1
        created_at:
          type: string
          format: date-time
        sandbox:
          type: boolean
          description: Present and true only when the request used an `env_test_` key. Nothing was delivered and nothing was charged.
        simulated_cost:
          type: object
          description: |
            Sandbox only. What this exact send would have cost on a live key, at the account's own rates — so an integration can be costed before it goes live. Reported separately from `cost` so a rehearsal can never be mistaken for revenue.
          properties:
            eur:
              type: number
              example: 0.072
            mad:
              type: number
              example: 0.79
        warnings:
          type: array
          description: |
            Sandbox only. What a live key would have been refused for — today `OUT_OF_24H_WINDOW` for a free-form WhatsApp message outside the customer service window. The sandbox still simulates the send.
          items:
            type: object
            properties:
              code:
                type: string
                example: OUT_OF_24H_WINDOW
              message:
                type: string
    MessageRecord:
      type: object
      description: A stored message as returned by GET /messages/{id}. The metadata object provided at send time is not echoed here; it travels in DLR webhooks.
      properties:
        id:
          type: string
          example: msg_8f2da1b2c3d4e5f6a7b8c9d0
        campaign_id:
          type: string
          nullable: true
        to:
          type: string
          example: '+212612345678'
        channel:
          type: string
          enum:
            - sms
            - whatsapp
            - telegram
            - voice
            - rcs
        body:
          type: string
          example: Votre code est 1234
        sender_id:
          type: string
          example: MonApp
        unicode:
          type: integer
          description: 1 when the body required the UCS-2 alphabet (Arabic etc.), 0 for GSM-7
        segments:
          type: integer
          example: 1
        status:
          type: string
          enum:
            - queued
            - sent
            - delivered
            - failed
            - undeliverable
            - unconfirmed
          description: unconfirmed = the network accepted the message but never reported a final outcome within the reporting window; a delivery receipt arriving later still replaces it.
        error_code:
          type: string
          nullable: true
          description: 'Set on failed/undeliverable messages. A short diagnostic key: DLR_<network status> when the failure came from a delivery report (e.g. DLR_REJECTD, DLR_EXPIRED, DLR_UNDELIV), GATEWAY_* for a failure on the EnvoiSMS routing side before the network was reached, ENVOISMS_* for other routing diagnostics, META_* for a WhatsApp refusal (see "WhatsApp failure codes" in the API description). Treat unknown values as a generic terminal failure — new keys may appear.'
        error_message:
          type: string
          nullable: true
          description: Human-readable failure reason in English, set together with error_code. When the network gave no reason, this reads "The destination network did not deliver this message and gave no reason." Display text — do not parse it programmatically; branch on status and error_code instead.
        cost_eur:
          type: number
          example: 0.072
        cost_mad:
          type: number
          example: 0.79
        scheduled_at:
          type: string
          format: date-time
          nullable: true
        sent_at:
          type: string
          format: date-time
          nullable: true
        delivered_at:
          type: string
          format: date-time
          nullable: true
        read_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the recipient opened and read the message (WhatsApp blue checkmark)
        failed_at:
          type: string
          format: date-time
          nullable: true
        operator:
          type: string
          nullable: true
          example: Maroc Telecom
          description: Resolved destination network for Moroccan numbers (Maroc Telecom, Orange, Inwi, Autre); best-effort elsewhere.
        sandbox:
          type: integer
          description: 1 when the message was created by an env_test_ sandbox key
        created_at:
          type: string
          format: date-time
    SendMessageRequest:
      type: object
      required:
        - to
      description: |
        `message` is required for SMS and for WhatsApp text and interactive messages. A WhatsApp message whose content is a template, a media object, a reaction, contacts, a location or a sticker needs no `message` (for media it becomes the caption when given). Exactly one of reaction, contacts, location or sticker per message, and none of them together with another content type.
      properties:
        to:
          type: string
          description: Destination phone in E.164 format
          example: '+212612345678'
        message:
          type: string
          description: Message content (max 1600 chars). See the object description for when it may be omitted on WhatsApp.
          example: 'Bonjour! Votre commande #1234 est confirmée.'
        from:
          type: string
          description: Sender ID (alphanumeric, max 11 chars)
          example: MonApp
        channel:
          type: string
          enum:
            - sms
            - whatsapp
            - voice
            - rcs
          default: sms
          description: 'Channel for message delivery: sms (default) for Moroccan operator routes; whatsapp to send from your own connected WhatsApp Business number (403 WHATSAPP_NOT_CONNECTED otherwise). To send an ordinary text to a customer who happens to use WhatsApp, sms is enough: no connection, no template, no 24-hour window. On whatsapp, a message that is not a template may only be sent to a contact who wrote to your number in the last 24 hours — otherwise it is refused with 400 OUT_OF_24H_WINDOW before any charge (with a cascade, WhatsApp is skipped and the next channel is used instead).'
        cascade:
          type: boolean
          description: 'When true, tries WhatsApp, then falls back to SMS: at once if WhatsApp refuses the message or reports it failed (not on WhatsApp, 24-hour window closed, ...), or when no delivery report arrives within cascade_timeout (120 s by default). Only a send that actually went out is billed: a refused or failed WhatsApp message is not, and you pay for the SMS alone. A WhatsApp message still waiting for its delivery report did go out (it can still be delivered when the phone reconnects), so it is billed along with its SMS fallback, and refunded if WhatsApp later reports it failed. Tip: give your WhatsApp template a time-to-live (TTL) no longer than cascade_timeout, so a phone that comes back online does not receive both.'
          default: false
        cascade_timeout:
          type: integer
          minimum: 30
          maximum: 43200
          default: 120
          description: 'With cascade: seconds to wait for a delivery report before the next channel. Shorter falls back faster but bills more double sends; longer means fewer duplicates. Out of range: 400 INVALID_FIELD.'
        metadata:
          type: object
          description: 'Custom key-value pairs, stored with the message and returned in DLR webhooks. One key carries platform semantics: set purpose: "otp" when the message carries a one-time code you generated yourself — if the network reports a hard delivery failure on a Moroccan number while the code is still fresh (within 10 minutes), the platform automatically re-sends it once over an alternate SMS route, under the same message id and at no extra charge. Prefer /verify/send when you want the whole code lifecycle (generation, delivery cascade, validation, expiry) managed for you. Set no_failover: true to opt out of this automatic re-send entirely — the first delivery attempt''s outcome is then final.'
          example:
            order_id: ORD-12345
            customer_ref: C-789
        buttons:
          type: array
          description: Optional WhatsApp interactive buttons (max 3). Only supported on the whatsapp channel.
          items:
            $ref: '#/components/schemas/MessageButton'
        interactive:
          type: object
          description: 'WhatsApp Cloud API interactive message payload. cta_url: action {name: "cta_url", parameters: {display_text (max 20 chars), url}}. location_request_message: body text plus an optional action {name: "send_location"}; the contact answers with a location.'
          properties:
            type:
              type: string
              enum:
                - list
                - button
                - product
                - product_list
                - flow
                - carousel
                - order_details
                - cta_url
                - location_request_message
            header:
              type: object
            body:
              type: object
              properties:
                text:
                  type: string
            footer:
              type: object
              properties:
                text:
                  type: string
            action:
              type: object
        template:
          type: object
          description: WhatsApp only. An approved template of your account; exempt from the 24-hour window. Priced by the template's category as registered on your account.
          properties:
            name:
              type: string
              example: order_update
            language:
              type: string
              example: fr
            components:
              type: array
              items:
                type: object
        phone_number_id:
          type: string
          description: WhatsApp only. Which of your connected numbers sends; defaults to your default number.
        image:
          $ref: '#/components/schemas/WhatsAppMedia'
        video:
          $ref: '#/components/schemas/WhatsAppMedia'
        audio:
          $ref: '#/components/schemas/WhatsAppMedia'
        document:
          $ref: '#/components/schemas/WhatsAppMedia'
        sticker:
          $ref: '#/components/schemas/WhatsAppMedia'
        reaction:
          type: object
          description: WhatsApp only. React to a message of the conversation. Not billed. An empty emoji removes your reaction.
          required:
            - message_id
            - emoji
          properties:
            message_id:
              type: string
              description: WhatsApp message id (wamid) of the message you react to
              example: wamid.HBgLMjEyNjEyMzQ1Njc4FQIAEhgg
            emoji:
              type: string
              example: 👍
        contacts:
          type: array
          maxItems: 20
          description: 'WhatsApp only. Contact cards (WhatsApp Cloud API contacts object). name.formatted_name is required; allowed keys: name, phones, emails, urls, addresses, org, birthday (YYYY-MM-DD).'
          items:
            type: object
            required:
              - name
            properties:
              name:
                type: object
                required:
                  - formatted_name
                properties:
                  formatted_name:
                    type: string
                    example: Service client
                  first_name:
                    type: string
                  last_name:
                    type: string
              phones:
                type: array
                items:
                  type: object
                  properties:
                    phone:
                      type: string
                      example: '+212522000000'
                    type:
                      type: string
                      example: WORK
                    wa_id:
                      type: string
        location:
          type: object
          description: WhatsApp only. Send a location pin.
          required:
            - latitude
            - longitude
          properties:
            latitude:
              type: number
              minimum: -90
              maximum: 90
              example: 33.5731
            longitude:
              type: number
              minimum: -180
              maximum: 180
              example: -7.5898
            name:
              type: string
              example: Agence Casablanca
            address:
              type: string
              example: Bd Zerktouni, Casablanca
        context:
          type: object
          description: WhatsApp only. Reply to (quote) an earlier message of the conversation. Works with every type except reaction.
          required:
            - message_id
          properties:
            message_id:
              type: string
              example: wamid.HBgLMjEyNjEyMzQ1Njc4FQIAEhgg
    WhatsAppMedia:
      type: object
      description: WhatsApp media by exactly one of id (a media id uploaded to WhatsApp) or link (an https URL). caption on image, video and document only; filename on document only.
      properties:
        id:
          type: string
        link:
          type: string
          example: https://example.com/brochure.pdf
        caption:
          type: string
          maxLength: 1024
        filename:
          type: string
    BulkSendRequest:
      type: object
      required:
        - messages
      properties:
        messages:
          type: array
          maxItems: 10000
          items:
            type: object
            required:
              - to
              - message
            properties:
              to:
                type: string
                example: '+212612345678'
              message:
                type: string
                example: Bonjour {{name}}!
        from:
          type: string
        channel:
          type: string
          enum:
            - sms
            - whatsapp
            - telegram
            - voice
            - rcs
          default: sms
          description: Use sms by default. whatsapp sends free-form text from your connected WhatsApp Business number; each recipient must have written to you in the last 24 hours, and recipients outside that window are listed under rejected (OUT_OF_24H_WINDOW) and not charged. Bulk carries no templates — use campaigns for template sends.
    VerifySendRequest:
      type: object
      required:
        - to
      properties:
        to:
          type: string
          example: '+212612345678'
        channel:
          type: string
          enum:
            - sms
            - whatsapp
            - telegram
            - voice
            - rcs
          default: sms
          description: 'whatsapp = EnvoiSMS generates a 6-digit code and delivers it with its own WhatsApp authentication template, nothing to store on your side. The code is valid for expiry seconds, capped at 600 (10 minutes, also the default). If WhatsApp refuses the submission, the code is sent by SMS instead; an SMS follow-up after a delay happens only with a Verify application (app_id) whose channel list includes sms with auto-cascade on. code_length and template are ignored in this mode. sms = classic mode: you control code length, expiry, template and sender. Both modes are confirmed with the same /verify/check call.'
        otp_type:
          type: string
          enum:
            - copy_code
            - one_tap
            - zero_tap
            - url
          default: copy_code
          description: WhatsApp Authentication template button type (copy_code, one_tap autofill, zero_tap, or url).
        package_name:
          type: string
          description: Android application package name for One-Tap / Zero-Tap Autofill
          example: ma.monapp.ecommerce
        signature_hash:
          type: string
          description: Android app signature hash (SMS Retriever / Autofill API)
          example: AbCdEf12345
        code_length:
          type: integer
          minimum: 4
          maximum: 8
          default: 6
          description: sms channel only — whatsapp verifications always use 6 digits
        expiry:
          type: integer
          description: Code validity in seconds, 60–1800 (default 600). On the whatsapp channel it is capped at 600, the authentication template's own limit.
          default: 600
        app_id:
          type: string
          description: Verify Application ID configured in dashboard. If set, channels parameters and cascade logic are automatically managed.
          example: vra_82fb5a71
        cascade:
          type: array
          items:
            type: string
          description: Ordered channel cascade list for validation routing (e.g. ['whatsapp', 'sms', 'voice']). ignored if app_id is set.
          example:
            - whatsapp
            - sms
        brand:
          type: string
          description: Brand name shown in OTP message
          example: MaSociété
        template:
          type: string
          description: Custom OTP message. Use {{code}} and {{brand}} placeholders.
          example: 'Code {{brand}}: {{code}}. Ne partagez jamais ce code.'
        otp_button_text:
          type: string
          maxLength: 25
          description: Custom label for the WhatsApp click-to-copy OTP button
          example: Copier le code
        web_otp_domain:
          type: string
          description: 'Target domain for W3C WebOTP browser autofill (appends @domain #code to the SMS)'
          example: https://monsite.ma
        app_hash:
          type: string
          description: 11-character Android SMS Retriever API application hash for automatic Android OTP detection
          example: vG1k6XyZ1aB
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Stable machine-readable key, always UPPER_SNAKE_CASE. Branch on this, never on the message text. The common codes are listed in the Error Format section of the API description above.
              example: INSUFFICIENT_BALANCE
            message:
              type: string
              description: Human-readable explanation in English of what went wrong and what to do about it. Wording may improve over time — display it, do not parse it.
              example: 'Insufficient balance. Required: EUR 0.072, available: EUR 0.01'
            docs:
              type: string
              description: Link to the error documentation page.
              example: https://envoisms.ma/en/docs#errors
    MessageButton:
      type: object
      required:
        - type
        - text
      properties:
        type:
          type: string
          enum:
            - copy
            - url
            - call
          description: Button action type
          example: copy
        text:
          type: string
          maxLength: 25
          description: Button text label
          example: Copier le code
        copy_code:
          type: string
          description: Value to copy (only for copy type)
          example: '123456'
        url:
          type: string
          description: Target URL (only for url type). Must start with http:// or https://
          example: https://example.com
        phone_number:
          type: string
          description: Target phone number (only for call type) in E.164 format
          example: '+212612345678'
    WhatsAppProfile:
      type: object
      properties:
        about:
          type: string
          example: Service client officiel EnvoiSMS.ma
        address:
          type: string
          example: Casablanca, Maroc
        description:
          type: string
          example: Infrastructure de messagerie programmable pour les entreprises.
        email:
          type: string
          example: contact@votremarque.ma
        websites:
          type: array
          items:
            type: string
          example:
            - https://votremarque.ma
        profile_picture_url:
          type: string
          example: https://pps.whatsapp.net/v/...
    ConversationThread:
      type: object
      properties:
        phone:
          type: string
          example: '+212612345678'
        contact_name:
          type: string
          example: Yassine Alami
        last_message:
          type: string
          example: Bonjour, je souhaite des informations sur votre offre.
        last_message_at:
          type: string
          format: date-time
        unread_count:
          type: integer
          example: 1
        bot_muted:
          type: boolean
          example: false
        can_reply_free:
          type: boolean
          example: true
        window_expires_at:
          type: string
          format: date-time
    QualifiedLead:
      type: object
      properties:
        id:
          type: string
          example: lead_01J...
        phone:
          type: string
          example: '+212612345678'
        name:
          type: string
          example: Dr. Benjelloun
        preset:
          type: string
          example: medical_equipment
        bant_score:
          type: integer
          example: 85
        is_hot:
          type: boolean
          example: true
        intent:
          type: string
          example: Échographe Doppler pour cabinet médical
        stage:
          type: string
          enum:
            - new
            - contacted
            - meeting_scheduled
            - closed_won
            - closed_lost
          example: meeting_scheduled
        created_at:
          type: string
          format: date-time
    InboundWebhookCatch:
      type: object
      properties:
        id:
          type: string
          example: inw_9a8b...
        name:
          type: string
          example: Campagne TikTok Ads Casablanca
        source:
          type: string
          example: tiktok_ads
        catch_url:
          type: string
          example: https://api.envoisms.ma/v1/inbound-webhooks/catch/inw_9a8b...
        auto_start_funnel:
          type: boolean
          example: true
        total_received:
          type: integer
          example: 142
        created_at:
          type: string
          format: date-time
paths:
  /messages:
    post:
      summary: Send a message
      x-payment-info:
        intent: session
        method: stripe
        amount: '5.00'
        currency: usd
        description: EnvoiSMS API prepaid session deposit
        offers:
          - intent: session
            method: stripe
            amount: '5.00'
            currency: usd
          - intent: session
            method: tempo
            amount: '5000000'
            currency: usd
      description: 'Send one SMS, or one WhatsApp message from your own connected WhatsApp Business number (channel whatsapp: templates, text, media by id or link, interactive list/button/flow/cta_url/location_request_message, reactions, contact cards, locations, stickers, and a reply context on any of them). WhatsApp rule: a message that is not a template may only be sent to a contact who wrote to your number in the last 24 hours; otherwise it is refused with 400 OUT_OF_24H_WINDOW before anything is charged. Reactions are not billed. To show a typing indicator while you prepare a reply, see POST /messages/typing. Without a connected number, WhatsApp OTPs are available via /verify/send with channel whatsapp. Sending one-time codes? /verify/send manages the full OTP lifecycle (generation, delivery, validation, expiry) and is the recommended path; if you generate codes yourself and send them here, tag the request with metadata purpose: "otp" to enable the automatic one-shot re-send over an alternate SMS route on delivery failure (see the sms_otp example).'
      operationId: sendMessage
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: 'Unique string (max 255 chars, e.g. a UUID) making this send safe to retry: the same key replays the original response instead of sending and billing again. See the Idempotency section above.'
          schema:
            type: string
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
            examples:
              sms:
                summary: Simple SMS
                value:
                  to: '+212612345678'
                  message: 'Votre commande #1234 est expédiée!'
                  from: MaMarque
              sms_otp:
                summary: SMS OTP (self-managed code)
                description: 'The purpose: "otp" tag is what makes this an OTP for the platform: on a hard delivery failure reported for a Moroccan number, the code is re-sent once over an alternate SMS route while still fresh (within 10 minutes), same message id, no extra charge. Without the tag it is treated as an ordinary SMS. Prefer /verify/send when you want code generation, expiry, attempts and validation handled for you.'
                value:
                  to: '+212612345678'
                  message: 'Votre code: 123456'
                  channel: sms
                  metadata:
                    purpose: otp
              cascade:
                summary: Conservative cascade using configured channels
                value:
                  to: '+212612345678'
                  message: 'Votre code: 123456'
                  cascade: true
              whatsapp_template:
                summary: WhatsApp template (opens a conversation at any time)
                value:
                  to: '+212612345678'
                  channel: whatsapp
                  template:
                    name: order_update
                    language: fr
                  metadata:
                    variables:
                      - Amal
                      - '#1234'
              whatsapp_reply:
                summary: WhatsApp text reply quoting the customer's message (inside the 24-hour window)
                value:
                  to: '+212612345678'
                  channel: whatsapp
                  message: Votre colis part aujourd'hui.
                  context:
                    message_id: wamid.HBgLMjEyNjEyMzQ1Njc4FQIAEhgg
              whatsapp_reaction:
                summary: WhatsApp reaction (not billed)
                value:
                  to: '+212612345678'
                  channel: whatsapp
                  reaction:
                    message_id: wamid.HBgLMjEyNjEyMzQ1Njc4FQIAEhgg
                    emoji: 👍
              whatsapp_location:
                summary: WhatsApp location pin
                value:
                  to: '+212612345678'
                  channel: whatsapp
                  location:
                    latitude: 33.5731
                    longitude: -7.5898
                    name: Agence Casablanca
              whatsapp_contacts:
                summary: WhatsApp contact card
                value:
                  to: '+212612345678'
                  channel: whatsapp
                  contacts:
                    - name:
                        formatted_name: Service client
                      phones:
                        - phone: '+212522000000'
                          type: WORK
              whatsapp_cta_url:
                summary: WhatsApp call-to-action URL button
                value:
                  to: '+212612345678'
                  channel: whatsapp
                  interactive:
                    type: cta_url
                    body:
                      text: Suivez votre commande en direct.
                    action:
                      name: cta_url
                      parameters:
                        display_text: Suivre
                        url: https://example.com/track/1234
              whatsapp_video_by_id:
                summary: WhatsApp video by uploaded media id
                value:
                  to: '+212612345678'
                  channel: whatsapp
                  video:
                    id: '1234567890'
                    caption: Démonstration
      responses:
        '202':
          description: Message queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: 'Bad request — including OUT_OF_24H_WINDOW (WhatsApp free-form message outside the customer service window; the error also carries window_expired: true and window_expires_at) and the WhatsApp payload codes listed in Error Format. Nothing is charged.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          description: Insufficient balance
        '403':
          description: WHATSAPP_NOT_CONNECTED (no connected WhatsApp Business number), FORBIDDEN_ASSET, OPTED_OUT, or a Sender ID that is not usable yet
        '429':
          description: Rate limit exceeded
      tags:
        - SMS & WhatsApp Messaging
    get:
      summary: List messages
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - queued
              - sent
              - delivered
              - failed
              - undeliverable
        - name: channel
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: from_date
          in: query
          description: Start date (ISO 8601)
          schema:
            type: string
        - name: to_date
          in: query
          description: End date (ISO 8601)
          schema:
            type: string
        - name: format
          in: query
          description: Set to `csv` to download the full filtered set (not a page) as a UTF-8 CSV file, capped at 10000 rows. When the cap applies, the file's last row says so.
          schema:
            type: string
            enum:
              - csv
      responses:
        '200':
          description: List of messages
      tags:
        - SMS & WhatsApp Messaging
  /messages/bulk:
    post:
      summary: Send bulk messages
      description: Send up to 10,000 messages in one request. channel whatsapp sends free-form text from your connected WhatsApp Business number (403 WHATSAPP_NOT_CONNECTED otherwise); each recipient must have written to your number in the last 24 hours. Entries the platform refuses — outside that window (OUT_OF_24H_WINDOW), opted out, … — are listed under rejected with their error code and are never charged.
      operationId: sendBulk
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Unique string (max 255 chars) making this batch safe to retry without double-sending. See the Idempotency section above.
          schema:
            type: string
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkSendRequest'
            examples:
              sms_bulk:
                summary: SMS bulk
                value:
                  channel: sms
                  from: MaMarque
                  messages:
                    - to: '+212612345678'
                      message: Bonjour Amal
                    - to: '+212698765432'
                      message: Bonjour Youssef
      responses:
        '202':
          description: Batch queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  batch_id:
                    type: string
                  total:
                    type: integer
                    description: Messages queued
                  channel:
                    type: string
                  estimated_cost:
                    type: object
                    properties:
                      eur:
                        type: number
                      mad:
                        type: number
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        to:
                          type: string
                        status:
                          type: string
                          example: queued
                  rejected:
                    type: array
                    description: Present only when some entries were refused. Nothing was charged for them.
                    items:
                      type: object
                      properties:
                        to:
                          type: string
                        code:
                          type: string
                          example: OUT_OF_24H_WINDOW
                        message:
                          type: string
      tags:
        - SMS & WhatsApp Messaging
  /messages/{id}:
    get:
      summary: Get message status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Message details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageRecord'
        '404':
          description: Message not found
      tags:
        - SMS & WhatsApp Messaging
  /messages/typing:
    post:
      summary: WhatsApp typing indicator
      description: 'Marks a WhatsApp message you received as read and shows your contact a typing indicator while you prepare the reply. The indicator disappears when you reply, or after about 25 seconds. Not a message: nothing is stored or charged. Answered synchronously; a refusal by WhatsApp returns its META_* code. Requires the send scope and a connected WhatsApp Business number; sandbox keys simulate.'
      operationId: sendTypingIndicator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message_id
              properties:
                message_id:
                  type: string
                  description: WhatsApp message id (wamid) of the message you received
                  example: wamid.HBgLMjEyNjEyMzQ1Njc4FQIAEhgg
                typing_indicator:
                  type: boolean
                  default: true
                  description: false sends the read receipt alone
                phone_number_id:
                  type: string
                  description: Which of your connected numbers received the message; defaults to your default number
      responses:
        '200':
          description: Accepted by WhatsApp (or simulated on a sandbox key)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                      - simulated
                  message_id:
                    type: string
                  typing_indicator:
                    type: boolean
                  sandbox:
                    type: boolean
        '400':
          description: MISSING_FIELD / INVALID_FIELD, or a WhatsApp refusal (META_*)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: WHATSAPP_NOT_CONNECTED or FORBIDDEN_ASSET
        '502':
          description: META_SERVICE_UNAVAILABLE — WhatsApp could not be reached; retry
      tags:
        - SMS & WhatsApp Messaging
  /verify/send:
    post:
      summary: Send OTP verification code
      x-payment-info:
        intent: session
        method: stripe
        amount: '5.00'
        currency: usd
        description: EnvoiSMS OTP verification prepaid session deposit
        offers:
          - intent: session
            method: stripe
            amount: '5.00'
            currency: usd
          - intent: session
            method: tempo
            amount: '5000000'
            currency: usd
      operationId: sendVerify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifySendRequest'
      responses:
        '202':
          description: OTP sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id:
                    type: string
                  message_id:
                    type: string
                    description: Underlying message id (sms channel only)
                  to:
                    type: string
                  channel:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
                  status:
                    type: string
                    example: sent
                  cost:
                    type: object
                    description: Managed whatsapp verifications only — the flat per-verification price
                    properties:
                      eur:
                        type: number
                      mad:
                        type: number
                  sandbox:
                    type: boolean
                    description: Present and true on env_test_ keys; nothing was delivered
                  sandbox_code:
                    type: string
                    description: Sandbox keys only — the generated code, returned so the check endpoint can be exercised in tests. Never present on a live key.
      tags:
        - Phone Verification (OTP)
  /verify/resend:
    post:
      summary: Resend the code of an existing verification session
      description: |
        Re-delivers the code of a still-pending session, optionally over a
        different channel. Available on every plan, including Starter — it needs
        the same `verify` scope as /verify/send and nothing more.

        The code itself is unchanged, so an earlier message that arrives late is
        still valid. Whichever channel you choose, the session's expiry and
        remaining attempts are untouched.

        **Cooldown.** A resend is refused with `OTP_COOLDOWN` (429) until the
        window opened by the *previous* delivery has passed: 60 s after a
        WhatsApp delivery, 30 s after an SMS one. `/verify/send` reports the
        applicable figure as `resend_after_seconds`, and
        `GET /verify/{session_id}` reports the live countdown as
        `resend_available_in_seconds`. The window is per account and
        destination — other customers' traffic to the same number does not
        affect yours. `Retry-After` on the 429 carries the exact remaining
        seconds.

        **Sandbox keys.** An `env_test_` key simulates: nothing is delivered and
        nothing is charged. The response carries `sandbox: true` alongside the
        `sandbox_code`, so a simulated resend is never mistaken for a delivered
        one. A sandbox key can only resend sessions it created, and a live key
        only live sessions.
      operationId: resendVerify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - session_id
              properties:
                session_id:
                  type: string
                  description: The session returned by /verify/send. Must still be pending and unexpired.
                channel:
                  type: string
                  enum:
                    - sms
                    - whatsapp
                  default: sms
                  description: Channel for this delivery. Defaults to sms, which is also the useful fallback when a WhatsApp code did not arrive. whatsapp requires the session's code to be 4–8 numeric digits, the only shape the authentication template accepts.
      responses:
        '200':
          description: Code re-sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id:
                    type: string
                  message_id:
                    type: string
                  to:
                    type: string
                  channel:
                    type: string
                    enum:
                      - sms
                      - whatsapp
                  status:
                    type: string
                    example: sent
                  resend_after_seconds:
                    type: integer
                    description: Seconds before this session accepts another resend
                  expires_at:
                    type: string
                    format: date-time
                  sandbox:
                    type: boolean
                    description: Present and true on env_test_ keys; nothing was delivered and nothing was charged
                  simulated:
                    type: boolean
                    description: Present and true on env_test_ keys
                  sandbox_code:
                    type: string
                    description: Sandbox keys only — never present on a live key
        '400':
          description: Session already completed or invalid (INVALID_STATE), expired (SESSION_EXPIRED), or a non-numeric code requested over whatsapp (INVALID_CODE_TYPE)
        '402':
          description: Insufficient balance (INSUFFICIENT_BALANCE)
        '404':
          description: Session not found or expired (SESSION_NOT_FOUND). Also returned when a sandbox key targets a live session or vice versa — the message names the cause.
        '429':
          description: Cooldown still open (OTP_COOLDOWN); Retry-After carries the remaining seconds
        '502':
          description: The channel accepted nothing (DELIVERY_FAILED); nothing was charged. Retry over sms.
      tags:
        - Phone Verification (OTP)
  /verify/check:
    post:
      summary: Check OTP code
      operationId: checkVerify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - session_id
                - code
              properties:
                session_id:
                  type: string
                code:
                  type: string
                  example: '123456'
      responses:
        '200':
          description: Code verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id:
                    type: string
                  verified:
                    type: boolean
                  verified_at:
                    type: string
                    format: date-time
        '400':
          description: Wrong code (error code INVALID_CODE; the message states how many attempts remain)
        '404':
          description: Session not found, or the code expired (EXPIRED_CODE)
        '429':
          description: Maximum verification attempts exceeded (MAX_ATTEMPTS); the session is closed
      tags:
        - Phone Verification (OTP)
  /verify/lookup:
    post:
      summary: Validate phone number (EnvoiSMS Lookup Engine)
      description: Validates phone number format, carrier, and location using the operator database.
      operationId: lookupNumber
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - number
              properties:
                number:
                  type: string
                  description: Phone number to validate (E.164 or local format)
                  example: '+212612345678'
                country_code:
                  type: string
                  description: Optional ISO 2-letter country code
                  example: MA
      responses:
        '200':
          description: Phone validation information
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  number:
                    type: string
                  local_format:
                    type: string
                  international_format:
                    type: string
                  country_prefix:
                    type: string
                  country_code:
                    type: string
                  country_name:
                    type: string
                  location:
                    type: string
                  carrier:
                    type: string
                  line_type:
                    type: string
        '400':
          description: Missing or invalid parameters
      tags:
        - Phone Verification (OTP)
  /verify/{session_id}:
    get:
      summary: Get OTP verification session
      operationId: getVerifySession
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OTP session
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  to:
                    type: string
                  channel:
                    type: string
                    enum:
                      - sms
                      - whatsapp
                      - telegram
                      - voice
                      - rcs
                  app_id:
                    type: string
                    nullable: true
                  status:
                    type: string
                    enum:
                      - pending
                      - verified
                      - failed
                      - expired
                  expires_at:
                    type: string
                    format: date-time
                  verified_at:
                    type: string
                    format: date-time
                    nullable: true
                  created_at:
                    type: string
                    format: date-time
                  attempts_used:
                    type: integer
                  attempts_remaining:
                    type: integer
                  resend_available_in_seconds:
                    type: integer
                    description: 0 when a resend is accepted right now
                  can_resend_now:
                    type: boolean
                  deliveries:
                    type: array
                    description: One entry per delivery attempt, oldest first, with the outcome the network reported. This is the authoritative answer to "did my user receive the code?" — a delivered entry means the handset acknowledged it.
                    items:
                      type: object
                      properties:
                        channel:
                          type: string
                          enum:
                            - sms
                            - whatsapp
                        kind:
                          type: string
                          enum:
                            - send
                            - resend
                        status:
                          type: string
                          enum:
                            - submitted
                            - sent
                            - delivered
                            - read
                            - failed
                            - simulated
                          description: 'simulated means a sandbox key: nothing left the platform'
                        simulated:
                          type: boolean
                        submitted_at:
                          type: string
                          format: date-time
                        delivered_at:
                          type: string
                          format: date-time
                          nullable: true
                        read_at:
                          type: string
                          format: date-time
                          nullable: true
