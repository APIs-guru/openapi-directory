      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Billing transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                          enum:
                            - topup
                            - usage
                            - refund
                            - adjustment
                            - grant
                          description: grant = the welcome credit written once at signup; it is not a payment and cannot be receipted
                        amount_eur:
                          type: number
                        amount_mad:
                          type: number
                        balance_after_eur:
                          type: number
                        description:
                          type: string
                        reference:
                          type: string
                          nullable: true
                        payment_method:
                          type: string
                          nullable: true
                        status:
                          type: string
                        created_at:
                          type: string
                          format: date-time
                  limit:
                    type: integer
                  offset:
                    type: integer
                  total:
                    type: integer
      tags:
        - Billing & Balances
  /billing/plans:
    get:
      summary: List plan pricing
      operationId: listBillingPlans
      responses:
        '200':
          description: Pricing rows by plan and channel
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        plan:
                          type: string
                          example: starter
                        channel:
                          type: string
                          enum:
                            - sms
                            - whatsapp
                            - telegram
                            - voice
                            - rcs
                        price_eur:
                          type: number
                          example: 0.04455
                        price_mad:
                          type: number
                          example: 0.49
      tags:
        - Billing & Balances
  /billing/packs:
    get:
      summary: List prepaid SMS packs
      description: Returns the sellable prepaid credit packs. What a pack buys is `amount_mad` of credit; `sms` is an ESTIMATE of how many messages that becomes at `price_per_sms_mad`, for a single-segment Moroccan message on the default sender. A custom sender ID bills at the `sms_custom` rate, and longer messages cost more than one segment, so the real count is usually lower. `sms_estimated` is always true — never treat `sms` as an entitlement. Completing a pack top-up also updates the account to the matching volume tier. `min_topup_mad` is the floor for a custom-amount top-up on POST /billing/topups.
      operationId: listBillingPacks
      responses:
        '200':
          description: SMS pack rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: sms-1000
                        sms:
                          type: integer
                          example: 1000
                          description: Estimated message count, not a guaranteed quantity. See sms_estimated.
                        sms_estimated:
                          type: boolean
                          example: true
                          description: Always true. The count varies with destination, sender type and segments.
                        amount_eur:
                          type: number
                          example: 34.55
                        amount_mad:
                          type: number
                          example: 380
                        price_per_sms_mad:
                          type: number
                          example: 0.38
                        volume_tier:
                          type: string
                          example: business
                  min_topup_mad:
                    type: number
                    example: 275
                    description: Minimum accepted amount_mad for a custom top-up.
      tags:
        - Billing & Balances
  /billing/payment-methods:
    get:
      summary: List configured payment methods
      description: Returns Stripe, crypto, and bank-transfer availability for the authenticated account. Missing configuration names are returned so operators know what to configure before taking live payments.
      operationId: listBillingPaymentMethods
      responses:
        '200':
          description: Payment method readiness
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          enum:
                            - stripe
                            - crypto
                            - bank_transfer
                        label:
                          type: string
                        configured:
                          type: boolean
                        missing:
                          type: array
                          items:
                            type: string
                        settlement:
                          type: string
                          enum:
                            - automatic
                            - manual
                        description:
                          type: string
      tags:
        - Billing & Balances
  /billing/topups:
    post:
      summary: Create balance top-up or SMS pack
      description: Creates a custom balance top-up or a prepaid SMS pack. Pack top-ups carry a volume tier, for example `sms-1000` unlocks the `business` SMS price when payment is completed.
      operationId: createBillingTopup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount_eur:
                  type: number
                  minimum: 10
                  example: 50
                  description: Required for custom top-ups. Optional when pack_id is provided.
                pack_id:
                  type: string
                  example: sms-1000
                payment_method:
                  type: string
                  enum:
                    - stripe
                    - crypto
                    - bank_transfer
                  example: stripe
      responses:
        '201':
          description: Pending top-up
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: topup_abcd
                  status:
                    type: string
                    example: pending
                  amount_eur:
                    type: number
                    example: 50
                  amount_mad:
                    type: number
                    example: 550
                  pack_id:
                    type: string
                    nullable: true
                    example: sms-1000
                  sms_count:
                    type: integer
                    nullable: true
                    example: 1000
                  volume_tier:
                    type: string
                    nullable: true
                    example: business
                  price_per_sms_mad:
                    type: number
                    nullable: true
                    example: 0.38
                  checkout_url:
                    type: string
                    format: uri
                  instructions:
                    type: object
                    additionalProperties: true
        '400':
          description: Invalid amount, pack, or payment method
        '503':
          description: Requested payment method is not configured. Configure the missing Stripe or bank-transfer fields before retrying.
      tags:
        - Billing & Balances
  /billing/topups/claim:
    post:
      summary: Claim paid top-ups
      description: |
        Verifies the caller's pending top-ups against the payment provider and credits the ones that are confirmed paid. The dashboard calls this automatically on the checkout success redirect, so the balance reflects a payment within seconds even if webhook delivery lags. Idempotent — a top-up is only ever credited once, and only the caller's own top-ups are examined.
      operationId: claimBillingTopups
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                session_id:
                  type: string
                  description: Checkout session id from the success redirect. Narrows the claim to that checkout.
                topup_id:
                  type: string
                  description: Alternatively, a specific top-up id to claim.
      responses:
        '200':
          description: Claim outcome and refreshed balances
          content:
            application/json:
              schema:
                type: object
                properties:
                  claimed:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: topup_abcd
                        status:
                          type: string
                          example: completed
                  completed:
                    type: integer
                    example: 1
                  balance_eur:
                    type: number
                    example: 61.82
                  balance_mad:
                    type: number
                    example: 680
      tags:
        - Billing & Balances
  /billing/quota:
    get:
      summary: Get billing quota limit
      description: Gets the monthly spending/sending quota limits configured for safety.
      operationId: getQuota
      responses:
        '200':
          description: Quota configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  monthly_limit_mad:
                    type: number
                  monthly_usage_mad:
                    type: number
      tags:
        - Billing & Balances
    patch:
      summary: Update billing quota limit
      description: Updates the monthly spending and sending quota limit for the account.
      operationId: updateQuota
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - monthly_limit_mad
              properties:
                monthly_limit_mad:
                  type: number
                  example: 5000
      responses:
        '200':
          description: Quota updated successfully
      tags:
        - Billing & Balances
  /analytics:
    get:
      summary: Get usage analytics
      operationId: getAnalytics
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 30
            maximum: 365
      responses:
        '200':
          description: Analytics data
          content:
            application/json:
              schema:
                type: object
                properties:
                  window_days:
                    type: integer
                  summary:
                    type: object
                    properties:
                      total:
                        type: integer
                      delivered:
                        type: integer
                      failed:
                        type: integer
                      delivery_rate:
                        type: number
                      cost_eur:
                        type: number
                      cost_mad:
                        type: number
                  channels:
                    type: array
                    items:
                      type: object
                  daily:
                    type: array
                    items:
                      type: object
      tags:
        - Analytics & Reporting
  /api-keys:
    get:
      summary: List API keys
      operationId: listApiKeys
      responses:
        '200':
          description: API keys without full secret values
      tags:
        - API Keys & Security
    post:
      summary: Create API key
      operationId: createApiKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Production key
                permissions:
                  type: array
                  items:
                    type: string
                    enum:
                      - send
                      - verify
                      - status
                      - balance
                      - contacts
                      - campaigns
                      - webhooks
                      - billing
                      - analytics
                      - api_keys
                      - optouts
                ip_whitelist:
                  type: array
                  items:
                    type: string
                rate_limit:
                  type: integer
                  minimum: 10
                  maximum: 1000
                sandbox:
                  type: boolean
                  default: false
                  description: |
                    Mint a sandbox key, prefixed `env_test_` instead of `smr_`. Requests on a sandbox key are validated, priced and recorded exactly like live ones — opt-out list, sender rules, phishing screen and quota all apply — but nothing is delivered to a carrier, no balance is debited and no invoice line is created. A simulated delivery receipt follows a few seconds later, including the `delivered` webhook. Sends and OTPs made with a sandbox key are excluded from analytics and are only visible to sandbox keys. A key's mode is fixed at creation; create a new key to switch.
      responses:
        '201':
          description: API key created. Full key is returned once.
      tags:
        - API Keys & Security
  /api-keys/{id}:
    patch:
      summary: Update API key
      operationId: updateApiKey
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                permissions:
                  type: array
                  items:
                    type: string
                ip_whitelist:
                  type: array
                  items:
                    type: string
                rate_limit:
                  type: integer
                active:
                  type: boolean
      responses:
        '200':
          description: API key updated
      tags:
        - API Keys & Security
    delete:
      summary: Revoke API key
      operationId: revokeApiKey
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: API key revoked
      tags:
        - API Keys & Security
  /account/export:
    get:
      summary: Export account data (data rights)
      description: 'Self-service data export (Law 09-08 / GDPR): returns the account''s personal data — profile, ledger, message logs, contacts, webhooks, verification sessions, support cases, opt-outs — as one JSON artefact. Dashboard session only; API keys are refused. Tables over the export cap are truncated and named in `truncated_tables` inside the file itself.'
      operationId: exportAccountData
      responses:
        '200':
          description: JSON export bundle (Content-Disposition attachment)
        '403':
          description: Only available from a dashboard session
      tags:
        - Account & Privacy
  /account/deletion-request:
    post:
      summary: Request account deletion (data rights)
      description: 'Opens a tracked erasure request (Law 09-08 / GDPR), processed within 30 days by an operator: personal data is erased or anonymised, invoicing records are retained for the legal accounting period. Dashboard session only. Idempotent — a second call returns the already-open case.'
      operationId: requestAccountDeletion
      responses:
        '200':
          description: A deletion request was already open
        '202':
          description: Deletion request recorded, case id returned
        '403':
          description: Only available from a dashboard session
      tags:
        - Account & Privacy
  /health:
    get:
      summary: Health check
      description: Public service health endpoint. This route is served from the API root, not the /v1 prefix.
      operationId: healthCheck
      servers:
        - url: https://api.envoisms.ma
          description: Production root
        - url: https://api-staging.envoisms.ma
          description: Staging root configuration; deploy and verify before using
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: envoisms-api
                  version:
                    type: string
                    example: 1.0.0
                  time:
                    type: string
                    format: date-time
      tags:
        - System & Utilities
  /search:
    get:
      summary: Natural language search
      description: Search EnvoiSMS.ma features, pricing, documentation, integrations, and operator details using a natural language query. Helpful for AI search engine grounding.
      operationId: searchFeatures
      parameters:
        - name: q
          in: query
          description: Search term or natural language query
          required: true
          schema:
            type: string
            example: WooCommerce
      responses:
        '200':
          description: Successful search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  query:
                    type: string
                  count:
                    type: integer
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                        description:
                          type: string
                        category:
                          type: string
                        url:
                          type: string
                        tags:
                          type: array
                          items:
                            type: string
      tags:
        - System & Utilities
  /recommend:
    get:
      summary: Get system recommendations
      description: Recommends the best pricing pack, channel, integration code, and strategy based on your industry, use case, or expected message volume.
      operationId: getRecommendations
      parameters:
        - name: q
          in: query
          description: Natural language use case or industry description (e.g. ecommerce shipping, otp)
          required: false
          schema:
            type: string
            example: ecommerce in Morocco
        - name: volume
          in: query
          description: Expected monthly message volume
          required: false
          schema:
            type: integer
            example: 5000
        - name: industry
          in: query
          description: Business industry
          required: false
          schema:
            type: string
            example: retail
      responses:
        '200':
          description: System recommendations
          content:
            application/json:
              schema:
                type: object
                properties:
                  recommendation:
                    type: object
                    properties:
                      channel:
                        type: string
                        enum:
                          - sms
                          - whatsapp
                          - cascade
                      pricing_pack:
                        type: object
                        properties:
                          id:
                            type: string
                          sms:
                            type: integer
                          price_mad:
                            type: number
                          price_per_sms_mad:
                            type: number
                      reasoning:
                        type: string
                      setup_guidelines:
                        type: object
                        properties:
                          engine:
                            type: string
                          sample_code:
                            type: string
                      whatsapp_chat_url:
                        type: string
                      buy_url:
                        type: string
      tags:
        - System & Utilities
tags:
  - name: SMS & WhatsApp Messaging
    description: Direct multi-operator SMS gateway (Maroc Telecom, Orange, Inwi) and official Meta Cloud API WhatsApp Business messaging with template support, rich media, interactive buttons, typing indicators, and automatic carrier failover.
  - name: Phone Verification (OTP)
    description: Zero-infrastructure phone number verification. Handles one-time passcode generation, WhatsApp & SMS multi-channel delivery, automated fallback, expiry handling, and rate-limited validation.
  - name: Number Intelligence & HLR
    description: Real-time Moroccan (IAM, Orange, Inwi) and international phone number validation, E.164 normalization, carrier resolution, and mobile number portability (MNP) intelligence.
  - name: Conversations & Live Chat
    description: Two-way customer conversation threads across WhatsApp and SMS. Retrieve message timelines, customer interactions, agent replies, and monitor the 24-hour customer care window.
  - name: WhatsApp Business Profile
    description: Manage your connected WhatsApp Business Account (WABA) profile details, business description, verified display name, logo URL, and customer support contact details.
  - name: AI Qualified Leads
    description: AtlasAI™ automated conversational lead qualification. Inspect BANT scores (Budget, Authority, Need, Timing), Darija/Arabic/French customer sentiment, and qualification status.
  - name: Inbound Webhooks
    description: Ingest leads and triggers from external platforms (Meta Lead Ads, TikTok Lead Generation, Google Forms, Typeform, Webflow, Zapier) and trigger instant WhatsApp engagement.
  - name: Contacts & Audience
    description: Customer contact management, metadata attributes, audience list segmentation, and high-performance bulk CSV contact imports.
  - name: Campaigns & Bulk Dispatch
    description: Large-scale broadcast campaigns via SMS and WhatsApp. Schedule personalized promotional and transactional marketing campaigns with real-time delivery progress metrics.
  - name: Compliance & Consent
    description: Moroccan Law 09-08 (CNDP) and GDPR compliance ledger. Record explicit opt-in consents, manage automated STOP / UNSUB keyword opt-outs, and maintain auditable compliance logs.
  - name: Delivery Webhooks (DLR)
    description: Real-time HTTP delivery notifications with HMAC-SHA256 signature verification. Manage webhook endpoints, rotate signing secrets, and trigger test delivery payloads.
  - name: Billing & Balances
    description: Account balance queries, prepaid credit top-ups via Stripe and Moroccan bank transfer, automated MAD tax invoices, pricing plans, and rate quota limits.
  - name: Analytics & Reporting
    description: Delivery performance metrics, carrier latency breakdowns, SMS segment usage, and channel distribution analytics.
  - name: API Keys & Security
    description: Manage live and sandbox API keys, configure IP address restrictions, and set granular access scopes.
  - name: Account & Privacy
    description: CNDP / GDPR data portability exports, customer audit trails, and formal account deletion requests.
  - name: System & Utilities
    description: Platform health monitoring, service availability checks, AI natural-language documentation search, and use-case recommendation engine.
x-tagGroups:
  - name: Core Messaging & Verification
    tags:
      - SMS & WhatsApp Messaging
      - Phone Verification (OTP)
      - Number Intelligence & HLR
  - name: Conversations & WhatsApp AI
    tags:
      - Conversations & Live Chat
      - WhatsApp Business Profile
      - AI Qualified Leads
      - Inbound Webhooks
  - name: Audience, Campaigns & Webhooks
    tags:
      - Contacts & Audience
      - Campaigns & Bulk Dispatch
      - Compliance & Consent
      - Delivery Webhooks (DLR)
  - name: Billing, Analytics & Management
    tags:
      - Billing & Balances
      - Analytics & Reporting
      - API Keys & Security
      - Account & Privacy
      - System & Utilities
