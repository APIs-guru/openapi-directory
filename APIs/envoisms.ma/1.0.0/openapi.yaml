  /consents:
    get:
      summary: List consent events
      description: |
        Append-only consent ledger: the evidence behind an opt-in or an opt-out
        (Law 09-08 art. 10, CNDP). Every grant and every withdrawal is one event
        with its source and evidence; the current state of a number is derived
        from the latest event per purpose (see `GET /consents/{phone}`).

        The platform writes events itself when it observes the person's own act:
        STOP / START keywords on WhatsApp (`whatsapp_keyword`), STOP on SMS
        (`sms_keyword`), and the first customer-initiated WhatsApp conversation
        (`whatsapp_inbound`, purpose `service`). Everything the platform cannot
        see — a web form, a signed import — is yours to record via `POST`.

        Add `format=csv` to download every matching event as a file (capped at
        10,000 rows; when the cap bites the last row of the file says so).
      operationId: listConsents
      parameters:
        - name: phone
          in: query
          description: E.164 number to filter on
          schema:
            type: string
            example: '+212612345678'
        - name: purpose
          in: query
          schema:
            type: string
            enum:
              - marketing
              - transactional
              - otp
              - service
        - name: status
          in: query
          schema:
            type: string
            enum:
              - granted
              - withdrawn
        - name: from
          in: query
          description: Only events recorded at or after this ISO 8601 timestamp
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: format
          in: query
          description: '`csv` returns the full filtered set as a file'
          schema:
            type: string
            enum:
              - json
              - csv
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 500
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Consent events, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConsentEvent'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
      tags:
        - Compliance & Consent
    post:
      summary: Record a consent event
      description: |
        Records that a person granted or withdrew consent, with the evidence you
        hold (the wording shown, the page URL, the IP, a reference). `recorded_at`
        may be backdated for an imported consent; it cannot be in the future.
        A `marketing` withdrawal is also placed on the opt-out list immediately.

        `source` is limited to `api`, `form`, `import` and `dashboard`: the
        keyword and inbound sources are the platform's own observations and are
        reserved.
      operationId: createConsent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
                - purpose
              properties:
                phone:
                  type: string
                  example: '+212612345678'
                purpose:
                  type: string
                  enum:
                    - marketing
                    - transactional
                    - otp
                    - service
                status:
                  type: string
                  enum:
                    - granted
                    - withdrawn
                  default: granted
                channel:
                  type: string
                  enum:
                    - whatsapp
                    - sms
                    - any
                  default: any
                source:
                  type: string
                  enum:
                    - api
                    - form
                    - import
                    - dashboard
                  default: api
                evidence:
                  type: object
                  description: Free-form JSON object under 4 KB — the wording shown, url, ip, reference
                  example:
                    text: J'accepte de recevoir les offres par WhatsApp
                    url: https://example.ma/inscription
                    ip: 41.140.0.1
                recorded_at:
                  type: string
                  format: date-time
                  description: When the person acted (defaults to now; may be backdated, never in the future)
      responses:
        '201':
          description: Event recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentEvent'
        '400':
          description: INVALID_PHONE, INVALID_PURPOSE, INVALID_STATUS, INVALID_CHANNEL, INVALID_SOURCE, INVALID_EVIDENCE or INVALID_DATE
      tags:
        - Compliance & Consent
  /consents/{phone}:
    get:
      summary: Consent state and history for a number
      description: |
        The answer to "show me this person's consent": the current state per
        purpose (derived from the newest event — `unknown` when no event exists,
        never assumed granted), whether the number sits on the opt-out list, and
        the full event history, newest first.
      operationId: getConsentForPhone
      parameters:
        - name: phone
          in: path
          required: true
          schema:
            type: string
            example: '+212612345678'
      responses:
        '200':
          description: Derived state and history
          content:
            application/json:
              schema:
                type: object
                properties:
                  phone:
                    type: string
                  opted_out:
                    type: boolean
                  opted_out_at:
                    type: string
                    nullable: true
                  state:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        status:
                          type: string
                          enum:
                            - granted
                            - withdrawn
                            - unknown
                        channel:
                          type: string
                        source:
                          type: string
                        recorded_at:
                          type: string
                        record_id:
                          type: string
                  history:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConsentEvent'
      tags:
        - Compliance & Consent
  /webhooks:
    get:
      summary: List webhooks
      operationId: listWebhooks
      responses:
        '200':
          description: Webhook list
      tags:
        - Delivery Webhooks (DLR)
    post:
      summary: Create webhook
      operationId: createWebhook
      description: 'Message events POST one payload shape regardless of where in the pipeline the state change happened: `{ "id", "to", "channel", "status", "error_code", "error_message" }` — the two error fields are present only on failed/undeliverable events and carry the same values as the stored message (see the Message schema). `id` is the EnvoiSMS message id, the same one the send call returned. `metadata` supplied at send time is included on delivery-report events.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  format: uri
                  example: https://yourapp.com/smsma-webhook
                events:
                  type: array
                  items:
                    type: string
                    enum:
                      - message.sent
                      - message.delivered
                      - message.failed
                      - message.undeliverable
                      - message.fallback
                      - message.test
                      - message.*
                  default:
                    - message.delivered
                    - message.failed
                secret:
                  type: string
                  description: Optional HMAC secret. Generated and returned when omitted.
      responses:
        '201':
          description: Webhook created
      tags:
        - Delivery Webhooks (DLR)
