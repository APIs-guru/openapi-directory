  /conversations/{phone}/messages:
    post:
      summary: Send live chat reply
      description: Sends an agent message to a contact and mutes the bot on that conversation (un-mute with POST /conversations/{phone}/toggle-bot). A free-form WhatsApp message (text or media) requires the contact to have written in the last 24 hours — otherwise 400 OUT_OF_24H_WINDOW; a template (template_id or template_name) may be sent at any time. Billed like the same send on POST /messages.
      operationId: sendConversationReply
      parameters:
        - name: phone
          in: path
          required: true
          schema:
            type: string
            example: '+212612345678'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  description: Text of the reply (or the caption of media_url)
                channel:
                  type: string
                  enum:
                    - whatsapp
                    - sms
                  default: whatsapp
                phone_number_id:
                  type: string
                  description: Which connected WhatsApp number replies
                template_name:
                  type: string
                  description: Approved WhatsApp template to send instead of free text
                template_id:
                  type: string
                template_language:
                  type: string
                  example: fr
                variables:
                  type: array
                  items:
                    type: string
                  description: Template placeholder values in order
                media_url:
                  type: string
                  description: 'https URL (or data: URI) of an image or PDF to attach'
                media_type:
                  type: string
                  enum:
                    - image
                    - document
                filename:
                  type: string
      responses:
        '201':
          description: Reply sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  message:
                    type: object
                    properties:
                      id:
                        type: string
                      phone:
                        type: string
                      role:
                        type: string
                        example: agent
                      message:
                        type: string
                      status:
                        type: string
                        example: sent
                      channel:
                        type: string
                      created_at:
                        type: string
                        format: date-time
        '400':
          description: OUT_OF_24H_WINDOW, TEMPLATE_NOT_APPROVED or MISSING_MESSAGE
        '404':
          description: TEMPLATE_NOT_FOUND
      tags:
        - Conversations & Live Chat
