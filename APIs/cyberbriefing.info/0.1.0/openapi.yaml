      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Q
      - name: origin_country
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Origin Country
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ThreatActorResponse'
                title: Response List Threat Actors Api V1 Threats Actors Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Threats
      summary: Create Threat Actor
      operationId: create_threat_actor_api_v1_threats_actors_post
      security:
      - APIKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreatActorCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreatActorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/threats:
    get:
      tags:
      - Threats
      summary: List threat actors (compat)
      operationId: list_threat_actors_api_v1_threats_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Q
      - name: origin_country
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Origin Country
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ThreatActorResponse'
                title: Response List Threat Actors Api V1 Threats Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/threats/actors/{actor_id}:
    get:
      tags:
      - Threats
      summary: Get threat actor
      operationId: get_threat_actor_api_v1_threats_actors__actor_id__get
      security:
      - APIKeyHeader: []
      parameters:
      - name: actor_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Actor Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreatActorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/cves:
    get:
      tags:
      - CVEs
      summary: List CVEs
      operationId: list_cves_api_v1_cves_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search by CVE ID or description
          title: Q
        description: Search by CVE ID or description
      - name: severity
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: CRITICAL, HIGH, MEDIUM, LOW
          title: Severity
        description: CRITICAL, HIGH, MEDIUM, LOW
      - name: exploits_available
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Exploits Available
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CVEResponse'
                title: Response List Cves Api V1 Cves Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - CVEs
      summary: Ingest CVE
      operationId: create_cve_api_v1_cves_post
      security:
      - APIKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CVECreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CVEResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/cves/{cve_id_str}:
    get:
      tags:
      - CVEs
      summary: Get CVE by CVE ID
      operationId: get_cve_api_v1_cves__cve_id_str__get
      security:
      - APIKeyHeader: []
      parameters:
      - name: cve_id_str
        in: path
        required: true
        schema:
          type: string
          title: Cve Id Str
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CVEResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/feed:
    get:
      tags:
      - Feed
      summary: STIX/TAXII threat feed (Enterprise only)
      operationId: get_feed_api_v1_feed_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 5000
          minimum: 1
          default: 100
          title: Limit
      - name: since
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: ISO8601 datetime for delta feed
          title: Since
        description: ISO8601 datetime for delta feed
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/STIXBundle'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/search:
    get:
      tags:
      - Search
      summary: Search across all threat intel
      operationId: search_api_v1_search_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 2
          description: Search query
          title: Q
        description: Search query
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional category filter (e.g. ransomware, cve, apt)
          title: Category
        description: Optional category filter (e.g. ransomware, cve, apt)
      - name: since
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: "ISO8601 datetime \u2014 restrict to data after this date"
          title: Since
        description: "ISO8601 datetime \u2014 restrict to data after this date"
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/signup:
    post:
      tags:
      - Auth
      summary: Create account and get a free API key
      operationId: signup_api_v1_auth_signup_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignUpResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: 'Step 1: verify credentials and receive a 2FA code by email'
      description: 'Verify email + password. On success, a 6-digit code is sent to
        the customer''s email.

        The returned `tfa_token_id` must be passed to `POST /login/verify` along with
        the code.'
      operationId: login_init_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginInitResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login/verify:
    post:
      tags:
      - Auth
      summary: 'Step 2: verify the emailed 2FA code and receive a JWT'
      description: Submit the `tfa_token_id` and the code received by email. Returns
        a JWT on success.
      operationId: login_verify_api_v1_auth_login_verify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyTwoFARequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/account/keys:
    get:
      tags:
      - Auth
      summary: List your API keys (JWT required)
      operationId: list_keys_api_v1_auth_account_keys_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountKeysResponse'
      security:
      - HTTPBearer: []
  /api/v1/auth/account/keys/rotate:
    post:
      tags:
      - Auth
      summary: Rotate your active API key (JWT required)
      operationId: rotate_key_api_v1_auth_account_keys_rotate_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotateKeyResponse'
      security:
      - HTTPBearer: []
  /api/v1/auth/account:
    get:
      tags:
      - Auth
      summary: Get current account info (JWT required)
      description: Return basic account details and active API keys. Used by the dashboard
        page.
      operationId: account_info_api_v1_auth_account_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Account Info Api V1 Auth Account Get
      security:
      - HTTPBearer: []
  /api/v1/auth/password/reset:
    post:
      tags:
      - Auth
      summary: Request password reset
      description: Request a password reset link to be sent to the email.
      operationId: request_password_reset_api_v1_auth_password_reset_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/password/reset/confirm:
    post:
      tags:
      - Auth
      summary: Confirm password reset with token
      description: Confirm password reset using token from email.
      operationId: confirm_password_reset_api_v1_auth_password_reset_confirm_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetConfirmResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/billing/checkout:
    post:
      tags:
      - Billing
      summary: Create a Stripe Checkout session to upgrade your plan (JWT required)
      operationId: create_checkout_api_v1_billing_checkout_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/briefings/personas:
    get:
      tags:
      - Briefings
      summary: List available briefing personas
      description: Lists all available personas, which tiers unlock each, and what
        your key can access.
      operationId: list_personas_api_v1_briefings_personas_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonasResponse'
      security:
      - APIKeyHeader: []
  /api/v1/briefings/daily:
    get:
      tags:
      - Briefings
      summary: "Today's persona briefing (Pro/Enterprise \u2014 see /briefings/personas\
        \ for tier access)"
      description: 'Returns today''s threat intelligence briefing tailored to the
        requested persona.


        - **soc_analyst**: IOC packs, detection rules, triage steps (Pro+)

        - **ciso**: Executive risk summary, compliance posture, board metrics (Pro+)

        - **threat_hunter**: TTP hunting packs, MITRE coverage, telemetry tips (Enterprise)

        - **pentest**: Exploit PoC status, attack-path narrative, technique hints
        (Enterprise)


        Free users receive HTTP 403 with an upgrade URL.'
      operationId: get_daily_briefing_api_v1_briefings_daily_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: persona
        in: query
        required: false
        schema:
          type: string
          description: 'Persona: soc_analyst | ciso | threat_hunter | pentest'
          default: soc_analyst
          title: Persona
        description: 'Persona: soc_analyst | ciso | threat_hunter | pentest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/app__api__v1__endpoints__briefings__BriefingResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/briefings/daily/history:
    get:
      tags:
      - Briefings
      summary: Historical persona briefings (Pro/Enterprise)
      description: 'Returns the last N days of briefings for the given persona.  Pro:
        up to 7 days.  Enterprise: up to 30 days.'
