openapi: 3.1.0
info:
  title: CyberBriefing API
  description: "\n## CyberBriefing API\n\nCybersecurity threat intelligence platform\
    \ providing:\n\n- **IOCs** \u2014 Indicators of Compromise (IPs, domains, hashes,\
    \ URLs, emails)\n- **Threats** \u2014 Threat actor profiles and campaign tracking\n\
    - **CVEs** \u2014 CVE lookup with enrichment and exploit status\n- **Feed** \u2014\
    \ STIX 2.1 compatible threat feed (TAXII-ready)\n- **Search** \u2014 Full-text\
    \ search across all intelligence\n\nAll endpoints require an API key via `X-API-Key`\
    \ header.\n    "
  version: 0.1.0
  x-apisguru-categories:
  - security
  x-logo:
    url: https://cyberbriefing.info/favicon.ico
    backgroundColor: '#0f172a'
paths:
  /api/v1/health:
    get:
      tags:
      - Health
      - Health
      summary: Liveness probe
      description: "Basic liveness probe \u2014 returns immediately without DB access."
      operationId: liveness_api_v1_health_get
      responses:
        '200':
          description: Returns ok when the process is alive.
          content:
            application/json:
              schema: {}
  /api/v1/health/db:
    get:
      tags:
      - Health
      - Health
      summary: Database readiness probe
      description: 'Readiness probe that verifies a live DB connection.


        Returns HTTP 200 ``{"status": "ready"}`` on success.

        Returns HTTP 503 ``{"status": "unavailable", "detail": "..."}`` on failure.


        Suitable for use as a container/service readiness endpoint that prevents

        traffic from reaching the API before the database is accessible.'
      operationId: db_readiness_api_v1_health_db_get
      responses:
        '200':
          description: Returns ready when a DB query succeeds; 503 otherwise.
          content:
            application/json:
              schema: {}
  /api/v1/health/system:
    get:
      tags:
      - Health
      - Health
      summary: System resource health check
      description: Check system resource usage (CPU, memory, disk).
      operationId: system_health_api_v1_health_system_get
      responses:
        '200':
          description: Returns system resource usage (CPU, memory, disk).
          content:
            application/json:
              schema: {}
  /api/v1/health/jobs:
    get:
      tags:
      - Health
      - Health
      summary: Background jobs health check
      description: Check status of background job schedulers.
      operationId: jobs_health_api_v1_health_jobs_get
      responses:
        '200':
          description: Returns status of background job schedulers.
          content:
            application/json:
              schema: {}
  /api/v1/health/services:
    get:
      tags:
      - Health
      - Health
      summary: External services health check
      description: Check status of external services.
      operationId: services_health_api_v1_health_services_get
      responses:
        '200':
          description: Returns status of external services (Stripe, email).
          content:
            application/json:
              schema: {}
  /api/v1/health/full:
    get:
      tags:
      - Health
      - Health
      summary: Comprehensive health check
      description: Comprehensive health check including all subsystems.
      operationId: full_health_api_v1_health_full_get
      responses:
        '200':
          description: Returns comprehensive health status including all subsystems.
          content:
            application/json:
              schema: {}
  /api/v1/iocs:
    get:
      tags:
      - IOCs
      summary: List and search IOCs
      operationId: list_iocs_api_v1_iocs_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search query
          title: Q
        description: Search query
      - name: type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: IOC type filter
          title: Type
        description: IOC type filter
      - name: severity
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Severity
      - name: is_active
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Is Active
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IOCResponse'
                title: Response List Iocs Api V1 Iocs Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - IOCs
      summary: Create IOC
      operationId: create_ioc_api_v1_iocs_post
      security:
      - APIKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IOCCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IOCResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/iocs/{ioc_id}:
    get:
      tags:
      - IOCs
      summary: Get IOC by ID
      operationId: get_ioc_api_v1_iocs__ioc_id__get
      security:
      - APIKeyHeader: []
      parameters:
      - name: ioc_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Ioc Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IOCResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - IOCs
      summary: Update IOC
      operationId: update_ioc_api_v1_iocs__ioc_id__patch
      security:
      - APIKeyHeader: []
      parameters:
      - name: ioc_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Ioc Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IOCUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IOCResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/iocs/lookup/{value}:
    get:
      tags:
      - IOCs
      summary: Lookup IOC by value
      operationId: lookup_ioc_api_v1_iocs_lookup__value__get
      security:
      - APIKeyHeader: []
      parameters:
      - name: value
        in: path
        required: true
        schema:
          type: string
          title: Value
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IOCResponse'
                title: Response Lookup Ioc Api V1 Iocs Lookup  Value  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/threats/actors:
    get:
      tags:
      - Threats
      summary: List threat actors
      operationId: list_threat_actors_api_v1_threats_actors_get
      security:
