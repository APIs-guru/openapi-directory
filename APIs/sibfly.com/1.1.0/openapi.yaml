      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/usage:
    get:
      summary: Api Usage
      description: 'R2: FREE per-key line-item ledger (what each call bought) for
        reconciliation. Bearer or session.'
      operationId: api_usage_api_v1_usage_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/balance:
    get:
      summary: Api Balance
      description: 'Agent self-service: current credit balance + price so an agent
        knows what it can afford

        and where to top up. Free, no charge. Bearer key or logged-in session.'
      operationId: api_balance_api_v1_balance_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/buy:
    post:
      summary: Api Buy
      description: 'Agent-native top-up: Bearer key (or session) + one JSON call ->
        a ready payment URL. No browser,

        no cookies, no HTML. {amount_usd: 1..10000, method: ''stripe''|''crypto''}
        -> stripe: {checkout_url,

        session_id}; crypto: {invoice_url, txn_id}. Credits land automatically after
        payment (webhook /

        callback); poll GET /api/v1/balance to confirm.'
      operationId: api_buy_api_v1_buy_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - amount_usd
              properties:
                amount_usd:
                  type: number
                  minimum: 1
                  maximum: 10000
                method:
                  type: string
                  enum:
                  - stripe
                  - crypto
                  default: stripe
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited (un-keyed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/frames:
    get:
      summary: Frames List
      description: '#4: every live frame with last_observation + age — agents poll
        this to know when to re-pull. Free.'
      operationId: frames_list_api_v1_frames_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/frames/{frame_id}/last_updated:
    get:
      summary: Frame Last Updated
      description: '#4: when a specific frame last got new OPERA data (poll to invalidate
        caches / trigger a re-pull). Free.'
      operationId: frame_last_updated_api_v1_frames__frame_id__last_updated_get
      parameters:
      - name: frame_id
        in: path
        required: true
        schema:
          type: string
          title: Frame Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/coverage/batch:
    post:
      summary: Coverage Batch
      description: '#5a (A+2): FREE batch coverage pre-check — size a job before spending.
        $0, KEYED + rate-limited, max 1000 items.'
      operationId: coverage_batch_api_v1_coverage_batch_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - items
              properties:
                items:
                  type: array
                  maxItems: 5000
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      address:
                        type: string
                      lat:
                        type: number
                      lon:
                        type: number
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
