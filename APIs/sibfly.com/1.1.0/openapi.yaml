  /api/v1/keys:
    get:
      summary: List Child Keys
      operationId: list_child_keys_api_v1_keys_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Mint Child Key
      description: 'R2: mint a scoped, spend-capped, referer-locked, revocable CHILD
        key from your owner key. Safe to embed

        in a public widget — it draws from your credits but can''t exceed daily_cap_usd
        and is locked to allowed_referer.'
      operationId: mint_child_key_api_v1_keys_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: []
              properties:
                daily_cap_usd:
                  type: number
                allowed_referer:
                  type: string
                ttl_hours:
                  type: number
                label:
                  type: string
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/keys/{key}:
    delete:
      summary: Revoke Child Key
      operationId: revoke_child_key_api_v1_keys__key__delete
      parameters:
      - name: key
        in: path
        required: true
        schema:
