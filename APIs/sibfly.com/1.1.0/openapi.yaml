          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/motion:
    get:
      summary: Motion
      operationId: motion_api_v1_motion_get
      parameters:
      - name: address
        in: query
        required: false
        schema:
          type: string
          title: Address
      - name: lat
        in: query
        required: false
        schema:
          type: number
          title: Lat
      - name: lon
        in: query
        required: false
        schema:
          type: number
          title: Lon
      - name: brief
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Brief
      - name: label
        in: query
        required: false
        schema:
          type: string
          title: Label
      - name: teaser
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Teaser
      - name: include
        in: query
        required: false
        schema:
          type: string
          title: Include
      - name: dry_run
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Dry Run
      - name: max_age_days
        in: query
        required: false
        schema:
          type: integer
          title: Max Age Days
      - name: min_confidence
        in: query
        required: false
        schema:
          type: number
          title: Min Confidence
      - name: since
        in: query
        required: false
        schema:
          type: string
          title: Since
      - name: min_geocode_score
        in: query
        required: false
        schema:
          type: number
          title: Min Geocode Score
      - name: min_significance
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Min Significance
      - name: compact
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Compact
      - name: fields
        in: query
        required: false
        schema:
          type: string
          title: Fields
      - name: units
        in: query
        required: false
        schema:
          type: string
          title: Units
      - name: mock
        in: query
        required: false
        schema:
          type: string
          title: Mock
      responses:
        '200':
          description: Per-address ground-motion report; or a free miss/teaser/oracle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotionReport'
              example:
                status: ok
                query:
                  address: 425 Fremont St, Las Vegas, NV
                  geocoded_address: 425 FREMONT ST, LAS VEGAS, NV, 89101
                  lat: 36.1696
                  lon: -115.1416
                velocity_vertical_mm_yr: -3.6
                velocity_vertical_in_yr: -0.1417
                velocity_uncertainty_mm_yr: 2.0
                velocity_uncertainty_in_yr: 0.0787
                seasonal_amplitude_mm: 5
                total_motion_mm: -32
                display_units: in_yr
                trend: subsiding
                assessment: Notable subsidence. The ground is sinking.
                assessment_code: notable_subsidence
                seasonal_dominant: true
                velocity_display: -4 mm/yr (-0.14 in/yr) ±2
                confidence: 1.0
                frame: F46288
                pixel_id: F46288_5198_4811
                n_measurements: 344
                span_years: 9.0
                last_observation: '2025-07-15'
                data_age_days: 351
                data_coverage: ok
                data_freshness: recent
                provenance:
                  calibration: gps_tied
                  calibration_rmse_mm_yr: 2.0
                  sign_convention: negative = subsidence
                  data_source: NASA OPERA DISP-S1 v1
                  disclaimer: Screening estimate — not engineering-grade.
                pixel_polygon:
                - - 36.1696912
                  - -115.1416287
                - - 36.169686
                  - -115.1412953
                - - 36.1694157
                  - -115.1413017
                - - 36.1694209
                  - -115.1416351
                cell_size_m: 30
                queried_at: '2026-07-01T02:00:00Z'
                cost_usd: 0.4
                credits_remaining_usd: 612.4
                reports_remaining: 1531
                request_id: req_9b35d76399
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          description: Out of credits / spend cap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited (un-keyed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/motion/batch:
    post:
      summary: Motion Batch
      description: 'Portfolio/agent batch: one POST, many addresses. Always-200 envelope;
        each item carries its own

        status; ONLY status:ok items are billed (misses, dupes & bad input free).
        Batch Idempotency-Key replays

        for 7d. Max 1000 items. Keyed only. async:true -> 202 {job_id} + poll. since=YYYY-MM-DD
        -> diff-billing.'
      operationId: motion_batch_api_v1_motion_batch_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - items
              properties:
                items:
                  type: array
                  maxItems: 1000
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      address:
                        type: string
                      lat:
                        type: number
                      lon:
                        type: number
                      since:
                        type: string
                since:
                  type: string
                brief:
                  type: boolean
                max_spend_usd:
                  type: number
                async:
                  type: boolean
      responses:
        '200':
          description: Per-item results + summary; only covered rows billed; duplicate
            cells charged once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
              example:
                status: ok
                summary:
                  requested: 2
                  billed: 1
                  succeeded: 2
                  no_coverage: 1
                  invalid: 0
                  total_cost_usd: 0.4
                credits_remaining_usd: 612.0
                request_id: req_abc123
                results:
                - id: a
                  status: ok
                  cost_usd: 0.4
                  velocity_vertical_mm_yr: -3.6
                  assessment_code: notable_subsidence
                  pixel_id: F46288_5198_4811
                - id: b
                  status: no_coverage
                  cost_usd: 0
                  coverage: false
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          description: Out of credits / spend cap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/motion/batch/{job_id}:
    get:
      summary: Batch Job
      description: '#2: poll an async batch job. processing -> {status}; done -> the
        full batch result.'
      operationId: batch_job_api_v1_motion_batch__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
