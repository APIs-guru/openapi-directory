      summary: Map Data
      description: Velocity heatmap crop (base64 PNG + lat/lon bounds) for the map
        view.
      operationId: map_data_api_v1_map_get
      parameters:
      - name: address
        in: query
        required: false
        schema:
          type: string
          title: Address
      - name: lat
        in: query
        required: false
        schema:
          type: number
          title: Lat
      - name: lon
        in: query
        required: false
        schema:
          type: number
          title: Lon
      - name: half_km
        in: query
        required: false
        schema:
          type: number
          default: 4.0
          title: Half Km
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          description: Out of credits / spend cap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited (un-keyed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/timeseries:
    get:
      summary: Timeseries Data
      description: 'Real multi-year cumulative vertical-motion history for an address
        (from the cube).

        A+1: pass reference_date=YYYY-MM-DD & reference_date2=YYYY-MM-DD to also get
        the movement between two dates.

        Same agent contract as /motion: dry_run + max_age_days free gates, Idempotency-Key
        replay, 402 when broke.'
      operationId: timeseries_data_api_v1_timeseries_get
      parameters:
      - name: address
        in: query
        required: false
        schema:
          type: string
          title: Address
      - name: lat
        in: query
        required: false
        schema:
          type: number
          title: Lat
      - name: lon
        in: query
        required: false
        schema:
          type: number
          title: Lon
      - name: reference_date
        in: query
        required: false
        schema:
          type: string
          title: Reference Date
      - name: reference_date2
        in: query
        required: false
        schema:
          type: string
          title: Reference Date2
      - name: dry_run
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Dry Run
      - name: max_age_days
        in: query
        required: false
        schema:
          type: integer
          title: Max Age Days
      - name: max_points
        in: query
        required: false
        schema:
          type: integer
          title: Max Points
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          description: Out of credits / spend cap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited (un-keyed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/autonomous/register:
    post:
      summary: Autonomous Register
      description: 'Agent self-onboarding: ONE JSON call -> new account + API key
        + free starter credits. No human, no captcha.

        Body: {email, password?}. If password omitted, one is generated and returned.
        Rate-limited 20/hr/IP.'
      operationId: autonomous_register_api_v1_autonomous_register_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/schema:
    get:
      summary: Api Schema
      description: 'R2 machine-readable contract: enums, thresholds, status variants,
        conventions, decision-tree (LLMs parse

        this far more reliably than prose). Versioned; enums are append-only, fields
        additive.'
      operationId: api_schema_api_v1_schema_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1:
    get:
      summary: Api Root
      description: Discoverable JSON index of the API (agent-friendly entry point).
      operationId: api_root_api_v1_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/coverage:
    get:
      summary: Coverage Data
      description: 'Free. With NO args: the live frame list. With address= or lat/lon:
        a per-POINT coverage answer

        (A17 — the point form used to ignore lat/lon and always return the full list).'
      operationId: coverage_data_api_v1_coverage_get
      parameters:
      - name: address
        in: query
        required: false
        schema:
          type: string
          title: Address
      - name: lat
        in: query
        required: false
        schema:
          type: number
          title: Lat
      - name: lon
        in: query
        required: false
        schema:
          type: number
          title: Lon
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/support:
    get:
      summary: Api Support List
      operationId: api_support_list_api_v1_support_get
      responses:
