          title: Address
      - name: lat
        in: query
        required: false
        schema:
          type: number
          title: Lat
      - name: lon
        in: query
        required: false
        schema:
          type: number
          title: Lon
      - name: brief
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Brief
      - name: label
        in: query
        required: false
        schema:
          type: string
          title: Label
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
