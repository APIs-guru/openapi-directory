          type: string
          title: Tid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    Error:
      type: object
      properties:
        error:
          type: string
          description: stable machine code
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
        doc_url:
          type: string
        request_id:
          type: string
    MotionReport:
      type: object
      additionalProperties: true
      properties:
        status:
          type: string
          enum:
          - ok
          - no_data
          - no_coverage
          - stale_data
          - low_confidence
          - low_geocode_precision
          - no_new_data
        velocity_vertical_mm_yr:
          type:
          - number
          - 'null'
        velocity_vertical_in_yr:
          type:
          - number
          - 'null'
        velocity_uncertainty_mm_yr:
          type:
          - number
          - 'null'
        velocity_uncertainty_in_yr:
          type:
          - number
          - 'null'
        velocity_los_mm_yr:
          type:
          - number
          - 'null'
        seasonal_amplitude_mm:
          type:
          - number
          - 'null'
        seasonal_dominant:
          type: boolean
        total_motion_mm:
          type:
          - number
          - 'null'
        total_motion_in:
          type:
          - number
          - 'null'
        display_units:
          type: string
        velocity_display:
          type: string
        trend:
          type: string
          enum:
          - subsiding
          - stable
          - uplifting
        assessment:
          type: string
        assessment_code:
          type: string
          enum:
          - rapid_subsidence
          - notable_subsidence
          - stable
          - mild_uplift
          - strong_uplift
          - no_clear_trend
        confidence:
          type:
          - number
          - 'null'
        near_threshold:
          type: boolean
        significant_nonzero:
          type: boolean
        neighbor_consistent:
          type:
          - boolean
          - 'null'
        neighbor_spread_mm_yr:
          type:
          - number
          - 'null'
        frame:
          type: string
        pixel_id:
          type: string
        pixel_polygon:
          type: array
          items:
            type: array
            items:
              type: number
        pixel_geojson:
          type: object
        cell_size_m:
          type:
          - number
          - 'null'
        n_measurements:
          type:
          - number
          - 'null'
        span_years:
          type:
          - number
          - 'null'
        last_observation:
          type: string
        data_age_days:
          type:
          - integer
          - 'null'
        data_freshness:
          type: string
          enum:
          - current
          - recent
          - stale
          - very_stale
          - unknown
        estimated_next_acquisition:
          type:
          - string
          - 'null'
        data_coverage:
          type: string
        provenance:
          type: object
          properties:
            calibration:
              type: string
              enum:
              - gps_tied
              - relative
            calibration_rmse_mm_yr:
              type:
              - number
              - 'null'
            sign_convention:
              type: string
            science_version:
              type: string
            attribution:
              type: string
            license:
              type: string
            disclaimer:
              type: string
        query:
          type: object
          properties:
            address:
              type:
              - string
              - 'null'
            geocoded_address:
              type:
              - string
              - 'null'
            geocode:
              type: object
              properties:
                match_type:
                  type: string
                score:
                  type: number
            lat:
              type: number
            lon:
              type: number
        queried_at:
          type: string
        cost_usd:
          type: number
        billed_usd:
          type:
          - number
          - 'null'
        credits_remaining_usd:
          type:
          - number
          - 'null'
        reports_remaining:
          type:
          - integer
          - 'null'
        request_id:
          type: string
        trend_analysis:
          type: object
        timeseries:
          type: object
        ground_brief:
          type: string
    BatchResponse:
      type: object
      additionalProperties: true
      properties:
        status:
          type: string
        summary:
          type: object
        results:
          type: array
          items:
            type: object
        failed:
          type: array
          items:
            type: object
        credits_remaining_usd:
          type:
          - number
          - 'null'
        request_id:
          type: string
    Balance:
      type: object
      properties:
        credits_usd:
          type: number
        price_per_report_usd:
          type: number
        reports_remaining_est:
          type: integer
        top_up_url:
          type: string
        request_id:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: SibFly API key (sf_live_... or scoped sf_child_...)
servers:
- url: https://sibfly.com
security:
- bearerAuth: []
