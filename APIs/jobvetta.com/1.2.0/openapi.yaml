openapi: 3.0.2
info:
  title: Jobvetta Jobs
  version: 1.2.0
  description: Search 6.5M+ live job postings from 238,000+ official employer career pages across 242 countries in ~0.4s (cached
    queries in <80ms). Every structured field is grounded in the employer's original posting  -  unstated fields remain null
    rather than guessed. Re-verified daily (78.8% checked in <24h, 92.0% in <7d; 99.0% structured-field accuracy in a 500-posting
    audit).
  contact:
    name: Jobvetta API
    email: sales@jobvetta.com
    url: https://www.jobvetta.com/docs
  x-logo:
    url: https://www.jobvetta.com/icon-192.png
    altText: Jobvetta logo
  termsOfService: https://www.jobvetta.com/terms
  x-providerName: jobvetta.com
  x-apisguru-categories:
  - open_data
  - developer_tools
  x-origin:
  - format: openapi
    url: https://www.jobvetta.com/openapi.json
    version: '3.0'
externalDocs:
  description: Jobvetta API Reference & Empirical Benchmarks
  url: https://www.jobvetta.com/api
servers:
- url: https://api.jobvetta.com/v1
security:
- JobvettaBearer: []
paths:
  /usage:
    get:
      operationId: getKeyUsage
      summary: Check API key quota and remaining daily requests (free)
      description: Returns the authenticated key's current UTC daily quota and remaining calls without consuming any quota.
      responses:
        '200':
          description: Current key allowance and daily usage.
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                - plan
                - daily_limit
                - used_today
                - remaining_today
                - day_utc
                properties:
                  ok:
                    type: boolean
                    example: true
                  plan:
                    type: string
                    enum:
                    - free
                    - paid
                    example: free
                  daily_limit:
                    type: integer
                    example: 25
                  used_today:
                    type: integer
                    example: 3
                  remaining_today:
                    type: integer
                    example: 22
                  day_utc:
                    type: string
                    example: '2026-11-27'
        '401':
          description: Invalid or missing API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /jobs:
    get:
      operationId: searchJobs
      summary: Search live employer job postings worldwide
      description: Returns deduplicated, active employer job openings matching keyword, city/state/country, and posting age.
        Pre-filled with working defaults so 1-click playground tests succeed immediately.
      parameters:
      - name: q
        in: query
        schema:
          type: string
          default: data engineer
        example: data engineer
        description: Role, skill, technology, or employer keyword (supports Unicode, e.g. 'data engineer', 'registered nurse',
          'エンジニア').
      - name: location
        in: query
        schema:
          type: string
          default: New York
        example: New York
        description: City, state/province, or country (e.g. 'New York', 'London', 'United States', 'Canada', 'Bengaluru').
      - name: days
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 365
          default: 7
        example: 7
        description: Restrict to jobs first published within the last N days (1-365). Use 1 for daily alerts.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
        example: 25
        description: Results per page (1-25 on BASIC free tier; up to 100 on PRO/ULTRA/MEGA plans).
      - name: offset
        in: query
        description: Number of results to skip (0-100 on BASIC free tier; 0-9,999 on PRO/ULTRA/MEGA plans).
        schema:
          type: integer
          minimum: 0
          maximum: 9999
          default: 0
        example: 0
      responses:
        '200':
          description: Matching active employer job summaries.
          content:
            application/json:
              schema:
                type: object
                required:
                - total
                - jobs
                properties:
                  total:
                    type: integer
                    minimum: 0
                    example: 412
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/JobSummary'
              example:
                total: 412
                jobs:
                - job_id: 6abebf061838202552cae216_loc0
                  title: Senior Data Engineer
                  company: Datadog
                  location: New York, New York, United States
                  work_model: Hybrid
                  employment_type: Full-time
                  salary: $165,000-$210,000 / year
                  url: https://www.jobvetta.com/jobs/6abebf061838202552cae216_loc0
        '400':
          description: Invalid query parameter (e.g. offset out of plan bounds).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid or missing API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Plan rate limit reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /jobs/{job_id}:
    get:
      operationId: getJob
      summary: Retrieve full 70+ field structured job details by ID
      description: Pass any `job_id` returned by `/jobs`  -  or pass `latest` in the playground to inspect a live posting
        immediately. Paid plans (PRO, ULTRA, MEGA) also receive the employer's direct `apply_url`.
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          default: latest
        example: latest
        description: A `job_id` from `GET /jobs`, or `'latest'` to fetch a live sample job.
      responses:
        '200':
          description: Complete structured job record.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  job_id:
                    type: string
                  title:
                    type: string
                  normalized_title:
                    type: string
                  company:
                    type: string
                  location:
                    type: string
                  work_model:
                    type: string
                  employment_type:
                    type: string
                  experience_level:
                    type: string
                  education_level:
                    type: string
                    nullable: true
                  description:
                    type: string
                  responsibilities:
                    type: array
                    items:
                      type: string
                  minimum_qualifications:
                    type: array
                    items:
                      type: string
                  preferred_qualifications:
                    type: array
                    items:
                      type: string
                  skills_required:
                    type: array
                    items:
                      type: string
                  benefits:
                    type: array
                    items:
                      type: string
                  salary_min:
                    type: number
                    nullable: true
                  salary_max:
                    type: number
                    nullable: true
                  salary_currency:
                    type: string
                    nullable: true
                  salary_rate_unit:
                    type: string
                    nullable: true
                  created_at:
                    type: integer
                  last_seen_date:
                    type: integer
                  apply_url:
                    type: string
                    format: uri
                    description: Official employer career/ATS URL (included on paid PRO/ULTRA/MEGA plans).
                  url:
                    type: string
                    format: uri
              example:
                job_id: 6abebf061838202552cae216_loc0
                title: Software Engineer, Engineering Acceleration
                normalized_title: Software Engineer, Engineering Acceleration
                company: Omnea
                location: London, United Kingdom
                work_model: Hybrid
                employment_type: Full-time
                description: We're looking for software engineers to join Engineering Acceleration...
                responsibilities:
                - Build systems for AI-native software engineering
                - Improve development and testing environments
                minimum_qualifications:
                - Strong software engineering fundamentals
                - Practical AWS serverless experience
                skills_required:
                - AWS
                - Serverless
                - CI/CD
                - Developer Tooling
                salary_min: null
                salary_max: null
                salary_currency: null
                created_at: 1790885593
                last_seen_date: 1795354879
                url: https://www.jobvetta.com/jobs/6abebf061838202552cae216_loc0
        '404':
          description: Job not found or closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Plan rate limit reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /jobs/salary-estimate:
    get:
      operationId: estimateJobSalary
      summary: Estimate annualized p25, median, and p75 salary by role & location
      description: Computes empirical 10th, 25th, 50th (median), 75th, and 90th percentile annualized compensation from verified
        active employer postings disclosing pay.
      parameters:
      - name: q
        in: query
        schema:
          type: string
          default: software engineer
        example: software engineer
        description: Job title or skill keyword (e.g. 'software engineer', 'data scientist', 'registered nurse').
      - name: location
        in: query
        schema:
          type: string
          default: United States
        example: United States
        description: City, state, or country (e.g. 'New York', 'San Jose', 'United States', 'London').
      - name: days
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 365
          default: 30
        example: 30
        description: Lookback window in days (1-365).
      responses:
        '200':
          description: Annualized compensation percentiles grounded in active employer postings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  query:
                    type: string
                    nullable: true
                  location:
                    type: string
                    nullable: true
                  total_matching_jobs:
                    type: integer
                  sampled_jobs:
                    type: integer
                  disclosed_salary_count:
                    type: integer
                  currency:
                    type: string
                    nullable: true
                  period:
                    type: string
                  salary_min:
                    type: integer
                    nullable: true
                  salary_p25:
                    type: integer
                    nullable: true
                  salary_median:
                    type: integer
                    nullable: true
                  salary_p75:
                    type: integer
                    nullable: true
                  salary_max:
                    type: integer
                    nullable: true
        '429':
          description: Plan rate limit reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /jobs/remote:
    get:
      operationId: searchRemoteJobs
      summary: Search verified remote job postings worldwide
      description: Returns active employer job openings explicitly marked remote by the hiring organization.
      parameters:
      - name: q
        in: query
        schema:
          type: string
          default: python
        example: python
        description: Role, skill, or technology keyword.
      - name: location
        in: query
        schema:
          type: string
          default: United States
        example: United States
        description: Country or region eligibility filter (e.g. 'United States', 'Canada', 'United Kingdom').
      - name: days
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 365
          default: 7
        example: 7
        description: Restrict to jobs first published within the last N days (1-365). Use 1 for daily alerts.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
        example: 25
        description: Results per page (1-25 on BASIC free tier; up to 100 on PRO/ULTRA/MEGA plans).
      - name: offset
        in: query
        description: Number of results to skip (0-100 on BASIC free tier; 0-9,999 on PRO/ULTRA/MEGA plans).
        schema:
          type: integer
          minimum: 0
          maximum: 9999
          default: 0
        example: 0
      responses:
        '200':
          description: Matching active employer job summaries.
          content:
            application/json:
              schema:
                type: object
                required:
                - total
                - jobs
                properties:
                  total:
                    type: integer
                    minimum: 0
                    example: 412
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/JobSummary'
              example:
                total: 412
                jobs:
                - job_id: 6abebf061838202552cae216_loc0
                  title: Senior Data Engineer
                  company: Datadog
                  location: New York, New York, United States
                  work_model: Hybrid
                  employment_type: Full-time
                  salary: $165,000-$210,000 / year
                  url: https://www.jobvetta.com/jobs/6abebf061838202552cae216_loc0
        '400':
          description: Invalid query parameter (e.g. offset out of plan bounds).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid or missing API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Plan rate limit reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /companies/{company}/jobs:
    get:
      operationId: getCompanyJobs
      summary: List active job openings at a specific employer
      description: Returns open roles directly from a company's official career portal  -  ideal for B2B sales intelligence,
        recruiting workflows, and account enrichment.
      parameters:
      - name: company
        in: path
        required: true
        schema:
          type: string
          default: Cisco Systems
        example: Cisco Systems
        description: Hiring company name (e.g. 'Cisco Systems', 'Oracle', 'Datadog').
      - name: q
        in: query
        schema:
          type: string
        description: Optional role or keyword filter within that company.
      - name: location
        in: query
        schema:
          type: string
        description: Optional city, state, or country filter.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
        example: 25
        description: Results per page (1-25 on BASIC free tier; up to 100 on PRO/ULTRA/MEGA plans).
      - name: offset
        in: query
        description: Number of results to skip (0-100 on BASIC free tier; 0-9,999 on PRO/ULTRA/MEGA plans).
        schema:
          type: integer
          minimum: 0
          maximum: 9999
          default: 0
        example: 0
      responses:
        '200':
          description: Matching active employer job summaries.
          content:
            application/json:
              schema:
                type: object
                required:
                - total
                - jobs
                properties:
                  total:
                    type: integer
                    minimum: 0
                    example: 412
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/JobSummary'
              example:
                total: 412
                jobs:
                - job_id: 6abebf061838202552cae216_loc0
                  title: Senior Data Engineer
                  company: Datadog
                  location: New York, New York, United States
                  work_model: Hybrid
                  employment_type: Full-time
                  salary: $165,000-$210,000 / year
                  url: https://www.jobvetta.com/jobs/6abebf061838202552cae216_loc0
        '400':
          description: Invalid query parameter (e.g. offset out of plan bounds).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid or missing API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Plan rate limit reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /jobs/recent:
    get:
      operationId: getRecentJobs24h
      summary: Fetch fresh employer job postings published in the last 24 hours
      description: Returns openings first published within the past 24 hours  -  built for daily job alerts, n8n/Make automations,
        and real-time hiring signals.
      parameters:
      - name: q
        in: query
        schema:
          type: string
          default: data engineer
        example: data engineer
        description: Role, skill, or keyword filter.
      - name: location
        in: query
        schema:
          type: string
          default: United States
        example: United States
        description: City, state, or country filter.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
        example: 25
        description: Results per page (1-25 on BASIC free tier; up to 100 on PRO/ULTRA/MEGA plans).
      - name: offset
        in: query
        description: Number of results to skip (0-100 on BASIC free tier; 0-9,999 on PRO/ULTRA/MEGA plans).
        schema:
          type: integer
          minimum: 0
          maximum: 9999
          default: 0
        example: 0
      responses:
        '200':
          description: Matching active employer job summaries.
          content:
            application/json:
              schema:
                type: object
                required:
                - total
                - jobs
                properties:
                  total:
                    type: integer
                    minimum: 0
                    example: 412
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/JobSummary'
              example:
                total: 412
                jobs:
                - job_id: 6abebf061838202552cae216_loc0
                  title: Senior Data Engineer
                  company: Datadog
                  location: New York, New York, United States
                  work_model: Hybrid
                  employment_type: Full-time
                  salary: $165,000-$210,000 / year
                  url: https://www.jobvetta.com/jobs/6abebf061838202552cae216_loc0
        '400':
          description: Invalid query parameter (e.g. offset out of plan bounds).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid or missing API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Plan rate limit reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    JobvettaBearer:
      type: http
      scheme: bearer
      description: Managed automatically by RapidAPI (or pass a Jobvetta Bearer key when calling api.jobvetta.com directly).
  schemas:
    JobSummary:
      type: object
      required:
      - job_id
      - url
      properties:
        job_id:
          type: string
        title:
          type: string
        company:
          type: string
        location:
          type: string
        work_model:
          type: string
        employment_type:
          type: string
        salary:
          type: string
          nullable: true
        url:
          type: string
          format: uri
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: string
