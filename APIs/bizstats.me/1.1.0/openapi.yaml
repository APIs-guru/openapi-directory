openapi: 3.1.0
info:
  title: BizStats Montenegro Business Data API
  version: 1.1.0
  description: 'Versioned read API for Montenegro company, registry, procurement, public-payment and economic data. Every
    dataset is documented in /v1/datasets/catalog with its source, cadence, methodology and limitations. No key is needed.
    Responses are JSON (CSV where noted), cached for 5 minutes (Cache-Control) and served with CORS for any origin; please
    keep automated use to about one request per second. The contract covers the operations listed here: documented fields
    keep their name and type within v1, new fields may be added. Other paths under /v1 are not part of the contract and may
    change. Deprecated: netPayCosts (an alias of grossPayCosts; the value is gross pay costs).'
  contact:
    name: BizStats.me
    email: hello@bizstats.me
    url: https://bizstats.me/en/api/
  license:
    name: BizStats data license
    url: https://bizstats.me/data-license/
  termsOfService: https://bizstats.me/terms/
  x-apisguru-categories:
  - open_data
  - financial
  x-logo:
    url: https://bizstats.me/icon.svg
    backgroundColor: '#FFFFFF'
  x-origin:
  - format: openapi
    url: https://api.bizstats.me/v1/openapi.json
    version: '3.1'
  x-providerName: bizstats.me
servers:
- url: https://api.bizstats.me
  description: Production
tags:
- name: Catalog
  description: Datasets, provenance and freshness
- name: Companies
  description: Filings, aggregates and people
- name: Changes
  description: Change feed and risk lists
- name: Procurement
  description: CEJN notices, buyers and suppliers
- name: Government
  description: Treasury, projects and indicators
paths:
  /v1:
    get:
      tags:
      - Catalog
      operationId: getApiIndex
      summary: API entry point
      parameters: []
      responses:
        '200':
          description: Links to the docs and catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiIndexResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-bizstats-example: /v1
  /v1/datasets/catalog:
    get:
      tags:
      - Catalog
      operationId: listDatasets
      summary: List public BizStats datasets
      description: Source, cadence, coverage, methodology, limitations and endpoints for every dataset.
      parameters: []
      responses:
        '200':
          description: Dataset catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetCatalogResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-bizstats-example: /v1/datasets/catalog
  /v1/datasets/catalog/{id}:
    get:
      tags:
      - Catalog
      operationId: getDataset
      summary: Describe one public dataset
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          enum:
          - companies
          - company-registry
          - company-ownership
          - persons
          - procurement-notices
          - procurement-awards
          - public-payments
          - blocked-accounts
          - tax-debtors
          - economic-indicators
          - municipality-statistics
          - development-projects
          - court-hearings
          - court-decisions
          - property-ownership
      responses:
        '200':
          description: Dataset definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetResponse'
        '404':
          description: Unknown dataset id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-bizstats-example: /v1/datasets/catalog/companies
  /v1/datasets/status:
    get:
      tags:
      - Catalog
      operationId: getDatasetStatus
      summary: Source freshness and ingestion status
      description: 'For each source: when BizStats last fetched it, the newest date its records cover, and a freshness tier.'
      parameters: []
      responses:
        '200':
          description: Dataset freshness
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetStatusResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-bizstats-example: /v1/datasets/status
  /v1/companies:
    get:
      tags:
      - Companies
      operationId: listCompanies
      summary: List, filter and rank companies for a filing year
      parameters:
      - name: year
        in: query
        required: false
        description: Filing year; defaults to the latest year with filings (unknown years fall back to it)
        example: '2025'
        schema:
          type: string
          pattern: ^[0-9]{4}$
      - name: sort
        in: query
        required: false
        description: margin ranks companies with at least 100,000 EUR revenue first; revenueChange (vs year − 1) ranks bases
          of at least 1M EUR revenue and 5 employees first. Rows without a value sort last.
        schema:
          default: totalIncome
          type: string
          enum:
          - name
          - totalIncome
          - profit
          - employeeCount
          - averagePay
          - incomePerEmployee
          - margin
          - revenueChange
      - name: dir
        in: query
        required: false
        schema:
          default: desc
          type: string
          enum:
          - asc
          - desc
      - name: q
        in: query
        required: false
        description: Substring of name, PIB, activity or municipality
        schema:
          type: string
      - name: sector
        in: query
        required: false
        description: Exact sector name
        schema:
          type: string
      - name: municipality
        in: query
        required: false
        schema:
          type: string
      - name: category
        in: query
        required: false
        description: Activity title
        schema:
          type: string
      - name: activityCode
        in: query
        required: false
        description: KD 2010 code
        schema:
          type: string
      - name: minRevenue
        in: query
        required: false
        schema:
          type: number
          minimum: 0
      - name: maxRevenue
        in: query
        required: false
        schema:
          type: number
          minimum: 0
      - name: minEmployees
        in: query
        required: false
        schema:
          type: number
          minimum: 0
      - name: maxEmployees
        in: query
        required: false
        schema:
          type: number
          minimum: 0
      - name: plausibleProfit
        in: query
        required: false
        description: 1 = exclude filings with an implausible profit
        schema:
          type: string
          enum:
          - '1'
      - name: page
        in: query
        required: false
        description: 1-based page; past the last page serves the last
        schema:
          default: 1
          type: integer
          minimum: 1
      - name: pageSize
        in: query
        required: false
        description: Rows per page (max 200; larger values are capped)
        schema:
          default: 50
          type: integer
          minimum: 1
          maximum: 200
      responses:
        '200':
          description: One page of companies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyListResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-bizstats-example: /v1/companies?year=2025&sort=totalIncome&pageSize=5
  /v1/companies/{pib}:
    get:
      tags:
      - Companies
      operationId: getCompany
      summary: A company's filing history and linked public records
      description: Returns a JSON array with one row per filing year, oldest first. The last (latest-year) row also carries
        identity, ownership, risk, procurement, payment, court and property records.
      parameters:
      - name: pib
        in: path
        required: true
        description: 8-digit tax identification number (PIB)
        schema:
          type: string
          pattern: ^[0-9]{8}$
      - name: includeEnrichment
        in: query
        required: false
        description: 0 = filing rows only, without the linked public records
        schema:
          default: '1'
          type: string
          enum:
          - '0'
          - '1'
      responses:
        '200':
          description: Filing years
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyHistoryResponse'
        '404':
          description: No filings for this PIB (or not an 8-digit PIB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-bizstats-example: /v1/companies/02002230
  /v1/companies/{pib}/export.csv:
    get:
      tags:
      - Companies
      operationId: exportCompanyCsv
      summary: A company's filing history as CSV
      parameters:
      - name: pib
        in: path
        required: true
        description: 8-digit tax identification number (PIB)
        schema:
          type: string
          pattern: ^[0-9]{8}$
      responses:
        '200':
          description: 'CSV (UTF-8 with BOM): PIB, Company, Year, Sector, Category, Municipality, Total Income, Profit, Employees,
            Avg Gross Pay, Income/Employee, Parse Status, Profit Margin %, Activity Code'
          content:
            text/csv:
              schema:
                type: string
        '404':
          description: No filings for this PIB (or not an 8-digit PIB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-bizstats-example: /v1/companies/02002230/export.csv
  /v1/export.csv:
    get:
      tags:
      - Companies
      operationId: exportCompaniesCsv
      summary: The first 100 companies matching the filters as CSV
      description: 'Same filters as /v1/companies, no paging. A free preview: the first 100 rows in the requested order (X-Export-Row-Count,
        X-Export-Row-Limit, and X-Export-Truncated: true when more companies match). Full lists with website, email and phone
        columns are part of BizStats Business.'
      parameters:
      - name: year
        in: query
        required: false
        description: Filing year; defaults to the latest year with filings (unknown years fall back to it)
        example: '2025'
        schema:
          type: string
          pattern: ^[0-9]{4}$
      - name: sort
        in: query
        required: false
        description: margin ranks companies with at least 100,000 EUR revenue first; revenueChange (vs year − 1) ranks bases
          of at least 1M EUR revenue and 5 employees first. Rows without a value sort last.
        schema:
          default: totalIncome
          type: string
          enum:
          - name
          - totalIncome
          - profit
          - employeeCount
          - averagePay
          - incomePerEmployee
          - margin
          - revenueChange
      - name: dir
        in: query
        required: false
        schema:
          default: desc
          type: string
          enum:
          - asc
          - desc
      - name: q
        in: query
        required: false
        description: Substring of name, PIB, activity or municipality
        schema:
          type: string
      - name: sector
        in: query
        required: false
        description: Exact sector name
        schema:
          type: string
      - name: municipality
        in: query
        required: false
        schema:
          type: string
      - name: category
        in: query
        required: false
        description: Activity title
        schema:
          type: string
      - name: activityCode
        in: query
        required: false
        description: KD 2010 code
        schema:
          type: string
      - name: minRevenue
        in: query
        required: false
        schema:
          type: number
          minimum: 0
      - name: maxRevenue
        in: query
        required: false
        schema:
          type: number
          minimum: 0
      - name: minEmployees
        in: query
        required: false
        schema:
          type: number
          minimum: 0
      - name: maxEmployees
        in: query
        required: false
        schema:
          type: number
          minimum: 0
      - name: plausibleProfit
        in: query
        required: false
        description: 1 = exclude filings with an implausible profit
        schema:
          type: string
          enum:
          - '1'
      responses:
        '200':
          description: 'CSV (UTF-8 with BOM): PIB, Company, Year, Sector, Category, Municipality, Total Income, Profit, Employees,
            Avg Gross Pay, Income/Employee, Parse Status, Profit Margin %, Activity Code'
          content:
            text/csv:
              schema:
                type: string
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-bizstats-example: /v1/export.csv?year=2025&sector=Construction
  /v1/search:
    get:
      tags:
      - Companies
      operationId: searchCompanies
      summary: Search companies by name, PIB, activity or owner
      parameters:
      - name: q
        in: query
        required: true
        example: telekom
        schema:
          type: string
          minLength: 2
          maxLength: 100
      - name: mode
        in: query
        required: false
        schema:
          default: typeahead
          type: string
          enum:
          - typeahead
          - full
      - name: limit
        in: query
        required: false
        description: Default 8 (typeahead) or 40 (full); max 50
        schema:
          type: integer
          minimum: 1
          maximum: 50
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-bizstats-example: /v1/search?q=telekom
  /v1/regions:
    get:
      tags:
      - Companies
      operationId: listRegions
      summary: Company aggregates by municipality
      parameters:
      - name: year
        in: query
        required: false
        description: Filing year; defaults to the latest year with filings (unknown years fall back to it)
        example: '2025'
        schema:
          type: string
          pattern: ^[0-9]{4}$
      responses:
        '200':
          description: Municipality aggregates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionsResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-bizstats-example: /v1/regions?year=2025
  /v1/sectors:
    get:
      tags:
      - Companies
      operationId: listSectors
      summary: Company aggregates by sector
      parameters:
      - name: year
        in: query
        required: false
        description: Filing year; defaults to the latest year with filings (unknown years fall back to it)
        example: '2025'
        schema:
          type: string
          pattern: ^[0-9]{4}$
      responses:
        '200':
          description: Sector aggregates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectorsResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-bizstats-example: /v1/sectors?year=2025
  /v1/movers:
    get:
      tags:
      - Companies
      operationId: listMovers
      summary: Largest year-over-year changes
      parameters:
      - name: metric
        in: query
        required: false
        schema:
          default: revenue
          type: string
          enum:
          - revenue
          - profit
          - employees
          - pay
      - name: limit
        in: query
        required: false
        schema:
          default: 12
          type: integer
          minimum: 1
          maximum: 50
      - name: year
        in: query
        required: false
        description: Filing year; defaults to the latest year with filings (unknown years fall back to it)
        example: '2025'
        schema:
          type: string
          pattern: ^[0-9]{4}$
      - name: sector
        in: query
        required: false
        schema:
          type: string
      - name: municipality
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Gainers and losers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoversResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-bizstats-example: /v1/movers?metric=revenue&limit=10
  /v1/persons/{slug}:
    get:
      tags:
      - Companies
      operationId: getPerson
      summary: Public registry roles grouped under one name
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          maxLength: 200
          pattern: ^[a-z0-9-]+$
      responses:
        '200':
          description: Roles and aggregates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonResponse'
        '404':
          description: Unknown slug
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-bizstats-example: /v1/persons/4gte-s-r-o-pib-03060438
  /v1/changes:
    get:
      tags:
      - Changes
      operationId: listChanges
      summary: Detected blockades, tax-debtor listings and tender wins
      description: Same-day contracts of one supplier on one tender are one row (contractCount). Rows are ordered by detection
        day, then event date and amount, unless sort says otherwise.
      parameters:
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - blockade_started
          - blockade_cleared
          - tax_debtor_listed
          - tender_won
          - registry_notice
      - name: pib
        in: query
        required: false
        description: 8-digit tax identification number (PIB)
        schema:
          type: string
          pattern: ^[0-9]{8}$
      - name: buyer
        in: query
        required: false
        description: Substring of the tender buyer (tender wins only)
        schema:
          type: string
          maxLength: 120
      - name: municipality
        in: query
        required: false
        description: Company municipality (latest filing)
        schema:
          type: string
          maxLength: 120
      - name: sector
        in: query
        required: false
        schema:
          type: string
          maxLength: 120
      - name: minAmount
        in: query
        required: false
        schema:
          type: number
          minimum: 0
      - name: sort
        in: query
        required: false
        schema:
          default: recent
          type: string
          enum:
          - recent
          - eventDate
          - amount
      - name: page
        in: query
        required: false
        description: 1-based page; past the last page serves the last
        schema:
          default: 1
          type: integer
          minimum: 1
      - name: pageSize
        in: query
        required: false
        description: Rows per page (max 100; larger values are capped)
        schema:
          default: 50
          type: integer
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: Change events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangesResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-bizstats-example: /v1/changes?type=tender_won&sort=amount&pageSize=10
  /v1/changes/export.csv:
    get:
      tags:
      - Changes
      operationId: exportChangesCsv
      summary: The filtered change feed as CSV
      parameters:
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - blockade_started
          - blockade_cleared
          - tax_debtor_listed
          - tender_won
          - registry_notice
      - name: pib
        in: query
        required: false
        description: 8-digit tax identification number (PIB)
        schema:
          type: string
          pattern: ^[0-9]{8}$
      - name: buyer
        in: query
        required: false
        description: Substring of the tender buyer (tender wins only)
        schema:
          type: string
          maxLength: 120
      - name: municipality
        in: query
        required: false
        description: Company municipality (latest filing)
        schema:
          type: string
          maxLength: 120
      - name: sector
        in: query
        required: false
        schema:
          type: string
          maxLength: 120
      - name: minAmount
        in: query
        required: false
        schema:
          type: number
          minimum: 0
      - name: sort
        in: query
        required: false
        schema:
          default: recent
          type: string
          enum:
          - recent
          - eventDate
          - amount
      responses:
        '200':
          description: 'CSV (UTF-8 with BOM), up to 5,000 rows: detected_at, event_date, event_type, pib, company_name, has_company_page,
            municipality, sector, amount_eur, amount_incomplete, contract_count, contract_ids, buyer_name, procurement_id,
            tender_title, supplier_as_recorded, consortium_size, tax_list_categories, days_blocked, source_lag_days'
          content:
            text/csv:
              schema:
                type: string
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Change log not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-bizstats-example: /v1/changes/export.csv?type=blockade_started
  /v1/blocked-accounts:
    get:
      tags:
      - Changes
      operationId: listBlockedAccounts
      summary: Companies with a blocked account (CBCG snapshot)
      parameters:
      - name: snapshotDate
        in: query
        required: false
        description: CBCG snapshot (YYYY-MM-DD); default the latest
        schema:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
      - name: pib
        in: query
        required: false
        description: 8-digit tax identification number (PIB)
        schema:
          type: string
          pattern: ^[0-9]{8}$
      - name: q
        in: query
        required: false
        description: Name substring
        schema:
          type: string
          maxLength: 120
      - name: minAmount
        in: query
        required: false
        schema:
          type: number
          minimum: 0
      - name: sort
        in: query
        required: false
        schema:
          default: amount
          type: string
          enum:
          - amount
          - days
          - name
      - name: dir
        in: query
        required: false
        description: Default desc (asc for name)
        schema:
          type: string
          enum:
          - asc
          - desc
      - name: page
        in: query
        required: false
        description: 1-based page; past the last page serves the last
        schema:
          default: 1
          type: integer
          minimum: 1
      - name: pageSize
        in: query
        required: false
        description: Rows per page (max 200; larger values are capped)
        schema:
          default: 50
          type: integer
          minimum: 1
          maximum: 200
      responses:
        '200':
          description: Blocked accounts in one snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockedAccountsResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-bizstats-example: /v1/blocked-accounts?pageSize=20
  /v1/tax-debtors:
    get:
      tags:
      - Changes
      operationId: listTaxDebtors
      summary: Entries of the published tax-debtor lists
      parameters:
      - name: list
        in: query
        required: false
        description: Published list; legacy 2024 names (tax_debt_black_list_200, …) are accepted
        schema:
          type: string
          enum:
          - top_200
          - bankruptcy_100
          - salary_taxes_50
          - tax_white_list
      - name: snapshotDate
        in: query
        required: false
        description: Edition date; default each list's latest edition
        schema:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
      - name: pib
        in: query
        required: false
        description: 8-digit tax identification number (PIB)
        schema:
          type: string
          pattern: ^[0-9]{8}$
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 120
      - name: minAmount
        in: query
        required: false
        schema:
          type: number
          minimum: 0
      - name: sort
        in: query
        required: false
        schema:
          default: amount
          type: string
          enum:
          - amount
          - name
      - name: dir
        in: query
        required: false
