components:
  schemas:
    AddMonitorRequest:
      properties:
        name:
          type: string
          title: Name
        url:
          type: string
          title: Url
        interval_seconds:
          type: integer
          title: Interval Seconds
          default: 300
      type: object
      required:
      - name
      - url
      title: AddMonitorRequest
    ApiKeyRequest:
      properties:
        email:
          type: string
          title: Email
      type: object
      required:
      - email
      title: ApiKeyRequest
    Base64Request:
      properties:
        data:
          type: string
          title: Data
        action:
          type: string
          title: Action
          default: encode
      type: object
      required:
      - data
      title: Base64Request
    Body_pdf_compress_pdf_compress_post:
      properties:
        files:
          items:
            type: string
            contentMediaType: application/octet-stream
          type: array
          title: Files
      type: object
      required:
      - files
      title: Body_pdf_compress_pdf_compress_post
    Body_pdf_info_pdf_info_post:
      properties:
        files:
          items:
            type: string
            contentMediaType: application/octet-stream
          type: array
          title: Files
      type: object
      required:
      - files
      title: Body_pdf_info_pdf_info_post
    Body_pdf_merge_pdf_merge_post:
      properties:
        files:
          items:
            type: string
            contentMediaType: application/octet-stream
          type: array
          title: Files
      type: object
      required:
      - files
      title: Body_pdf_merge_pdf_merge_post
    Body_pdf_protect_pdf_protect_post:
      properties:
        files:
          items:
            type: string
            contentMediaType: application/octet-stream
          type: array
          title: Files
        password:
          type: string
          title: Password
      type: object
      required:
      - files
      - password
      title: Body_pdf_protect_pdf_protect_post
    Body_pdf_rotate_pdf_rotate_post:
      properties:
        files:
          items:
            type: string
            contentMediaType: application/octet-stream
          type: array
          title: Files
        angle:
          type: integer
          title: Angle
          default: 90
      type: object
      required:
      - files
      title: Body_pdf_rotate_pdf_rotate_post
    Body_pdf_split_pdf_split_post:
      properties:
        files:
          items:
            type: string
            contentMediaType: application/octet-stream
          type: array
          title: Files
        pages:
          type: string
          title: Pages
      type: object
      required:
      - files
      - pages
      title: Body_pdf_split_pdf_split_post
    Body_pdf_unlock_pdf_unlock_post:
      properties:
        files:
          items:
            type: string
            contentMediaType: application/octet-stream
          type: array
          title: Files
        password:
          type: string
          title: Password
      type: object
      required:
      - files
      - password
      title: Body_pdf_unlock_pdf_unlock_post
    Body_pdf_watermark_pdf_watermark_post:
      properties:
        files:
          items:
            type: string
            contentMediaType: application/octet-stream
          type: array
          title: Files
        text:
          type: string
          title: Text
      type: object
      required:
      - files
      - text
      title: Body_pdf_watermark_pdf_watermark_post
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HashRequest:
      properties:
        data:
          type: string
          title: Data
        algorithms:
          items:
            type: string
          type: array
          title: Algorithms
          default:
          - md5
          - sha256
      type: object
      required:
      - data
      title: HashRequest
    ImageResizeRequest:
      properties:
        url:
          type: string
          title: Url
        width:
          type: integer
          title: Width
        height:
          anyOf:
          - type: integer
          - type: 'null'
          title: Height
        format:
          type: string
          title: Format
          default: PNG
      type: object
      required:
      - url
      - width
      title: ImageResizeRequest
    JsonToCsvRequest:
      properties:
        data:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Data
        delimiter:
          type: string
          title: Delimiter
          default: ','
      type: object
      required:
      - data
      title: JsonToCsvRequest
    MarkdownRequest:
      properties:
        content:
          type: string
          title: Content
        extensions:
          items:
            type: string
          type: array
          title: Extensions
          default:
          - extra
          - codehilite
          - toc
      type: object
      required:
      - content
      title: MarkdownRequest
    MinifyRequest:
      properties:
        code:
          type: string
          title: Code
          default: ''
        css:
          type: string
          title: Css
          default: ''
      type: object
      title: MinifyRequest
    PasteRequest:
      properties:
        content:
          type: string
          title: Content
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        language:
          type: string
          title: Language
          default: text
        expiry:
          type: string
          title: Expiry
          default: 24h
      type: object
      required:
      - content
      title: PasteRequest
    QRRequest:
      properties:
        data:
          type: string
          title: Data
        size:
          type: integer
          title: Size
          default: 300
        error_correction:
          type: string
          title: Error Correction
          default: M
      type: object
      required:
      - data
      title: QRRequest
    ShortenRequest:
      properties:
        url:
          type: string
          title: Url
        custom_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Custom Code
      type: object
      required:
      - url
      title: ShortenRequest
    TextRequest:
      properties:
        text:
          type: string
          title: Text
      type: object
      required:
      - text
      title: TextRequest
    TrackRequest:
      properties:
        path:
          type: string
          title: Path
        ref:
          type: string
          title: Ref
          default: ''
      type: object
      required:
      - path
      title: TrackRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    WaitlistRequest:
      properties:
        email:
          type: string
          title: Email
      type: object
      required:
      - email
      title: WaitlistRequest
    YamlConvertRequest:
      properties:
        json_data:
          type: string
          title: Json Data
          default: ''
        yaml_data:
          type: string
          title: Yaml Data
          default: ''
      type: object
      title: YamlConvertRequest
