webhooks:
  order.created:
    post:
      operationId: webhook_order_created
      summary: An order was created with your API key.
      description: 'POSTed to the webhook URL on your partner account. x-px-signature: t=<unix seconds>,v1=<hex HMAC-SHA256 of `${t}.${raw body}` with your webhook secret>. Check it against the raw body before parsing, and reject old timestamps (for example older than 5 minutes). Answer with any 2xx status within 8 seconds. Failed deliveries are retried with growing gaps, up to 10 attempts over several hours, so the same event can arrive more than once: use the order or link id to ignore repeats.'
      tags:
      - Webhooks
      parameters:
      - name: x-px-signature
        in: header
        required: true
        description: t=<unix seconds>,v1=<hex HMAC-SHA256>
        schema:
          type: string
          pattern: "^t=\\d+,v1=[0-9a-f]{64}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - "$ref": "#/components/schemas/WebhookEnvelope"
              - type: object
                properties:
                  event:
                    type: string
                    const: order.created
                  data:
                    "$ref": "#/components/schemas/OrderWebhookData"
      responses:
        '200':
          description: Any 2xx status means delivered.
      security: []
