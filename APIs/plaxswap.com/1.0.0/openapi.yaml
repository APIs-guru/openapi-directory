---
openapi: 3.1.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: Plaxswap API
  version: 1.0.0
  summary: Quote and create crypto swaps that pay out straight to your user's address.
  description: |-
    JSON over HTTPS. Coin amounts are decimal strings in coin units ("0.015"), never floats. US dollar values are numbers. Times are ISO 8601 in UTC.
    A coin on one network is a method, with an id such as btc, eth-base or usdt-tron: use those ids for from and to.

    Partners: send your API key in x-api-key (or Authorization: Bearer) and the end user's public IP address in x-user-ip, so the country rules apply to that person. Requests without a key act as a regular visitor with no commission.

    Errors: every error is { "error": { "code", "message", "details"? } } with a matching HTTP status. The message is plain English and safe to show.

    Rate limits are per IP address (the end user's for partners): each operation lists its limit in x-rate-limit. Going over returns 429 rate_limited.

    Sandbox: a build in sim mode simulates every chain. POST /api/dev/deposit and POST /api/dev/mine move test orders forward there (not part of this API).
  contact:
    email: support@plaxswap.com
    name: Plaxswap
    url: https://plaxswap.com
    x-twitter: plaxswap_com
  x-apisguru-categories:
  - payment
  - financial
  x-logo:
    url: https://plaxswap.com/icons/icon-512.png
  x-origin:
  - format: openapi
    url: https://plaxswap.com/api/v1/openapi.json
    version: '3.1'
  x-providerName: plaxswap.com
servers:
- url: https://plaxswap.com
  description: This deployment
tags:
- name: Service
  description: Mode, coins, status and policies. No authentication.
- name: Swaps
  description: Prices, quotes and new orders, and the website swap form's decentralized routes (/api/v1/dex). An API key is optional and adds your commission; on swap-form routes the commission also needs commissionTo.
- name: Orders
  description: Reading and changing an order. Changes need the order token.
- name: Payment links
  description: '"Pay me exactly X of coin Y": links that anyone can pay with any supported coin.'
- name: Price alerts
  description: One Telegram message when a rate crosses a number.
- name: Accounts
  description: 'Optional accounts with no sign-up: order history, address book, referrals. The account key lives in an HttpOnly cookie; writes need x-px-account: 1.'
- name: Partner portal
  description: Your volume, commission, webhook deliveries and withdrawals. Needs your API key.
- name: Support
  description: Support requests without an account, read on a private page.
- name: Payment gateway
  description: 'Accept crypto on your website: create a payment, send the payer to the hosted checkout, get a signed webhook. Needs your merchant key (pxs_live_... or pxs_test_...). Guide: /developers/payments.'
- name: Merchant account
  description: Sign up, your account's settings, keys and webhook deliveries.
- name: Checkout
  description: What the hosted checkout page calls. No key; the payer's browser.
- name: Sandbox
  description: Only where developer tools are on.
- name: Webhooks
  description: Signed POST requests to your webhook URL.
paths:
  "/api/v1/meta":
    get:
      operationId: getMeta
      summary: Service mode, the caller's country rules and time limits
      description: Also says whether a private real-money pilot is running (pilot) and gives display-currency rates (fx), refreshed about once an hour.
      tags:
      - Service
      responses:
        '200':
          description: Service details for this caller.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MetaResponse"
      security: []
  "/api/v1/coins":
    get:
      operationId: listCoins
      summary: Coins, networks and methods (a coin on a network)
      description: 'Changes rarely: cache it for a minute or more. In testnet mode, contract holds the test-network token contract.'
      tags:
      - Service
      responses:
        '200':
          description: The coin list.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CoinsResponse"
      security: []
  "/api/v1/dex/coins":
    get:
      operationId: listDexCoins
      summary: The swap form's coins
      description: The coin list of /api/v1/coins plus the coins only the decentralized swap form offers (sent from any wallet to Relay or NEAR Intents), with prices. Cache it for a minute. With list=v2, also about 200 popular, high-volume coins, each coin's rank, and which coins only a connected wallet sells.
      tags:
      - Swaps
      parameters:
      - name: list
        in: query
        required: false
        description: 'v2: the full list (popular coins, rank, connect). Leave it out for the list older apps know.'
        schema:
          type: string
          enum:
          - v2
      responses:
        '200':
          description: The coin list.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CoinsResponse"
      security: []
  "/api/v1/dex/routes":
    post:
      operationId: dexRoutes
      summary: Decentralized routes for a pair and amount, best first
      description: 'KyberSwap, 0x, LI.FI, Relay and NEAR Intents, with Plaxswap''s fee (0.3%) inside the route and each route''s own fee shown. pay: send (the default for coins on EVM networks: a one-time Relay or NEAR Intents deposit address) or connect (the customer''s wallet signs). With account and toAccount the routes are dry-run for that wallet. Partners (API key): commissionBps (0 to 200) and commissionTo, the EVM wallet the route pays your commission to; without commissionTo there is no commission. With a commission, only Relay and NEAR Intents routes are offered, and they pay it straight to that wallet (claimed at relay.link and near-intents.org; NEAR Intents keeps half of it).'
      tags:
      - Swaps
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - from
              - to
              - amount
              properties:
                from:
                  type: string
                to:
                  type: string
                amount:
                  type: string
                account:
                  type: string
                toAccount:
                  type: string
                slippageBps:
                  type: integer
                  enum:
                  - 30
                  - 50
                  - 100
                pay:
                  type: string
                  enum:
                  - send
                  - connect
                commissionBps:
                  type: integer
                  minimum: 0
                  maximum: 200
                commissionTo:
                  type: string
                  description: 'Partners only: the EVM wallet (0x…) the route pays the commission to.'
            example:
              from: usdt-bsc
              to: bnb
              amount: '20'
      responses:
        '200':
          description: 'Routes, best first, with the mode: wallet (signed in the customer''s wallet) or deposit (a one-time Relay or NEAR Intents address).'
        '400':
          description: bad_request, pair_unavailable, invalid_address.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: country_blocked.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '429':
          description: 'rate_limited: 60 per minute.'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security: []
  "/api/v1/dex/build":
    post:
      operationId: dexBuild
      summary: The transaction for the customer's wallet, or a Relay or NEAR Intents deposit address
      tags:
      - Swaps
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - routeId
              properties:
                routeId:
                  type: string
      responses:
        '200':
          description: 'kind wallet: the transaction (and an exact-amount approval when needed); kind gasless: the messages to sign (0x pays the network fee from the coin sold); kind deposit: the Relay or NEAR Intents address, memo and amount.'
        '400':
          description: bad_request.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: address_not_allowed, country_blocked.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '409':
          description: quote_expired.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '429':
          description: 'rate_limited: 20 per minute.'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security: []
  "/api/v1/dex/status":
    get:
      operationId: dexStatus
      summary: Progress of a swap paid to a one-time deposit address (NEAR Intents or Relay)
      tags:
      - Swaps
      parameters:
      - name: depositAddress
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: status (PENDING_DEPOSIT, KNOWN_DEPOSIT_TX, PROCESSING, SUCCESS, INCOMPLETE_DEPOSIT, REFUNDED, FAILED; for the Plaxswap route also EXPIRED, and HELD when the bridge did not deliver as quoted and the team finishes it by hand) and transaction hashes.
        '400':
          description: bad_request.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: not_found.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '429':
          description: rate_limited.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security: []
  "/api/v1/dex/deposit":
    get:
      operationId: dexDeposit
      summary: Who holds a one-time deposit address, and how to pay it (for its page on another device)
      description: 'From the record kept when the swap was set up: provider (near, relay or plaxswap), the request it is followed by, and (for swaps set up from 27 Oct 2026) coins, networks, amount, minimum received, usual time, pay-to address and comment. No payout or refund address.'
      tags:
      - Swaps
      parameters:
      - name: address
        in: query
        required: true
        description: The deposit address (or, on TON, the request) from /swap/deposit/<address>.
        schema:
          type: string
      responses:
        '200':
          description: provider, track, createdAt and pay (null for older swaps).
        '400':
          description: bad_request.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: not_found.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '429':
          description: 'rate_limited: 120 per minute.'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security: []
  "/api/v1/dex/tx":
    get:
      operationId: dexTx
      summary: Whether a swap sent from the customer's wallet is confirmed
      tags:
      - Swaps
      parameters:
      - name: chain
        in: query
        required: true
        schema:
          type: string
      - name: hash
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 'status: success, reverted or pending.'
        '400':
          description: bad_request.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '429':
          description: rate_limited.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security: []
  "/api/v1/dex/submit":
    post:
      operationId: dexSubmit
      summary: The customer's signatures for a gasless swap; 0x sends it
      tags:
      - Swaps
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - submitId
              - trade
              properties:
                submitId:
                  type: string
                trade:
                  type: string
                  description: Signature of the trade message.
                approval:
                  type: string
                  description: Signature of the approval message, when the build asked for one.
      responses:
        '200':
          description: tradeHash, to follow with /api/v1/dex/gasless.
        '400':
          description: bad_request, bad_signature.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: country_blocked.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '409':
          description: quote_expired.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '429':
          description: 'rate_limited: 20 per minute.'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '503':
          description: route_failed, unavailable.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security: []
  "/api/v1/wallet-push":
    post:
      operationId: walletPushRegister
      summary: Opt in to private incoming-payment notifications
      description: Requires explicit device opt-in and a project-valid FCM token. Public receiving addresses are kept in the private isolated watcher, expire after seven days, and are never included in public activity or analytics. watching contains only currently monitored EVM networks. Other networks retain device fallback. No wallet key is accepted.
      tags:
      - Swaps
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              - addresses
              - hideAmounts
              properties:
                token:
                  type: string
                addresses:
                  type: array
                  maxItems: 32
                  items:
                    type: object
                hideAmounts:
                  type: boolean
      responses:
        '200':
          description: 'watching: network IDs currently monitored.'
        '400':
          description: bad_request.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '429':
          description: rate_limited.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '503':
          description: push_unavailable.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security: []
    delete:
      operationId: walletPushUnregister
      summary: Remove a device notification registration and its queued notices
      tags:
      - Swaps
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              properties:
                token:
                  type: string
      responses:
        '200':
          description: 'ok: true.'
        '400':
          description: bad_request.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '429':
          description: rate_limited.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '503':
          description: push_unavailable.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security: []
  "/api/v1/wallet-push/test":
    post:
      operationId: walletPushTest
      summary: Send a test notification to an opted-in registered device
      tags:
      - Swaps
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              properties:
                token:
                  type: string
      responses:
        '200':
          description: 'inSeconds: delivery was submitted, device delivery still depends on Android and connectivity.'
        '400':
          description: bad_request.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '429':
          description: rate_limited.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '503':
          description: push_unavailable.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security: []
  "/api/v1/wallet-push/prices":
    post:
      operationId: walletPushPrices
      summary: Sync a device's instant price alerts
      description: 'Opt-in Plaxswap Wallet price alerts: CoinGecko coin ids, symbols and target prices only, never addresses or amounts. Empty alerts and no big moves stop the watch.'
      tags:
      - Swaps
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              - alerts
              - moves
              - quiet
              - tz
              - currency
              - hideAmounts
              properties:
                token:
                  type: string
                alerts:
                  type: array
                  maxItems: 50
                moves:
                  type:
                  - object
                  - 'null'
                quiet:
                  type:
                  - object
                  - 'null'
                tz:
                  type: integer
                  description: Minutes east of UTC.
                currency:
                  type: object
                hideAmounts:
                  type: boolean
      responses:
        '200':
          description: 'watching: coins checked each minute; sent: price alerts delivered since the last sync.'
        '400':
          description: bad_request.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '429':
          description: 'rate_limited: 20 per minute.'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '503':
          description: push_unavailable.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security: []
  "/api/v1/wallet-swap-fee":
    post:
      operationId: walletSwapFee
      summary: Verify a company platform-fee receipt
      description: Accepts only a public network ID and transaction hash. Independently verifies a successful canonical supported-router fee to a registered company destination; never trusts client amounts. Duplicate receipts count once. This does not register a wallet or track ordinary send/receive activity. Coverage currently includes EVM KyberSwap and LI.FI fee forwarding. Historical external payments require an operator reconciliation.
      tags:
      - Swaps
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - chainId
              - hash
              additionalProperties: false
              properties:
                chainId:
                  type: integer
                  minimum: 1
                hash:
                  type: string
                  pattern: "^0x[0-9a-fA-F]{64}$"
      responses:
        '200':
          description: 'status: recorded, pending (202), or unsupported; reporting never authorizes a payment.'
        '400':
          description: bad_request.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '429':
          description: rate_limited.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '503':
          description: busy.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security: []
  "/api/v1/dex/done":
    post:
      operationId: dexDone
      summary: A wallet swap the browser saw confirmed
      description: Recorded only when the network confirms that this transaction succeeded, from the swap's own wallet, and that it is exactly the transaction built for the swap (same contract, value and calldata). A transaction finishes one swap only.
      tags:
      - Swaps
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - ref
              - hash
              properties:
                ref:
                  type: string
                  description: ref from /api/v1/dex/build.
                hash:
                  type: string
      responses:
        '200':
          description: 'recorded: whether the swap now counts as finished.'
        '400':
          description: bad_request.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '429':
          description: rate_limited.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security: []
  "/api/v1/dex/gas":
    get:
      operationId: dexGas
      summary: Whether the gas sent for a swap has reached the customer's wallet
      description: When the customer's wallet had no gas, Plaxswap's hot wallet sends exactly what the swap needs; its cost is in that swap's fee.
      tags:
      - Swaps
      parameters:
      - name: ref
        in: query
        required: true
        description: ref from /api/v1/dex/build.
        schema:
          type: string
      responses:
        '200':
          description: 'status: sending, arrived or failed (simulated: true on the local simulator).'
        '400':
          description: bad_request.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '429':
          description: rate_limited.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security: []
  "/api/v1/dex/gasless":
    get:
      operationId: dexGasless
      summary: Whether 0x has sent and confirmed a gasless swap
      tags:
      - Swaps
      parameters:
      - name: tradeHash
        in: query
        required: true
        schema:
          type: string
      - name: chainId
        in: query
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: 'status: pending, success or failed, with the transaction hash once sent.'
        '400':
          description: bad_request.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '429':
          description: rate_limited.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security: []
  "/api/v1/dex/bridge":
    get:
      operationId: dexBridge
      summary: Whether a swap between networks has arrived
      tags:
      - Swaps
      parameters:
      - name: chain
        in: query
        required: true
        schema:
          type: string
      - name: toChain
        in: query
        required: true
        schema:
          type: string
      - name: hash
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 'status: pending, done, failed, refunded (LI.FI sent the coins back to the sender) or partial (part of it, or another coin, arrived), with LI.FI''s substatus, and the arriving transaction''s hash once done or partial. Only done is a delivery.'
        '400':
          description: bad_request.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '429':
          description: rate_limited.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security: []
  "/api/v1/pair":
    get:
      operationId: getPair
      summary: Rate, limits and fees for a pair, with an estimate when amount is given
      description: With an API key, the rate includes your commission. The maximum takes the caller's country limit into account.
      tags:
      - Swaps
      parameters:
      - name: from
        in: query
        required: true
        description: Method id of the coin sent.
        schema:
          type: string
        example: btc
      - name: to
        in: query
        required: true
        description: Method id of the coin received.
        schema:
          type: string
        example: usdt-tron
      - name: amount
        in: query
        required: false
        description: Amount to send, for an estimate.
        schema:
          type: string
          pattern: "^\\d+(\\.\\d+)?$"
        example: '0.01'
      - name: commissionBps
        in: query
        required: false
        description: 'Partners only: price with this commission (0 to 200 basis points), as on their order. Defaults to the partner''s own rate.'
        schema:
          type: integer
          minimum: 0
          maximum: 200
      - "$ref": "#/components/parameters/UserIp"
      - "$ref": "#/components/parameters/UserCountry"
      responses:
        '200':
          description: Rate, limits and fees.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PairResponse"
        '400':
          description: bad_request (from or to missing or unknown), bad_amount, user_ip_required, user_ip_invalid.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          description: invalid_api_key.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '409':
          description: coin_unavailable, rate_unavailable.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '429':
          description: 'rate_limited: more than the limit per IP address and minute.'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security:
      - {}
      - partnerKey: []
      - partnerBearer: []
      x-rate-limit: 120 per minute
  "/api/v1/prices/markets":
    get:
      operationId: getMarkets
      summary: Every coin the wallets carry, with price, day's change and a week's line
      description: 'One answer for 130+ coins from a two-minute cache (name, colour, icon, priceUsd, change24h, marketCapUsd, spark). For display only: amounts and fees use their own prices.'
      tags:
      - Swaps
      responses:
        '200':
          description: 'asOf and data: one entry per coin, largest market first.'
          content:
            application/json:
              schema:
                type: object
      security: []
  "/api/v1/prices/history":
    get:
      operationId: getPriceHistory
      summary: One coin priced in another over a range (the home page chart)
      description: 'Coins may be coin ids (ETH) or method ids (usdc-eth): the price does not depend on the network. The last point is our live price.'
      tags:
      - Swaps
      parameters:
      - name: from
        in: query
        required: true
        description: Coin priced.
        schema:
          type: string
        example: eth
      - name: to
        in: query
        required: true
        description: Coin it is priced in.
        schema:
          type: string
        example: usdc-eth
      - name: range
        in: query
        required: false
        description: 1h, 1d (default), 7d or 30d.
        schema:
          type: string
          enum:
          - 1h
          - 1d
          - 7d
          - 30d
        example: 1d
      responses:
        '200':
          description: Price history.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PriceHistoryResponse"
        '400':
          description: bad_request (from or to missing or unknown, or an unknown range).
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '409':
          description: history_unavailable.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '429':
          description: Too many requests.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security: []
      x-rate-limit: 120 per minute
  "/api/v1/quotes":
    post:
      operationId: createQuote
      summary: 'Lock a price for a fixed-rate swap (switched off now: returns fixed_unavailable)'
      description: 'Fixed rates are switched off at the moment: this returns 409 fixed_unavailable. Create a variable-rate order instead. When they are on: give depositAmount (what is sent) or settleAmount (what is received), not both, and create the order before expiresAt.'
      tags:
      - Swaps
      parameters:
      - "$ref": "#/components/parameters/UserIp"
      - "$ref": "#/components/parameters/UserCountry"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/QuoteRequest"
            example:
              from: btc
              to: usdt-tron
              depositAmount: '0.005'
      responses:
        '201':
          description: The quote.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/QuoteResponse"
        '400':
          description: bad_request, bad_amount, amount_out_of_range, user_ip_required, user_ip_invalid.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          description: invalid_api_key.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: 'private_pilot: real-money swaps are a private test and not open to the public.'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '409':
          description: fixed_unavailable (fixed rates are switched off), coin_unavailable, rate_unavailable, liquidity_low, fuel_empty (a network the swap needs is waiting for network-fee coin).
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '429':
          description: 'rate_limited: more than the limit per IP address and minute.'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '451':
          description: 'jurisdiction_blocked: swaps are not offered in the end user''s country.'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '503':
          description: 'service_paused: new swaps are paused for now; open orders still complete.'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security:
      - {}
      - partnerKey: []
      - partnerBearer: []
      x-rate-limit: 20 per minute
  "/api/v1/orders":
    post:
      operationId: createOrder
      summary: Create an order (variable rate; fixed-rate orders are switched off now)
      description: 'type fixed returns 409 fixed_unavailable while fixed rates are switched off; use type variable. Addresses are checked for format, checksum, sanctions and risk before any deposit address exists. Keep orderToken: it is shown once. When order.depositAddress is null, identity verification comes first (POST /api/v1/orders/{id}/kyc).'
      tags:
      - Swaps
      parameters:
      - "$ref": "#/components/parameters/UserIp"
      - "$ref": "#/components/parameters/UserCountry"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateOrderRequest"
            example:
              type: variable
              from: eth
              to: usdt-tron
              settleAddress: TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t
              payoutDestination: self_hosted
              acceptTerms: true
      responses:
        '201':
          description: The order and its secret token.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CreateOrderResponse"
        '400':
          description: bad_request (missing terms, type, quote or coins), invalid_address and invalid_memo (details.field names the field), travel_rule_required, user_ip_required, user_ip_invalid.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          description: invalid_api_key.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: address_not_allowed (failed sanctions or risk screening; details.field is settleAddress or refundAddress), forbidden (the quote belongs to someone else), private_pilot.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: 'not_found: unknown quote.'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '409':
          description: fixed_unavailable (type fixed while fixed rates are switched off), quote_expired, coin_unavailable, limit_exceeded.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '429':
          description: rate_limited (10 per minute per IP), velocity_limit (too many orders from one device in an hour).
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '451':
          description: jurisdiction_blocked.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '503':
          description: service_paused.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security:
      - {}
      - partnerKey: []
      - partnerBearer: []
      x-rate-limit: 10 per minute
  "/api/v1/orders/{id}":
    get:
      operationId: getOrder
      summary: An order, its deposits and its history
      description: Anyone with the order id can read it, with payout, refund and sender addresses shortened. The full view needs the order token (x-order-token) or the API key of the partner that created the order.
      tags:
      - Orders
      parameters:
      - "$ref": "#/components/parameters/OrderId"
      - name: x-order-token
        in: header
        required: false
        description: 'Optional: with the order token, addresses come back in full.'
        schema:
          type: string
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OrderView"
        '401':
          description: invalid_api_key.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: not_found.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
