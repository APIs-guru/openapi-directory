  parameters:
    OrderId:
      name: id
      in: path
      required: true
      description: Order id (14 characters).
      schema:
        type: string
        pattern: "^[0-9a-z]{14}$"
    LinkId:
      name: id
      in: path
      required: true
      description: Payment link id.
      schema:
        type: string
        pattern: "^pl_[0-9a-z]{14}$"
    KycSessionId:
      name: id
      in: path
      required: true
      description: Verification session id.
      schema:
        type: string
        pattern: "^k_[0-9a-z]{16}$"
    AlertId:
      name: id
      in: path
      required: true
      description: Price alert id.
      schema:
        type: string
        maxLength: 64
    UserIp:
      name: x-user-ip
      in: header
      required: false
      description: 'Required with an API key: the end user''s public IP address. Private and reserved addresses are refused (user_ip_invalid).'
      schema:
        type: string
      example: 203.0.113.7
    UserCountry:
      name: x-user-country
      in: header
      required: false
      description: 'Optional with an API key: the end user''s country as two letters (for example from Cloudflare''s CF-IPCountry). Used when we cannot place x-user-ip ourselves.'
      schema:
        type: string
        pattern: "^[A-Za-z]{2}$"
      example: IN
    LinkToken:
      name: x-link-token
      in: header
      required: true
      description: The manage token returned once when the link was created.
      schema:
        type: string
    AccountCsrf:
      name: x-px-account
      in: header
      required: true
      description: Must be 1 on every write with the account cookie. Other websites cannot add this header, so they cannot act with your visitor's cookie.
      schema:
        type: string
        const: '1'
    AddressId:
      name: id
      in: path
      required: true
      description: Saved address id.
      schema:
        type: string
    TicketId:
      name: id
      in: path
      required: true
      description: Support request id.
      schema:
        type: string
        pattern: "^t_[0-9a-z]{16}$"
    TicketToken:
      name: x-ticket-token
      in: header
      required: true
      description: The request's private token, shown once when it was opened.
      schema:
        type: string
    PaymentId:
      name: id
      in: path
      required: true
      description: Payment id.
      schema:
        type: string
        pattern: "^pay_[0-9a-z]{16}$"
    MerchantKeyId:
      name: id
      in: path
      required: true
      description: Key id (mk_...).
      schema:
        type: string
        pattern: "^mk_[0-9a-z]{12}$"
    DeliveryId:
      name: id
      in: path
      required: true
      description: Webhook delivery id.
      schema:
        type: integer
  securitySchemes:
    partnerKey:
      type: apiKey
      in: header
      name: x-api-key
      description: Partner API key, pxk_<prefix>_<secret>. Created in the admin console and shown once. A wrong or switched-off key gets 401 invalid_api_key.
    partnerBearer:
      type: http
      scheme: bearer
      description: 'The same API key as Authorization: Bearer pxk_<prefix>_<secret>.'
    merchantBearer:
      type: http
      scheme: bearer
      description: 'Payment gateway merchant key as Authorization: Bearer pxs_live_<prefix>_<secret> (or pxs_test_... for test mode). Shown once at sign-up.'
    merchantCookie:
      type: apiKey
      in: cookie
      name: px_merchant
      description: 'Merchant owner session after Google or Telegram login. Writes also require x-px-merchant: 1 and the site Origin. API keys cannot manage accounts, credentials or withdrawals.'
    merchantKey:
      type: apiKey
      in: header
      name: x-api-key
      description: The same merchant key in x-api-key.
    accountCookie:
      type: apiKey
      in: cookie
      name: px_acct
      description: The browser's account key (HttpOnly). Set by POST /api/v1/account or /api/v1/account/restore.
security: []
