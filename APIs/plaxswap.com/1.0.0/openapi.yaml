    get:
      operationId: getAlert
      summary: One price alert
      tags:
      - Price alerts
      parameters:
      - "$ref": "#/components/parameters/AlertId"
      responses:
        '200':
          description: The alert.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AlertResponse"
        '404':
