          type: string
          maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreatePaymentRequest"
            example:
              amount: '100'
              currency: USD
              receive: usdt-tron
              orderId: '1042'
              description: 2 x T-shirt
              returnUrl: https://shop.example/thanks
      responses:
        '201':
          description: The new payment.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PaymentView"
        '400':
          description: invalid_amount, invalid_currency, invalid_receive_coin, invalid_address, invalid_memo, invalid_url, invalid_expiry, invalid_metadata, amount_out_of_range.
