          description: Limits reached or the pair is unavailable.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '429':
          description: 'rate_limited: 10 per 10 minutes.'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security: []
      x-rate-limit: 10 per 10 minutes
    get:
      operationId: listAlerts
      summary: The alerts with these ids
      description: The browser that created alerts keeps their ids; an alert's id is its secret.
      tags:
      - Price alerts
      parameters:
