      - {}
      - partnerKey: []
      - partnerBearer: []
  "/api/v1/orders/{id}/stream":
    get:
      operationId: streamOrder
      summary: Live updates for an order (server-sent events)
      description: 'Sends `event: order` with the whole order (addresses shortened) on connect and on every change, and `event: ping` every 20 seconds. The server closes the stream after 30 minutes; EventSource reconnects on its own. Once the order is finished (settled, refunded, expired, cancelled or failed, and no further deposit is accepted) the stream ends after its last update, and a new request gets 204 No Content, which stops EventSource from reconnecting. Holders of the order token fetch the full view with GET /api/v1/orders/{id} when an update arrives.'
      tags:
      - Orders
      parameters:
      - "$ref": "#/components/parameters/OrderId"
      responses:
        '200':
          description: An event stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: 'event: order\ndata: <OrderView JSON>\n\n'
        '404':
          description: not_found.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '429':
          description: 'too_many_streams: more than 6 open streams from one IP address. Poll every few seconds instead.'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security: []
