                "$ref": "#/components/schemas/Error"
        '404':
          description: not_found.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '409':
          description: 'link_paid, link_expired, link_cancelled, link_unavailable, payment_open, payment_in_progress, liquidity_low (details.payWith: the link''s own coin, which still works), fuel_empty, rate_unavailable.'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '429':
          description: rate_limited.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '451':
          description: jurisdiction_blocked.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security:
