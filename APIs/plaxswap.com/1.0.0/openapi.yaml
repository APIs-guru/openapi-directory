  "/api/v1/assistant":
    post:
      operationId: askAssistant
      summary: Ask the help chat
      description: 'The help chat on plaxswap.com. Answers only from Plaxswap''s published help pages and docs, with the pages it used. It cannot see orders, payments or accounts. Never send recovery phrases, private keys, passwords or codes: messages that contain them are refused and sent nowhere. Off unless switched on by Plaxswap.'
      tags:
      - Support
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - message
              - page
              properties:
                message:
                  type: string
                  maxLength: 4000
                page:
                  type: object
                  required:
                  - path
                  properties:
                    path:
                      type: string
                    title:
                      type: string
                recentPages:
                  type: array
                  items:
                    type: string
                history:
                  type: array
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                        enum:
                        - user
                        - assistant
                      text:
                        type: string
                conversationId:
                  type: string
            example:
              message: How do refunds work?
              page:
                path: "/help"
                title: Help center
      responses:
        '200':
          description: mode (ai, help, unsure or safety), answer, more, sources, quickReplies and handoff.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: invalid_request, too_long.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '429':
          description: rate_limited.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '503':
          description: 'chat_off: the chat is switched off.'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security: []
      x-rate-limit: set by Plaxswap (20 per 10 minutes by default)
