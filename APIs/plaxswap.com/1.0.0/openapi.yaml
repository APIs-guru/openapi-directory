      description: type handoff counts a handoff to people. type feedback rates an answer (rating up or down, with the question, answer, sources, page and an optional comment); the text is cleaned of secrets, addresses and emails before it is kept, and nothing about the person is stored.
      tags:
      - Support
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum:
                  - handoff
                  - feedback
                rating:
                  type: string
                  enum:
                  - up
                  - down
      responses:
        '200':
          description: 'ok: true.'
          content:
            application/json:
              schema:
                type: object
