          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '429':
          description: 'rate_limited: 10 per minute and 30 per hour.'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
