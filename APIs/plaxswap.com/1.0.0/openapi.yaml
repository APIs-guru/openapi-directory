          description: Coin or wallet missing.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: Policy or address check failed.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '409':
          description: Closed link, other network, or no route.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
