          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '429':
          description: rate_limited.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security: []
      x-rate-limit: 60 per minute
