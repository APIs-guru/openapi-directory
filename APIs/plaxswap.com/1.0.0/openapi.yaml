        '409':
          description: idempotency_conflict.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '429':
          description: 'rate_limited: more than gateway.keyRequestsPerMinute requests a minute with one key; two_factor_locked after five incorrect codes.'
