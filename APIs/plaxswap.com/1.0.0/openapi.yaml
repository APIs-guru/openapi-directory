components:
  schemas:
    Error:
      type: object
      description: Every error has this shape, with an HTTP status code that matches.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Stable, machine-readable code, for example "quote_expired".
            message:
              type: string
              description: Plain English, safe to show to the person.
            details:
              description: Extra data for some errors, for example { field } or { min, max }.
          required:
          - code
          - message
      required:
      - error
    ChainMode:
      type: string
      description: 'sim: simulated chains (the sandbox). testnet: public test networks. mainnet: real money.'
      enum:
      - sim
      - testnet
      - mainnet
    RuleStatus:
      type: string
      description: 'Country rule: allow, limited (caps without identity verification), kyc_all (verification first), block.'
      enum:
      - allow
      - limited
      - kyc_all
      - block
    OrderType:
      type: string
      description: 'fixed: locked price, exact amount. variable: any amount within limits, market rate when it confirms.'
      enum:
      - fixed
      - variable
    OrderStatus:
      type: string
      enum:
      - waiting
      - pending
      - processing
      - review
      - settling
      - settled
      - refund
      - refunding
      - refunded
      - frozen
      - failed
      - expired
      - cancelled
      - multiple
    DepositStatus:
      type: string
      enum:
      - pending
      - processing
      - review
      - settling
      - settled
      - refund
      - refunding
      - refunded
      - frozen
      - failed
    ReasonCode:
      type: string
      description: Why a deposit left the normal path. reasonText explains it in plain English.
      enum:
      - amount_under_min
      - amount_over_max
      - incorrect_amount
      - order_expired
      - max_one_deposit
      - too_many_deposits
      - coin_unavailable
      - rate_unavailable
      - low_effective_rate
      - duplicate
      - risk_review
      - kyc_required
      - limit_exceeded
      - sanctions_match
      - jurisdiction_blocked
      - below_refund_cost
      - travel_rule_required
      - review_timeout
      - payout_failed
      - deposit_dropped
      - kyc_location
      - kyc_rejected
      - legal_hold
      - rate_moved
      - manual
      - partner_limit
    KycStatus:
      type: string
      enum:
      - none
      - required
      - pending
      - approved
      - rejected
    PayoutDestination:
      type: string
      description: 'Travel rule: is the payout address your own wallet or an exchange account?'
      enum:
      - self_hosted
      - exchange
    FxSnapshot:
      type: object
      description: Display currencies. For showing estimates only, never for amounts that move.
      properties:
        base:
          type: string
          const: USD
        rates:
          type: object
          additionalProperties:
            type: number
          description: Units of each currency for 1 US dollar.
        at:
          type: string
          description: When the rates were fetched (about once an hour).
          format: date-time
      required:
      - base
      - rates
      - at
    Permissions:
      type: object
      properties:
        canSwap:
          type: boolean
          description: False when swaps are not offered in the caller's country.
        status:
          "$ref": "#/components/schemas/RuleStatus"
        reason:
          type:
          - string
          - 'null'
          description: Plain-English explanation of the country rule.
        maxOrderUsd:
          type:
          - number
          - 'null'
          description: 'Largest single swap without identity verification, in US dollars. null: no cap from the country rule.'
        max30dUsd:
          type:
          - number
          - 'null'
          description: Rolling 30-day cap without identity verification, in US dollars.
        kycForAll:
          type: boolean
          description: Every swap from this country needs identity verification first.
      required:
      - canSwap
      - status
      - reason
      - maxOrderUsd
      - max30dUsd
      - kycForAll
    MetaResponse:
      type: object
      properties:
        exchangeReceiverRequired:
          type: boolean
          description: The exchange requires the actual recipient's name and country for withdrawals.
        fixedRate:
          type: boolean
          description: Fixed (locked) rates are offered. When false, quotes and fixed orders are refused with fixed_unavailable.
        brand:
          type: object
          properties:
            name:
              type: string
            tagline:
              type: string
            supportEmail:
              type: string
              format: email
          required:
          - name
          - tagline
          - supportEmail
        mode:
          "$ref": "#/components/schemas/ChainMode"
        country:
          type:
          - string
          - 'null'
          description: ISO 3166-1 alpha-2 country resolved for this request, "ZZ" when unknown.
        countryName:
          type:
          - string
          - 'null'
        permissions:
          "$ref": "#/components/schemas/Permissions"
        gatewayPermissions:
          "$ref": "#/components/schemas/Permissions"
        devTools:
          type: boolean
          description: Developer tools (simulated deposits, country override) are available. Never on mainnet.
        quoteTtlSeconds:
          type: integer
          description: How long a fixed-rate quote holds.
        fixedOrderTtlSeconds:
          type: integer
          description: How long a fixed-rate order waits for its deposit.
        variableOrderTtlSeconds:
          type: integer
          description: How long a variable-rate order waits for deposits.
        incident:
          type: object
          properties:
            pausedNewOrders:
              type: boolean
              description: Quotes and new orders are refused for now; open orders still complete.
            message:
              type:
              - string
              - 'null'
            announcement:
              type:
              - string
              - 'null'
          required:
          - pausedNewOrders
          - message
          - announcement
        pilot:
          type: object
          description: Private real-money test. While active, quotes and orders from anyone else get HTTP 403 private_pilot.
          properties:
            active:
              type: boolean
              description: 'Private real-money pilot: only the signed-in operator may quote or order.'
            operator:
              type: boolean
              description: This request comes from the pilot operator.
            maxSwapUsd:
              type:
              - number
              - 'null'
              description: The most one pilot swap may be worth right now, in US dollars.
          required:
          - active
          - operator
          - maxSwapUsd
        fees:
          "$ref": "#/components/schemas/FeeRules"
        fx:
          anyOf:
          - "$ref": "#/components/schemas/FxSnapshot"
          - type: 'null'
        botCheckSiteKey:
          type:
          - string
          - 'null'
          description: Cloudflare Turnstile site key. When set, web orders send botCheckToken; API-key orders do not need it.
      required:
      - brand
      - mode
      - country
      - countryName
      - permissions
      - gatewayPermissions
      - devTools
      - quoteTtlSeconds
      - fixedOrderTtlSeconds
      - variableOrderTtlSeconds
      - incident
      - pilot
      - fees
      - fx
      - botCheckSiteKey
    FeeRules:
      type: object
      properties:
        sameAssetBps:
          type: integer
          description: Our fee for moving the same coin to another network, in basis points (100 = 1%).
        stableBps:
          type: integer
          description: Our fee between two stablecoins.
        majorBps:
          type: integer
          description: Our fee between major coins.
        otherBps:
          type: integer
          description: Our fee for other coins.
        fixedPremiumBps:
          type: integer
          description: Extra for locking the rate.
        volatilityMaxBps:
          type: integer
          description: The most added while prices move fast.
        gasMarginPct:
          type: number
          description: Network fees charged are the live estimate plus this safety margin, in percent.
        minEarningsUsd:
          type: number
          description: Our fee on one swap is at least this, in US dollars...
        minEarningsMaxBps:
          type: integer
          description: "...but the minimum never raises it above this share of the swap."
        surgeMaxUsd:
          type: number
          description: The busy-network extra never costs more than this on one swap, in US dollars.
        refundHandlingPct:
          type: number
          description: 'Refunds you caused (too little, too much, too late, a wrong fixed amount, or you asked): handling fee as a share of the deposit, in percent.'
        refundHandlingMinUsd:
          type: number
          description: Smallest handling fee, in US dollars.
        refundHandlingMaxUsd:
          type: number
          description: Largest handling fee, in US dollars.
      required:
      - sameAssetBps
      - stableBps
      - majorBps
      - otherBps
      - fixedPremiumBps
      - volatilityMaxBps
      - gasMarginPct
      - minEarningsUsd
      - minEarningsMaxBps
      - surgeMaxUsd
      - refundHandlingPct
      - refundHandlingMinUsd
      - refundHandlingMaxUsd
    AssetInfo:
      type: object
      properties:
        id:
          type: string
          description: Coin id, for example "BTC".
        name:
          type: string
        color:
          type: string
          description: Brand colour, hex.
          pattern: "^#[0-9A-Fa-f]{6}$"
        icon:
          type: string
          description: Path to the icon on this site, for example "/coins/btc.svg".
        stable:
          type: boolean
          description: A stablecoin.
        rank:
          type: integer
          description: "/api/v1/dex/coins?list=v2 only: how well-known the coin is (CoinGecko's market rank; 1 = most)."
        trending:
          type: boolean
          description: "/api/v1/dex/coins?list=v2 only: among today's trending coins."
      required:
      - id
      - name
      - color
      - icon
      - stable
      - rank
      - trending
    NetworkInfo:
      type: object
      properties:
        id:
          type: string
          description: Network id, for example "bitcoin".
        name:
          type: string
        nativeAssetId:
          type: string
        memoName:
          type:
          - string
          - 'null'
          description: '"Destination tag", "Memo" or "Comment" on networks that need one.'
        confirmations:
          type: integer
          description: Confirmations required before a deposit counts.
        avgSeconds:
          type: integer
          description: Typical seconds from a deposit being seen to the payout being sent.
        status:
          type: string
          enum:
          - ok
          - degraded
          - paused
        explorerTxUrl:
          type: string
          description: Block explorer link template with {txid}. Relative (/explorer/...) in simulation mode.
        explorerAddressUrl:
          type: string
          description: Block explorer link template with {address}.
      required:
      - id
      - name
      - nativeAssetId
      - memoName
      - confirmations
      - avgSeconds
      - status
      - explorerTxUrl
      - explorerAddressUrl
    MethodInfo:
      type: object
      properties:
        id:
          type: string
          description: 'Method id: one coin on one network, for example "usdt-tron". Use it for from and to.'
        assetId:
          type: string
        networkId:
          type: string
        label:
          type: string
          description: For example "USDT · Tron (TRC-20)".
        decimals:
          type: integer
          description: 'Precision of the coin: amounts never have more decimal places than this.'
        contract:
          type:
          - string
          - 'null'
          description: Token contract on this network in the current mode (the test-network contract in testnet mode). null for a network's own coin.
        memoRequired:
          type: boolean
          description: Deposits and payouts on this network carry a memo or tag.
        depositEnabled:
          type: boolean
        settleEnabled:
          type: boolean
        paused:
          type: boolean
        pauseReason:
          type:
          - string
          - 'null'
        priceUsd:
          type:
          - number
          - 'null'
          description: Current price in US dollars, for display.
        reach:
          type: object
          description: "/api/v1/dex/coins only. A swap sent from any wallet has a route only when one service is in the first coin's send and the second coin's receive."
          properties:
            send:
              type: array
              items:
                type: string
                enum:
                - relay
                - near
                - plaxswap
              description: 'Services that take the coin sent from any wallet (plaxswap: Plaxswap''s own one-time address, list=v2 only).'
            receive:
              type: array
              items:
                type: string
                enum:
                - relay
                - near
                - plaxswap
              description: Services that deliver the coin.
          required:
          - send
          - receive
        connect:
          type: boolean
          description: "/api/v1/dex/coins?list=v2 only: can be paid from a connected wallet on plaxswap.com (an empty send list then means connected wallets only)."
      required:
      - id
      - assetId
      - networkId
      - label
      - decimals
      - contract
      - memoRequired
      - depositEnabled
      - settleEnabled
      - paused
      - pauseReason
      - priceUsd
      - connect
    CoinsResponse:
      type: object
      properties:
        assets:
          type: array
          items:
            "$ref": "#/components/schemas/AssetInfo"
        networks:
          type: array
          items:
            "$ref": "#/components/schemas/NetworkInfo"
        methods:
          type: array
          items:
            "$ref": "#/components/schemas/MethodInfo"
        pricesUpdatedAt:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - assets
      - networks
      - methods
      - pricesUpdatedAt
    FeeBreakdown:
      type: object
      properties:
        receiveFeeUsd:
          type: number
          description: Cost to collect the deposit, in US dollars, safety margin included.
        sendFeeUsd:
          type: number
          description: Payout network fee, in US dollars, safety margin included.
        totalNetworkFeesUsd:
          type: number
        sendFeeInSettle:
          type: string
          description: Payout fee in units of the coin received.
          pattern: "^\\d+(\\.\\d+)?$"
          examples:
          - '0.015'
        networkFeesInSettle:
          type: string
          description: Both network fees in units of the coin received. Already taken off settleAmount.
          pattern: "^\\d+(\\.\\d+)?$"
          examples:
          - '0.015'
        spreadBps:
          type: integer
          description: 'Our fee inside the rate, in basis points (100 = 1%): the parts in spreadParts added up.'
        commissionBps:
          type: integer
          description: Partner commission inside the rate, in basis points.
        spreadParts:
          "$ref": "#/components/schemas/SpreadParts"
        gasMarginPct:
          type: number
          description: Network fees include this safety margin over the live estimate, in percent.
        route:
          type: string
          description: 'How the payout is made: from our own wallet, or converted on our exchange account.'
          enum:
          - wallet
          - exchange
        exchangeFeeBps:
          type: integer
          description: The exchange's trading fee inside the rate, in basis points (exchange route only).
        gasRef:
          type: object
          additionalProperties:
            type: string
          description: Gas level of each network this swap uses when it was priced (the cost of one plain transfer, in that network's base units). Our transaction waits while gas is far above it (gas spike protection), so nobody overpays.
        venue:
          type: string
          description: 'Exchange route only: where the swap is converted. uniswap: a Uniswap pool, from our own wallet (two coins of the same network). near: NEAR Intents, from our own wallet. swapkit: SwapKit''s cross-chain providers, from our own wallet. binance: our exchange account.'
      required:
      - receiveFeeUsd
      - sendFeeUsd
      - totalNetworkFeesUsd
      - sendFeeInSettle
      - networkFeesInSettle
      - spreadBps
      - commissionBps
    SpreadParts:
      type: object
      properties:
        tierBps:
          type: integer
          description: 'The fee for this kind of pair: major coins, stablecoins, other coins, or the same coin on another network.'
        fixedBps:
          type: integer
          description: Extra for locking the rate.
        volatilityBps:
          type: integer
          description: Extra while prices move fast.
        surchargeBps:
          type: integer
          description: Extra while a network the swap uses is much busier than usual (high gas).
        nudgeBps:
          type: integer
          description: Small step up or down by how much of the two coins we hold. Can be negative.
        minEarningsBps:
          type: integer
          description: Extra that brings a small swap up to the minimum fee.
      required:
      - tierBps
      - fixedBps
      - volatilityBps
      - surchargeBps
      - nudgeBps
      - minEarningsBps
    PairResponse:
      type: object
      properties:
        from:
          type: string
        to:
          type: string
        rate:
          type: string
          description: Units of the coin received for 1 unit of the coin sent, after spread and commission, before the payout fee.
          pattern: "^\\d+(\\.\\d+)?$"
          examples:
          - '0.015'
        min:
          type: string
          description: Smallest deposit, in units of the coin sent.
          pattern: "^\\d+(\\.\\d+)?$"
          examples:
          - '0.015'
        max:
          type: string
          description: Largest deposit, in units of the coin sent.
          pattern: "^\\d+(\\.\\d+)?$"
          examples:
          - '0.015'
        minUsd:
          type: number
        maxUsd:
          type: number
        fromUsd:
          type: number
          description: Price of the coin sent, in US dollars.
        toUsd:
          type: number
          description: Price of the coin received, in US dollars.
        fees:
          "$ref": "#/components/schemas/FeeBreakdown"
        estimate:
          type:
          - object
          - 'null'
          properties:
            depositAmount:
              type: string
              pattern: "^\\d+(\\.\\d+)?$"
              examples:
              - '0.015'
            settleAmount:
              type: string
              description: What the visitor would receive at the current rate, network fees already taken off.
              pattern: "^\\d+(\\.\\d+)?$"
              examples:
              - '0.015'
            settleMinimum:
              type: string
              description: 'Exchange route only: the least the visitor receives. If the price moves below it before the conversion, the deposit is refunded instead.'
              pattern: "^\\d+(\\.\\d+)?$"
              examples:
              - '0.015'
          required:
          - depositAmount
          - settleAmount
        priceUpdatedAt:
          type: string
          format: date-time
        stale:
          type: boolean
          description: Prices have not updated for a while; quoting may pause.
        route:
          type: string
          description: 'wallet: paid from our own wallet, fixed or variable rate. exchange: converted on our exchange account, variable rate only, usually 10 to 60 minutes.'
          enum:
          - wallet
          - exchange
      required:
      - from
      - to
      - rate
      - min
      - max
      - minUsd
      - maxUsd
      - fromUsd
      - toUsd
      - fees
      - estimate
      - priceUpdatedAt
      - stale
      - route
    PriceHistoryResponse:
      type: object
      properties:
        from:
          type: string
          description: Coin id priced (BTC, ETH...).
        to:
          type: string
          description: Coin id it is priced in.
        range:
          type: string
          description: Range of the history.
          enum:
          - 1h
          - 1d
          - 7d
          - 30d
        points:
          type: array
          items:
            type: array
            items:
              type: number
            minItems: 2
            maxItems: 2
          description: "[time in ms, price of one `from` in `to`], oldest first. The last point is the live price."
        first:
          type: number
          description: First price in the range.
        last:
          type: number
          description: Live price.
        high:
          type: number
          description: Highest price in the range.
        low:
          type: number
          description: Lowest price in the range.
        changePct:
          type: number
          description: Change from the first price to the live one, in percent.
        source:
          type: string
          description: 'own: our price sources, saved every minute (1h, 1d). binance: the market''s hourly or 4-hourly closes (7d, 30d).'
          enum:
          - own
          - binance
        updatedAt:
          type: string
          description: When it was put together (ISO 8601).
          format: date-time
      required:
      - from
      - to
      - range
      - points
      - first
      - last
      - high
      - low
      - changePct
      - source
      - updatedAt
