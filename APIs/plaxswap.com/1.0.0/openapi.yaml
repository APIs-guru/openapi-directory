      summary: Create a payment
      description: 'Ask for a payment and send the payer to its checkoutUrl. The price can be in a fiat currency (converted when the payment is made) or in a coin. The payer pays with the coin you receive, or with another coin that Uniswap or SwapKit converts; new merchant accounts receive a Plaxswap balance credit after confirmed settlement. Legacy direct-wallet accounts retain their snapshotted destination. Send an Idempotency-Key header to make retries safe: the same key with the same body returns the same payment (200).'
