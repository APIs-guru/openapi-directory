            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '429':
          description: rate_limited.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security: []
      x-rate-limit: 30 per minute
  "/api/v1/telegram":
    get:
      operationId: getTelegramInfo
      summary: Whether the Telegram bot is set up, its links and commands
      description: Follow an order in Telegram with deepLinkBase + o_<orderId>.
      tags:
      - Service
      responses:
        '200':
          description: Bot details.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TelegramInfo"
        '429':
          description: rate_limited.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security: []
      x-rate-limit: 60 per minute
  "/api/v1/telegram/webapp":
    post:
      operationId: followOrderFromTelegramWebApp
      summary: Follow an order in the Telegram chat that opened the swap screen
      description: Called by the order page when it runs inside the Telegram Mini App. initData is the data Telegram passes to the Mini App, signed with a key made from the bot token; the user in it is the chat that will get the order's updates. Needs x-order-token, so only the order's owner can attach it to a chat.
      tags:
      - Service
      parameters:
      - name: x-order-token
        in: header
        required: true
        description: The order token returned once by POST /api/v1/orders. Only its holder can change the order.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/TelegramWebAppFollowRequest"
            example:
              initData: query_id=...&user=%7B%22id%22%3A1%7D&auth_date=1700000000&hash=...
              orderId: abcdefgh123456
      responses:
        '200':
          description: Whether the chat follows the order now.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TelegramWebAppFollowResponse"
        '400':
          description: bad_request.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          description: 'telegram_check_failed: Telegram''s signature did not match, or telegram_session_expired: the data is over a day old.'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: 'forbidden: wrong order token.'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: not_found.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '429':
          description: 'rate_limited: 30 per 10 minutes.'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '503':
          description: 'telegram_off: the bot is not set up.'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security: []
      x-rate-limit: 30 per 10 minutes
