  "/api/v1/payment-links":
    post:
      operationId: createPaymentLink
      summary: Create a payment link
      description: 'A link says "pay me exactly this amount of this coin at this address". Payers can use any supported coin through a normal fixed-rate swap. With an API key, the link belongs to you and sends payment_link.* webhooks. Keep manageToken: it is shown once.'
      tags:
      - Payment links
      parameters:
      - "$ref": "#/components/parameters/UserIp"
      - "$ref": "#/components/parameters/UserCountry"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreatePaymentLinkRequest"
            example:
              title: Invoice 1042
              settleMethodId: usdt-tron
              settleAmount: '25'
              settleAddress: TBFQ4wTTgtsK4SvFuBNVCbhHJPbWdxE9zN
              expiresIn: 7d
              payoutDestination: self_hosted
      responses:
        '201':
          description: The link, its manage token and both URLs.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CreatePaymentLinkResponse"
        '400':
          description: invalid_input, invalid_amount, amount_out_of_range, invalid_address, invalid_memo, travel_rule_required, user_ip_required, user_ip_invalid.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          description: invalid_api_key.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: address_not_allowed.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '409':
          description: coin_unavailable, rate_unavailable.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '429':
          description: 'rate_limited: 10 per minute from the website, 60 per minute with an API key.'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '451':
          description: jurisdiction_blocked.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security:
      - {}
      - partnerKey: []
      - partnerBearer: []
      x-rate-limit: 10 per minute without an API key, 60 with one
  "/api/v1/payment-links/{id}":
    get:
      operationId: getPaymentLink
      summary: A payment link (public view)
      description: No secrets and no payer details. status is the effective status, and availability says whether a payment can start now.
      tags:
      - Payment links
      parameters:
      - "$ref": "#/components/parameters/LinkId"
      responses:
        '200':
          description: The link.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PaymentLinkView"
        '404':
          description: not_found.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '429':
          description: rate_limited.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security: []
      x-rate-limit: 120 per minute
  "/api/v1/payment-links/{id}/quote":
    post:
      operationId: quotePaymentLink
      summary: What a payer would send, in the coin they choose
      description: A normal fixed-rate quote whose settleAmount is the link amount (rounding to the payer's coin can add a tiny fraction).
      tags:
      - Payment links
      parameters:
      - "$ref": "#/components/parameters/LinkId"
