            средств или другая ошибка, после которой выполнение не поставлено в очередь.'
          enum: *id007
          example: failed
        errors_info:
          type: array
          items:
            $ref: '#/components/schemas/ErrorInfo'
      required:
      - errors_info
      additionalProperties: true
      example:
        params:
          case_number: А00-1000/2026
          method: arbitr_person
          country: ru
        requestId: 00000000-0000-4000-8000-000000000003
        state: failed
        errors_info:
        - error: 'Отсутствует обязательный параметр: innfiz'
          error_code: 400
          docs_url: https://newdb.net/docs/fiz/07-arbitr_person/
    MethodResultPayload:
      type: object
      description: Результат выполнения конкретного метода. status=200 означает, что метод отработал успешно. status=500 означает
        ошибку на источнике или временную системную проблему; для таких результатов нужно ждать повторной обработки до status=200
        либо финального failed/complete состояния запроса.
      properties:
        status:
          type: integer
          enum:
          - 200
          - 500
          description: 200 — все ок; 500 — ошибка на источнике/временная ошибка, ожидается повторная попытка или последующий
            status=200.
          example: 200
        data:
          type: array
          description: Массив данных метода. Конкретные объекты зависят от params.method.
          items:
            type: object
            additionalProperties: true
        error:
          type: string
          description: Текст ошибки метода, если status=500 или источник вернул ошибку.
        meta:
          type: object
          additionalProperties: true
      required:
      - status
      - data
      additionalProperties: true
    WebhookCallbackPayload:
      allOf:
      - $ref: '#/components/schemas/AsyncEnvelope'
      description: 'Payload, который NEWDB отправляет POST-запросом на URL из параметра `webhook`, когда состояние запроса
        обновилось или результат готов. Структура совпадает с общим AsyncEnvelope: `requestId`, `state`, `results.<method>.result.status`,
        `data`, `error`/`errors_info`.'
    ComplexStepStatus:
      type: object
      description: Состояние отдельного шага комплексной проверки.
      properties:
        status:
          type: string
          description: Состояние выполнения шага.
          enum:
          - queued
          - in_progress
          - restart
          - complete
          - failed
          example: complete
        requestId:
          type: string
          format: uuid
          description: Идентификатор дочернего запроса.
      required:
      - status
      - requestId
      additionalProperties: true
    ComplexManagementRole:
      type: object
      description: Роль руководителя или учредителя в компании.
      properties:
        role:
          type: string
          description: Тип связи с компанией.
          enum:
          - director
          - founder
          example: director
        index:
          type: integer
          example: 1
        position:
          type: string
          description: Должность, если она доступна из источника.
          example: ГЕНЕРАЛЬНЫЙ ДИРЕКТОР
      required:
      - role
      additionalProperties: true
    ComplexManagementPerson:
      type: object
      description: Результаты проверок руководителя или учредителя, сгруппированные по ИНН физического лица.
      properties:
        innfiz:
          type: string
          description: ИНН физического лица.
          example: '500100732259'
        name:
          type: string
          description: ФИО руководителя или учредителя.
          example: ИВАНОВ ИВАН ИВАНОВИЧ
        roles:
          type: array
          items:
            $ref: '#/components/schemas/ComplexManagementRole'
        steps:
          type: object
          description: Состояния проверок по руководителю или учредителю. Ключ объекта совпадает с методом проверки.
          additionalProperties:
            $ref: '#/components/schemas/ComplexStepStatus'
        results:
          type: object
          description: Результаты проверок по руководителю или учредителю. Ключ объекта совпадает с методом проверки.
          additionalProperties:
            $ref: '#/components/schemas/GenericTaskResult'
      required:
      - innfiz
      - name
      - roles
      - steps
      - results
      additionalProperties: false
    ComplexByInnResults:
      type: object
      description: Результаты комплексной проверки компании. Результаты проверок руководителей и учредителей находятся в management
        по ИНН физлица.
      properties:
        management:
          type: object
          description: Руководители и учредители компании, сгруппированные по ИНН физического лица.
          additionalProperties:
            $ref: '#/components/schemas/ComplexManagementPerson'
      additionalProperties:
        $ref: '#/components/schemas/GenericTaskResult'
    ComplexByInnResponse:
      type: object
      description: Ответ комплексной проверки компании по ИНН. Шаги выполнения находятся в steps, результаты проверок — в
        results.
      properties:
        params:
          type: object
          properties:
            inn:
              type: string
              example: '7712345678'
            method:
              type: string
              enum:
              - complex_by_inn
              example: complex_by_inn
            country:
              type: string
              enum:
              - ru
              example: ru
          required:
          - inn
          - method
          - country
          additionalProperties: true
        requestId:
          type: string
          format: uuid
        datecreated:
          type: string
          example: '2026-07-11 21:53:24'
        state:
          type: string
          enum:
          - queued
          - in_progress
          - restart
          - complete
          - failed
          example: complete
        balance:
          type: integer
          example: 90000
        steps:
          type: object
          description: Состояния шагов проверки компании. Персональные проверки руководителей и учредителей находятся
            внутри results.management.<innfiz>.steps.
          additionalProperties:
            $ref: '#/components/schemas/ComplexStepStatus'
        results:
          $ref: '#/components/schemas/ComplexByInnResults'
      required:
      - params
      - requestId
      - state
      - steps
      - results
      additionalProperties: true
      example: *id001
