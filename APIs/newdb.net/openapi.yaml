openapi: 3.1.0
info:
  title: NEWDB API
  version: 1.0.0
  description: 'OpenAPI-спецификация для NEWDB API -  проверки физ. / юр. лиц , имущества.

    Основной интерфейс работает через  асинхронный метод `POST /v2`. Для синхронных запросов реализован метод  `GET - /v2/run` '
servers:
- url: https://api.newdb.net
  description: Production API host
security:
- ApiKeyAuth: []
tags:
- name: Service
  description: 'Базовые операции NEWDB API: постановка задач, получение результата, синхронный запуск и проверка баланса.'
- name: Physical Persons
  description: 'Обзор методов NEWDB для проверки физических лиц: ФССП, ФНС, паспорт, банкротство, залоги, арбитраж, ИП и специальные
    реестры.'
  externalDocs:
    url: https://newdb.net/docs/fiz/
- name: Legal Entities
  description: 'Обзор методов NEWDB для проверки юридических лиц: арбитраж, блокировки счетов, банкротство, ФССП и сведения
    ЕГРЮЛ.'
  externalDocs:
    url: https://newdb.net/docs/legal/
- name: Foreign Citizens
  description: 'Обзор методов NEWDB для проверки иностранных граждан: ВНЖ, патент, РВП, разрешение на работу и реестр контролируемых
    лиц.'
  externalDocs:
    url: https://newdb.net/docs/foreign/
- name: Justice
  description: 'Обзор методов NEWDB для работы с данными ГАС Правосудие: поиск и детализация судебных дел, участники, события
    и документы.'
  externalDocs:
    url: https://newdb.net/docs/gas/
- name: Property
  description: Обзор методов NEWDB для проверки недвижимости, транспортных средств, залогов и обременений.
  externalDocs:
    url: https://newdb.net/docs/property/
- name: Complex Methods
  description: Комплексные методы NEWDB объединяют несколько проверок по одному идентификатору и возвращают агрегированный
    результат.
  externalDocs:
    url: https://newdb.net/docs/fiz/04-complex_by_passport/
paths:
  /v2:
    post:
      tags:
      - Service
      summary: Отправить асинхронный запрос NEWDB
      description: 'Универсальная точка входа для асинхронных запросов NEWDB. Конкретный бизнес-метод выбирается по `params.method`.
        Варианты методов доступны в Request body через Schema / Examples.


        Lifecycle: POST /v2 ставит задачу в очередь и возвращает envelope со state=queued. Далее состояние отслеживается через
        повторную отправку POST-запроса на /v2 с тем же requestId.


        Если в теле запроса передан `webhook: "https://URL"`, NEWDB отправит результат POST-запросом на этот URL. Webhook
        используется как альтернативный способ получения результата без повторной отправки `POST /v2` с тем же `requestId`.'
      operationId: createAsyncRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/fssp_personRequest'
              - $ref: '#/components/schemas/passport_fnsRequest'
              - $ref: '#/components/schemas/passport_mvdRequest'
              - $ref: '#/components/schemas/complex_by_passportRequest'
              - $ref: '#/components/schemas/complex_by_innRequest'
              - $ref: '#/components/schemas/complex_by_innfizRequest'
              - $ref: '#/components/schemas/bankrot_personRequest'
              - $ref: '#/components/schemas/pledge_personRequest'
              - $ref: '#/components/schemas/arbitr_personRequest'
              - $ref: '#/components/schemas/nalog_debtRequest'
              - $ref: '#/components/schemas/elmk_registryRequest'
              - $ref: '#/components/schemas/fns_block_personRequest'
              - $ref: '#/components/schemas/egrul_ipRequest'
              - $ref: '#/components/schemas/terroristRequest'
              - $ref: '#/components/schemas/mvd_wantedRequest'
              - $ref: '#/components/schemas/inoagentRequest'
              - $ref: '#/components/schemas/foreign_vngRequest'
              - $ref: '#/components/schemas/foreign_patentRequest'
              - $ref: '#/components/schemas/foreign_rvp_stampRequest'
              - $ref: '#/components/schemas/foreign_rvp_blankRequest'
              - $ref: '#/components/schemas/foreign_rnrRequest'
              - $ref: '#/components/schemas/rklRequest'
              - $ref: '#/components/schemas/patent_mskRequest'
              - $ref: '#/components/schemas/patent_moRequest'
              - $ref: '#/components/schemas/arbitr_legalRequest'
              - $ref: '#/components/schemas/arbitr_caseRequest'
              - $ref: '#/components/schemas/fns_blockRequest'
              - $ref: '#/components/schemas/bankrot_legalRequest'
              - $ref: '#/components/schemas/egrulRequest'
              - $ref: '#/components/schemas/fssp_legalRequest'
              - $ref: '#/components/schemas/pravo_searchRequest'
              - $ref: '#/components/schemas/act_text_searchRequest'
              - $ref: '#/components/schemas/pravo_cases_detailsRequest'
              - $ref: '#/components/schemas/rosreestrRequest'
              - $ref: '#/components/schemas/pledge_propertyRequest'
              - $ref: '#/components/schemas/pledge_legalRequest'
              - $ref: '#/components/schemas/pledge_vinRequest'
              - $ref: '#/components/schemas/nspd_cadastrRequest'
              - $ref: '#/components/schemas/realty_priceRequest'
            examples:
              fssp_person:
                summary: fssp_person — Проверка ФЛ по базе ФССП
                value:
                  params:
                    firstname: Иван
                    lastname: Иванов
                    secondname: Иванович
                    dob: '1990-01-01'
                    country: ru
                    method: fssp_person
                    regioncode: 100
                  webhook: https://example.com/newdb-webhook
                  requestId: 00000000-0000-4000-8000-000000000001
              passport_fns:
                summary: passport_fns — Проверка  паспорта/ИНН через ФНС
                value:
                  params:
                    method: passport_fns
                    country: ru
                    lastname: Иванов
                    firstname: Иван
                    secondname: Иванович
                    dob: '1990-01-01'
                    seria: '1234'
                    number: '123456'
                    seriapass: '1234'
                    numberpass: '123456'
                  requestId: 00000000-0000-4000-8000-000000000002
              passport_mvd:
                summary: passport_mvd — Проверка паспорта РФ на действительность
                value:
                  params:
                    seria: '1234'
                    number: '123456'
                    method: passport_mvd
                    firstname: Иван
                    lastname: Иванов
                    country: ru
                  requestId: 00000000-0000-4000-8000-000000000003
              bankrot_person:
                summary: bankrot_person — Проверка на банкротство физлица (Федресурс)
                value:
                  params:
                    innfiz: '500100732259'
                    country: ru
                    method: bankrot_person
                  requestId: 00000000-0000-4000-8000-000000000004
              pledge_person:
                summary: pledge_person — Проверка залогов и обременений (ФНП + Федресурс)
                value:
                  params:
                    firstname: Иван
                    lastname: Иванов
                    method: pledge_person
                    country: ru
                  requestId: 00000000-0000-4000-8000-000000000001
              arbitr_person:
                summary: arbitr_person — Проверка арбитражных дел (физлица, КАД)
                value:
                  params:
                    innfiz: '500100732259'
                    country: ru
                    method: arbitr_person
                  requestId: 00000000-0000-4000-8000-000000000002
              nalog_debt:
                summary: nalog_debt — Проверка налоговой задолженности по ИНН
                value:
                  params:
                    inn: '7712345678'
                    country: ru
                    method: nalog_debt
                  requestId: 00000000-0000-4000-8000-000000000003
              elmk_registry:
                summary: elmk_registry — Проверка статуса электронной медицинской книжки
                value:
                  params:
                    elmk_number: 00-00-000000-00
                    snils: 123-456-789 00
                    country: ru
                    method: elmk_registry
                  webhook: https://example.com/newdb-webhook
                  requestId: 00000000-0000-4000-8000-000000000004
              fns_block_person:
                summary: fns_block_person — Проверка блокировок счетов физлица (ФНС)
                value:
                  params:
                    innfiz: '500100732259'
                    method: fns_block_person
                    country: ru
                  requestId: 00000000-0000-4000-8000-000000000001
              egrul_ip:
                summary: egrul_ip — Проверка статуса ИП / сведений ЕГРИП
                value:
                  params:
                    innfiz: '500100732259'
                    country: ru
                    method: egrul_ip
                  webhook: https://example.com/newdb-webhook
                  requestId: 00000000-0000-4000-8000-000000000002
              terrorist:
                summary: terrorist — Проверка на причастность к терроризму и распространению ОМУ
                value:
                  params:
                    firstname: Иван
                    lastname: Иванов
                    secondname: Иванович
                    dob: '1990-01-01'
                    method: terrorist
                    country: ru
                  requestId: 00000000-0000-4000-8000-000000000003
              mvd_wanted:
                summary: mvd_wanted — Проверка физлица в розыске МВД
                value:
                  params:
                    method: mvd_wanted
                    lastname: Иванов
                    firstname: Иван
                    secondname: Иванович
                    dob: '1990-01-01'
                    email: client@example.com
                  requestId: 00000000-0000-4000-8000-000000000101
              inoagent:
                summary: inoagent — Проверка физлица в реестре иностранных агентов
                value:
                  params:
                    method: inoagent
                    lastname: Иванов
                    firstname: Иван
                    secondname: Иванович
                  requestId: 00000000-0000-4000-8000-000000000201
              foreign_vng:
                summary: foreign_vng — Вид на жительство (ВНЖ)
                value:
                  params:
                    method: foreign_vng
                    doctype: vng
                    firstname: Иван
                    lastname: Иванов
                    doc_seria: AB
                    doc_number: '7654321'
                    id_doc_seria: FA
                    id_doc_number: '1234567'
                    blank_seria: AA
                    blank_number: '1122334'
                    dob: '1990-01-01'
                    country: ru
                  requestId: 00000000-0000-4000-8000-000000000004
              foreign_patent:
                summary: foreign_patent — Патент
                value:
                  params:
                    method: foreign_patent
                    doctype: patent
                    firstname: Иван
                    lastname: Иванов
                    secondname: Иванович
                    doc_seria: AB
                    doc_number: '7654321'
                    id_doc_seria: FA
                    id_doc_number: '1234567'
                    blank_seria: AA
                    blank_number: '1122334'
                    dob: '1990-01-01'
                    country: ru
                  requestId: 00000000-0000-4000-8000-000000000001
              foreign_rvp_stamp:
                summary: foreign_rvp_stamp — РВП (штамп в паспорте)
                value:
                  params:
                    method: foreign_rvp_stamp
                    doctype: rvp_stamp
                    firstname: Иван
                    lastname: Иванов
                    issue_date: '2025-01-01'
                    id_doc_seria: FA
                    id_doc_number: '1234567'
                    country: ru
                  requestId: 00000000-0000-4000-8000-000000000002
              foreign_rvp_blank:
                summary: foreign_rvp_blank — РВП (бланк)
                value:
                  params:
                    method: foreign_rvp_blank
                    doctype: rvp_blank
                    firstname: Иван
                    lastname: Иванов
                    secondname: Иванович
                    doc_seria: AB
                    doc_number: '7654321'
                    id_doc_seria: FA
                    id_doc_number: '1234567'
                    dob: '1990-01-01'
                    country: ru
                  requestId: 00000000-0000-4000-8000-000000000003
              foreign_rnr:
                summary: foreign_rnr — Разрешение на работу (РНР)
                value:
                  params:
                    method: foreign_rnr
                    doctype: rnr
                    doc_seria: AB
                    doc_number: '7654321'
                    id_doc_seria: FA
                    id_doc_number: '1234567'
                    blank_seria: AA
                    blank_number: '1122334'
                    country: ru
                  requestId: 00000000-0000-4000-8000-000000000004
              rkl:
                summary: rkl — Проверка по реестру контролируемых лиц
                value:
                  params:
                    method: rkl
                    country: ru
                    lastname: Иванов
                    firstname: Иван
                    secondname: Иванович
                    dob_info: '1990-01-01'
                    issue_date: '1990-01-01'
                    id_doc_seria: FA
                    id_doc_number: '1234567'
                  requestId: 00000000-0000-4000-8000-000000000001
              patent_msk:
                summary: patent_msk — Патент (Москва)
                value:
                  params:
                    method: patent_msk
                    id_doc_seria: FA
                    id_doc_number: '1234567'
                    citizenship: Узбекистан
                    country: ru
                  requestId: 00000000-0000-4000-8000-000000000002
              patent_mo:
                summary: patent_mo — Патент (Московская область)
                value:
                  params:
                    method: patent_mo
                    innfiz: '500100732259'
                    dob: '1990-01-01'
                    country: ru
                  requestId: 00000000-0000-4000-8000-000000000003
              arbitr_legal:
                summary: arbitr_legal — Проверка арбитражных дел (юрлица, КАД)
                value:
                  params:
                    inn: '7712345678'
                    country: ru
                    method: arbitr_legal
                  requestId: 00000000-0000-4000-8000-000000000004
              fns_block:
                summary: fns_block — Проверка блокировок счетов юрлица (ФНС)
                value:
                  params:
                    inn: '7712345678'
                    country: ru
                    method: fns_block
                  webhook: https://example.com/newdb-webhook
                  requestId: 00000000-0000-4000-8000-000000000001
              bankrot_legal:
                summary: bankrot_legal — Проверка на банкротство юрлица (Федресурс)
                value:
                  params:
                    inn: '7712345678'
                    country: ru
                    method: bankrot_legal
                  requestId: 00000000-0000-4000-8000-000000000002
              egrul:
                summary: egrul — Сведения ЕГРЮЛ / Прозрачный бизнес
                value:
                  params:
                    inn: '7712345678'
                    method: egrul
                    country: ru
                  requestId: 00000000-0000-4000-8000-000000000003
              fssp_legal:
                summary: fssp_legal — Исполнительные производства ФССП по ИНН юрлица
                value:
                  params:
                    method: fssp_legal
                    inn: '7712345678'
                  webhook: https://example.com/newdb-webhook
                  requestId: 00000000-0000-4000-8000-000000000004
              pravo_search:
                summary: pravo_search — Поиск судебных дел
                value:
                  params:
                    query: Иванов
                    country: ru
                    method: pravo_search
                  requestId: 00000000-0000-4000-8000-000000000001
              act_text_search:
                summary: act_text_search — Поиск судебных дел по текстам актов
                value:
                  params:
                    act_text: <act_text>
                    country: ru
                    method: act_text_search
                  requestId: 00000000-0000-4000-8000-000000000002
              pravo_cases_details:
                summary: pravo_cases_details — Получение деталей дела по NewdbID
                value:
                  params:
                    case_id: '1145323'
                    country: ru
                    method: pravo_cases_details
                  requestId: 00000000-0000-4000-8000-000000000003
              rosreestr:
                summary: rosreestr — Проверка объекта недвижимости (Росреестр)
                value:
                  params:
                    address: Одинцово Белорусская д.3 кв. 382
                    method: rosreestr
                    country: ru
                  webhook: https://example.com/newdb-webhook
                  requestId: 00000000-0000-4000-8000-000000000004
              pledge_property:
                summary: pledge_property — Проверка залога и обременений по ID (ФНП + Федресурс)
                value:
                  params:
                    propertyid: <propertyid>
                    method: pledge_property
                    country: ru
                  requestId: 00000000-0000-4000-8000-000000000001
              pledge_vin:
                summary: pledge_vin — Проверка залога и обременений по VIN (ФНП + Федресурс)
                value:
                  params:
                    vin: <vin>
                    method: pledge_vin
                    country: ru
                  requestId: 00000000-0000-4000-8000-000000000002
              nspd_cadastr:
                summary: nspd_cadastr — Получение геоданных по кадастровому номеру
                value:
                  requestId: 00000000-0000-4000-8000-000000000003
                  taskId: nspd-cadastr-local-test-001
                  params:
                    method: nspd_cadastr
                    cad_num: 77:01:0000000:1000
              realty_price:
                summary: realty_price — Оценка стоимости недвижимости
                value:
                  requestId: 00000000-0000-4000-8000-000000000004
                  taskId: nspd-cadastr-local-test-001
                  params:
                    method: realty_price
                    address: Одинцово ул.  Белорусская д.3 кв. 382
                    valuation_type: sale
              arbitr_case:
                summary: arbitr_case — Детали арбитражного дела по номеру дела
                value: &id002
                  params:
                    case_number: А00-1000/2026
                    country: ru
                    method: arbitr_case
                  requestId: 00000000-0000-4000-8000-000000000001
              pledge_legal:
                summary: pledge_legal — Проверка залогов и обременений юрлица
                value: &id003
                  params:
                    inn: '7712345678'
                    country: ru
                    method: pledge_legal
                  requestId: 00000000-0000-4000-8000-000000000003
              complex_by_passport:
                summary: complex_by_passport — Комплексная проверка по паспорту
                value: &id004
                  params:
                    seria: '1234'
                    number: '123456'
                    firstname: Иван
                    lastname: Иванов
                    secondname: Иванович
                    dob: '1990-01-01'
                    regioncode: '77'
                    country: ru
                    method: complex_by_passport
                  requestId: 00000000-0000-4000-8000-000000000001
              complex_by_inn:
                summary: complex_by_inn — Комплексная проверка компании по ИНН
                value: &id005
                  params:
                    inn: '7712345678'
                    country: ru
                    method: complex_by_inn
                  requestId: 00000000-0000-4000-8000-000000000003
              complex_by_innfiz:
                summary: complex_by_innfiz — Комплексная проверка физлица или ИП по ИНН
                value: &id006
                  params:
                    innfiz: '500100732259'
                    country: ru
                    method: complex_by_innfiz
                  requestId: 00000000-0000-4000-8000-000000000001
      responses:
        '200':
          description: Запрос принят и поставлен в очередь. Обычно state=queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncEnvelope'
              examples:
                queued:
                  summary: Запрос поставлен в очередь
                  value:
                    requestId: 00000000-0000-4000-8000-000000000002
                    state: queued
                    params:
                      method: passport_mvd
                      country: ru
        '400':
          description: 'Некорректный запрос: ошибка в параметрах или отсутствует обязательное поле.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsInfoResponse'
        '402':
          description: Недостаточно средств на счете. Запрос не поставлен в очередь.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsInfoResponse'
        '500':
          description: Системная ошибка сервиса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsInfoResponse'
      callbacks:
        requestResultWebhook:
          '{$request.body#/webhook}':
            post:
              summary: Получение результата через webhook
              description: 'Callback на URL клиента, переданный в корневом поле запроса `webhook`. Пример параметра в POST
                /v2: `webhook: https://URL`. NEWDB отправляет на этот URL общий response envelope с requestId, state и results.'
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/WebhookCallbackPayload'
                    examples:
                      complete:
                        summary: Результат готов
                        value:
                          requestId: 00000000-0000-4000-8000-000000000001
                          state: complete
                          params:
                            method: passport_mvd
                            country: ru
                          results:
                            passport_mvd:
                              result:
                                status: 200
                                data: []
                      failed:
                        summary: Ошибка запроса
                        value:
                          requestId: 00000000-0000-4000-8000-000000000002
                          state: failed
                          errors_info:
                          - error: 'Отсутствует обязательный параметр: innfiz'
                            error_code: 400
                            docs_url: https://newdb.net/docs/fiz/07-arbitr_person/
              responses:
                '200':
                  description: Webhook принят клиентским endpoint.
                '400':
                  description: Клиентский endpoint отклонил webhook.
                '500':
                  description: Ошибка на стороне клиентского webhook endpoint.
  /v2/data:
    get:
      tags:
      - Service
      summary: Получить результат по requestId
      operationId: getRequestData
      security:
      - QueryToken: []
      parameters:
      - in: query
        name: requestId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Текущее состояние запроса и, при state=complete, результаты методов.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncEnvelope'
        '400':
          description: Некорректный requestId или параметры запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsInfoResponse'
        '500':
          description: Системная ошибка сервиса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsInfoResponse'
      description: Возвращает текущее состояние асинхронного запроса. state=queued — задача в очереди; in_progress — выполняется;
        restart — идет повторная попытка; complete — запрос отработал; failed — запрос некорректен, не оплачен или завершился
        ошибкой.
  /v2/run:
    get:
      tags:
      - Service
      summary: Синхронный запуск метода с ожиданием результата
      description: 'Синхронный запуск метода. Помимо перечисленных параметров принимает метод-специфичные query-поля в зависимости
        от `method`, например `seria`, `number`, `inn`, `innfiz`, `query`, `act_text` и другие.


        Метод может удерживать соединение до готового результата или вернуть timeout.'
      operationId: runSyncMethod
      security:
      - QueryToken: []
      parameters:
      - in: query
        name: method
        required: true
        schema:
          type: string
          enum:
          - fssp_person
          - passport_fns
          - passport_mvd
          - bankrot_person
          - pledge_person
          - arbitr_person
          - nalog_debt
          - elmk_registry
