        name: requestId
        required: false
        schema:
          type: string
          format: uuid
        description: Используется для повторного запроса результата ранее созданной задачи.
      - in: query
        name: timeout
        required: false
        schema:
          type: integer
          minimum: 1
          example: 60
        description: Максимальное время ожидания готового результата в секундах.
      - in: query
        name: inn
        required: false
        schema:
          type: string
          example: '7700000000'
        description: ИНН юридического лица или индивидуального предпринимателя.
      - in: query
        name: innfiz
        required: false
        schema:
          type: string
          example: '770000000000'
        description: ИНН физического лица.
      - in: query
        name: seria
        required: false
        schema:
          type: string
          example: '4500'
        description: Серия документа, если она требуется выбранному методу.
      - in: query
        name: number
        required: false
        schema:
          type: string
          example: '000000'
        description: Номер документа, если он требуется выбранному методу.
      - in: query
        name: firstname
        required: false
        schema:
          type: string
          example: Иван
        description: Имя физического лица.
      - in: query
        name: lastname
        required: false
        schema:
          type: string
          example: Иванов
        description: Фамилия физического лица.
      - in: query
        name: secondname
        required: false
        schema:
          type: string
          example: Иванович
        description: Отчество физического лица.
      - in: query
        name: dob
        required: false
        schema:
          type: string
          example: '1980-01-01'
        description: Дата рождения в формате, который ожидает выбранный метод.
      - in: query
        name: regioncode
        required: false
        schema:
          type: string
          example: '77'
        description: Код региона для методов, где поиск ограничивается регионом. Для fssp_person значение 100 означает поиск по всем регионам ФССП.
      - in: query
        name: query
        required: false
        schema:
          type: string
          example: ООО Ромашка
        description: Поисковая строка для методов, которые выполняют поиск по названию, ФИО, адресу или другому тексту.
      - in: query
        name: act_text
        required: false
        schema:
          type: string
          example: взыскание задолженности
        description: Текст для поиска по судебным актам.
      - in: query
        name: case_number
        required: false
        schema:
          type: string
          example: А40-00000/2026
        description: Номер судебного дела.
      - in: query
        name: case_id
        required: false
        schema:
          type: string
          example: 00000000-0000-4000-8000-000000000001
        description: Идентификатор судебного дела в источнике.
      - in: query
        name: cad_num
        required: false
        schema:
          type: string
          example: 77:01:0000000:0000
        description: Кадастровый номер объекта недвижимости.
      - in: query
        name: address
        required: false
        schema:
          type: string
          example: г. Москва, ул. Примерная, д. 1
        description: Адрес объекта или участника проверки.
      - in: query
        name: propertyid
        required: false
        schema:
          type: string
          example: 77:01:0000000:0000
        description: Идентификатор объекта имущества, если он требуется выбранному методу.
      - in: query
        name: vin
        required: false
        schema:
          type: string
          example: X0000000000000000
        description: VIN транспортного средства.
      - in: query
        name: doctype
        required: false
        schema:
          type: string
          example: passport
        description: Тип документа для методов проверки иностранных граждан.
      - in: query
        name: doc_seria
        required: false
        schema:
          type: string
          example: '0000'
        description: Серия документа для методов проверки иностранных граждан.
      - in: query
        name: doc_number
        required: false
        schema:
          type: string
          example: '000000'
        description: Номер документа для методов проверки иностранных граждан.
      - in: query
        name: citizenship
        required: false
        schema:
          type: string
          example: UZB
        description: Гражданство для методов проверки иностранных граждан.
