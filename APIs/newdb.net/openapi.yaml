components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
    QueryToken:
      type: apiKey
      in: query
      name: token
  schemas:
    GenericTaskResult:
      type: object
      description: Контейнер результата одного метода внутри results.<method>.
      properties:
        taskId:
          type: string
          format: uuid
        dateupdated:
          type: string
        result:
          $ref: '#/components/schemas/MethodResultPayload'
      required:
      - result
      additionalProperties: true
    AsyncEnvelope:
      type: object
      description: Общий envelope асинхронного API. POST /v2 возвращает queued envelope. Для получения текущего состояния
        или готового результата повторно отправьте POST-запрос на /v2 с тем же requestId.
      properties:
        params:
          type: object
          additionalProperties: true
        requestId: 00000000-0000-4000-8000-000000000003
        datecreated:
          type: string
        state:
          type: string
          description: 'Lifecycle state запроса: queued — запрос принят и находится в очереди; in_progress — запрос выполняется;
            restart — идет повторная попытка после неудачи; complete — запрос отработал; failed — некорректный запрос, отсутствие
            средств или другая ошибка, после которой выполнение не поставлено в очередь.'
          enum: &id007
          - queued
          - in_progress
          - restart
          - complete
          - failed
          example: queued
        balance:
          type: integer
        tasks:
          type: integer
        is_repeat:
          type: boolean
        error:
          type: string
        errors_info:
          type: array
          items:
            $ref: '#/components/schemas/ErrorInfo'
        results:
          type: object
          description: Ключи объекта совпадают с названиями методов, например results.passport_mvd.
          additionalProperties:
            $ref: '#/components/schemas/GenericTaskResult'
      required:
      - requestId
      - state
      additionalProperties: true
      examples:
      - requestId: 00000000-0000-4000-8000-000000000004
        state: queued
        params:
          method: passport_mvd
          country: ru
      - requestId: 00000000-0000-4000-8000-000000000001
        state: complete
        results:
          passport_mvd:
            result:
              status: 200
              data: []
      - *id001
    RunCompleteResponse:
      type: object
      description: Ответ синхронного /v2/run, когда запрос дождался финального результата.
      properties:
        requestId: 00000000-0000-4000-8000-000000000002
        state:
          type: string
          enum:
          - complete
          example: complete
        results:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/GenericTaskResult'
      required:
      - requestId
      - state
      - results
      additionalProperties: true
    RunTimeoutResponse:
      type: object
      description: Ответ /v2/run, если синхронное ожидание превысило таймаут.
      properties:
        requestId: 00000000-0000-4000-8000-000000000003
        state:
          type: string
          enum:
          - timeout
          example: timeout
        error:
          type: string
          example: Task execution timeout
      required:
      - requestId
      - state
      - error
      additionalProperties: true
    BalanceResponse:
      type: object
      properties:
        token:
          type: string
          format: uuid
