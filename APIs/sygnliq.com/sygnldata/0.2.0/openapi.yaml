        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/potus/events/15m:
    get:
      summary: Potus Events 15M
      description: Identical payload, nothing newer than 15 minutes.
      operationId: potus_events_15m_v1_potus_events_15m_get
      parameters:
      - name: since
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: ISO-8601 lower bound on ts_utc; narrows only
          title: Since
        description: ISO-8601 lower bound on ts_utc; narrows only
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/potus/archive:
    get:
      summary: Potus Archive
      description: Identical payload, T+24h and older. Cheapest rung.
      operationId: potus_archive_v1_potus_archive_get
      parameters:
      - name: since
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: ISO-8601 lower bound on ts_utc; narrows only
          title: Since
        description: ISO-8601 lower bound on ts_utc; narrows only
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      responses:
