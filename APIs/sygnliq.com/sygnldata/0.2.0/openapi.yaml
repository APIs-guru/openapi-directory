        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /v1/potus/feeds:
    get:
      summary: Potus Feeds
      description: Measured connect-buffer depth and source health across live news feeds.
      operationId: potus_feeds_v1_potus_feeds_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /v1/potus/event/{event_id}:
    get:
      summary: Potus Event
      description: Full detail for one event, at live-tier recency and live-tier price.
      operationId: potus_event_v1_potus_event__event_id__get
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
          title: Event Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/trade/preflight:
    post:
      summary: Trade Preflight
      description: 'Pre-trade decision gate: ALLOW/REDUCE/REQUIRE_CONFIRMATION/BLOCK + signed attestation.'
      operationId: trade_preflight_v1_trade_preflight_post
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
              title: Body
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/trade/preflight/demo:
    post:
      summary: Trade Preflight Demo
      description: Free demo of the preflight gate (rate limited) — same engine, marked demo.
      operationId: trade_preflight_demo_v1_trade_preflight_demo_post
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
              title: Body
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/trade/preflight/signer:
    get:
      summary: Preflight Signer
      description: Attestation signer address — pin this to verify preflight signatures.
      operationId: preflight_signer_v1_trade_preflight_signer_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /v1/audit:
    post:
      summary: Audit
      operationId: audit_v1_audit_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_audit_v1_audit_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    Body_audit_v1_audit_post:
      properties:
        file:
          anyOf:
          - type: string
            contentMediaType: application/octet-stream
          - type: 'null'
          title: File
        preset:
          type: string
          title: Preset
          default: large_cap
        n_trials:
          type: integer
          title: N Trials
          default: 10
        extra_bps:
          type: number
          title: Extra Bps
          default: 0.0
      type: object
      title: Body_audit_v1_audit_post
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
servers:
- url: https://47.sygnliq.com
externalDocs:
  description: API Documentation and agent integration files
  url: https://47.sygnliq.com
