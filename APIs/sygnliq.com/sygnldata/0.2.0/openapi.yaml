                type: string
  /sitemap.xml:
    get:
      summary: Sitemap
      operationId: sitemap_sitemap_xml_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /{key}.txt:
    get:
      summary: Indexnow Key
      operationId: indexnow_key__key__txt_get
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          title: Key
      responses:
        '200':
          description: Successful Response
          content:
            text/plain:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/regime/sample:
    get:
      summary: Regime Sample
      operationId: regime_sample_v1_regime_sample_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /v1/stats:
    get:
