      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /v1/regime/current:
    get:
      summary: Regime Current
      operationId: regime_current_v1_regime_current_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /v1/regime/history:
    get:
      summary: Regime History
      operationId: regime_history_v1_regime_history_get
      parameters:
      - name: start
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: ISO timestamp lower bound
          title: Start
        description: ISO timestamp lower bound
      - name: end
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: ISO timestamp upper bound
          title: End
        description: ISO timestamp upper bound
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 10000
          default: 1000
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/cost/estimate:
    post:
      summary: Cost Estimate
      operationId: cost_estimate_v1_cost_estimate_post
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
              title: Body
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
