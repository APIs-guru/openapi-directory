  /api/check_bulk:
    post:
      tags:
      - verticals-v2
      summary: Check Bulk
      description: "Pre-flight existence + risk check for up to 100 (ecosystem, package)\
        \ pairs.\n\nDB-only: no live registry fetch. Returns a status per item:\n\
        \  - `stdlib`:             language builtin (no install needed)\n  - `malicious`:\
        \          actively flagged by OSV/OpenSSF\n  - `typosquat_suspect`:  matches\
        \ a typosquat pattern (pre-computed or runtime)\n  - `historical_incident`:\
        \ previously compromised (check current version)\n  - `exists`:          \
        \   known safe in our index\n  - `unknown`:            not in our index —\
        \ caller may fall back to /api/check\nTypical latency: <100ms for 100 items."
      operationId: check_bulk_api_check_bulk_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_BulkRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Check Bulk Api Check Bulk Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/install/{ecosystem}/{package}:
    get:
      tags:
      - verticals-v2
      summary: Install Command
      description: 'Canonical install commands for ecosystem+package across common
        tools.


        Saves agents 100-200 tokens of "how do I install this" reasoning and

        prevents syntax hallucinations (pnpm flags, pyproject.toml quoting,

        Maven XML structure).


        If `version` is omitted, DepScope resolves the latest from its index.'
      operationId: install_command_api_install__ecosystem___package__get
      parameters:
      - name: ecosystem
        in: path
        required: true
        schema:
          type: string
          title: Ecosystem
      - name: package
        in: path
        required: true
        schema:
          type: string
          title: Package
      - name: version
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Version
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Install Command Api Install  Ecosystem   Package  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/pin_safe/{ecosystem}/{package}:
    get:
      tags:
      - verticals-v2
      summary: Pin Safe
      description: 'Return the highest version whose known CVEs are below the given
        severity.


        - `min_severity=high` (default) excludes versions with any critical or high
        CVE.

        - `constraint` accepts npm-style `^X.Y.Z`, `~X.Y.Z`, `>=X`, or exact `X.Y.Z`.

        - `include_prerelease=false` (default) skips alpha/beta/rc/canary/nightly.

        - `limit_checked` caps how many versions we walk through (newest-first).


        Sources: versions table → packages.data_json.versions → live registry.'
      operationId: pin_safe_api_pin_safe__ecosystem___package__get
      parameters:
      - name: ecosystem
        in: path
        required: true
        schema:
          type: string
          title: Ecosystem
      - name: package
        in: path
        required: true
        schema:
          type: string
          title: Package
      - name: min_severity
        in: query
        required: false
        schema:
          type: string
          default: high
          title: Min Severity
      - name: constraint
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Constraint
      - name: limit_checked
        in: query
        required: false
        schema:
          type: integer
          default: 50
          title: Limit Checked
      - name: include_prerelease
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Prerelease
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Pin Safe Api Pin Safe  Ecosystem   Package  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
