components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    _AnomalyRequest:
      properties:
        tool_called:
          type: string
          title: Tool Called
        ecosystem:
          type: string
          title: Ecosystem
          default: ''
        package:
          type: string
          title: Package
          default: ''
        version:
          type: string
          title: Version
          default: ''
        observed:
          type: string
          title: Observed
        expected:
          type: string
          title: Expected
        evidence_url:
          type: string
          title: Evidence Url
          default: ''
        source:
          type: string
          title: Source
          default: mcp
      type: object
      required:
      - tool_called
      - observed
      - expected
      title: _AnomalyRequest
    _BulkItem:
      properties:
        ecosystem:
          type: string
          title: Ecosystem
        package:
          type: string
          title: Package
      type: object
      required:
      - ecosystem
      - package
      title: _BulkItem
    _BulkRequest:
      properties:
        items:
          items:
            $ref: '#/components/schemas/_BulkItem'
          type: array
          title: Items
      type: object
      required:
      - items
      title: _BulkRequest
    _ContactRequest:
      properties:
        name:
          type: string
          title: Name
          default: ''
        email:
          type: string
          title: Email
        type:
          type: string
          title: Type
          default: other
        subject:
          type: string
          title: Subject
        body:
          type: string
          title: Body
        company:
          type: string
          title: Company
          default: ''
        source:
          type: string
          title: Source
          default: web
        consent:
          type: boolean
          title: Consent
          default: true
        honeypot:
          type: string
          title: Honeypot
          default: ''
      type: object
      required:
      - email
      - subject
      - body
      title: _ContactRequest
    _StackRequest:
      properties:
        packages:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Packages
        format:
          type: string
          title: Format
          default: text
      type: object
      required:
      - packages
      title: _StackRequest
tags:
- name: packages
  description: 'Core package intelligence: health score, vulnerabilities, recommendations,
    alternatives, comparisons, batch scan, version metadata, dependency tree. These
    are the endpoints AI agents call before suggesting any `npm install` / `pip install`
    / `cargo add`.'
- name: errors
  description: Error -> fix database. POST a stack trace, get solutions back. Full-text
    error search by message or stable hash.
- name: compat
  description: Stack compatibility matrix. Verify a set of `pkg@version` pins work
    together (e.g. `next@16,react@19,prisma@6`) before upgrading.
- name: discover
  description: Trending packages per ecosystem, typosquats, malicious advisories,
    trust signals. Use these to surface or avoid packages.
- name: verticals
  description: Breaking changes (v1->v2 with migration hints) and non-CVE known bugs
    per version.
- name: discovery
  description: 'Well-known files for AI agents: /openapi.json, /ai-plugin.json, /mcp.json,
    /llms.txt, /llms-full.txt, /security.txt, /sitemap.xml, /robots.txt.'
- name: auth
  description: Optional API keys for higher rate limits + usage analytics. No auth
    required for public endpoints.
