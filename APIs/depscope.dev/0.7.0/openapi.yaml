openapi: 3.1.0
info:
  title: DepScope — Package Intelligence API
  summary: Free, open API that tells AI agents if a package is safe, maintained, and
    up-to-date before they suggest installing it.
  description: "# DepScope\n\nPackage Intelligence for AI coding agents. **31,000+\
    \ packages** across **17 ecosystems** (npm, PyPI, Cargo, Go, Maven, NuGet, RubyGems,\
    \ Composer, Pub, Hex, Swift, CocoaPods, CPAN, Hackage, CRAN, Conda, Homebrew),\
    \ **2,200+ CVEs** enriched with CISA KEV + EPSS. Three verticals on one shared\
    \ infrastructure:\n\n1. **Package health** — /api/check for full report, /api/prompt\
    \ for LLM-optimized text (~74% smaller), /api/alternatives for replacements, /api/scan\
    \ to audit a lockfile.\n2. **Error -> fix database** — POST a stack trace to /api/error/resolve.\n\
    3. **Stack compatibility matrix** — /api/compat?stack=next@16,react@19.\n\n##\
    \ Quick start (for agents)\n\n    curl https://depscope.dev/api/prompt/npm/react\n\
    \n## MCP server\n\nZero-install remote URL: `https://mcp.depscope.dev/mcp`. 22\
    \ tools. Install in one line: `claude mcp add depscope https://mcp.depscope.dev/mcp`.\n\
    \n## Rate limits\n\n100 req/min anonymous, 200/min for whitelisted AI UAs (ClaudeBot,\
    \ GPTBot, Cursor, MCP-Client, …). Optional API keys for higher limits.\n\nSave\
    \ tokens, save energy, ship safer code."
  termsOfService: https://depscope.dev/terms
  contact:
    name: DepScope support
    url: https://depscope.dev/
    email: depscope@cuttalo.com
  license:
    name: MIT
    identifier: MIT
    url: https://github.com/cuttalo/depscope/blob/main/LICENSE
  version: 0.7.0
  x-apisguru-categories:
  - developer_tools
  - security
  x-logo:
    url: https://depscope.dev/logo.png
    backgroundColor: '#060f11'
  x-origin:
  - format: openapi
    version: '3.1'
    url: https://depscope.dev/openapi.json
  x-providerName: depscope.dev
servers:
- url: https://depscope.dev
  description: Production
- url: https://stage.depscope.dev
  description: Staging
