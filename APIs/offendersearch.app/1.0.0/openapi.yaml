openapi: 3.1.0
info:
  title: Offendersearch API
  version: 1.0.0
  description: "National sex-offender search across all US states and territories, unified behind one\
    \ API. Synchronous by default (call and wait) for interactive use; an asynchronous mode returns a\
    \ job handle and is built for batch and high-volume work. Full offenders.io field parity plus scored\
    \ matches, per-source provenance, freshness options, DOB/age match-state fidelity, and a consolidated\
    \ verification-report PDF (`POST /v1/report`) with a source citation on every record. Criminal records\
    \ land later as an additive `recordType` — the contract does not change.\n\n## Authentication\nMost\
    \ customer endpoints authenticate with an API key sent in the `X-API-Key` header (`ApiKeyAuth`). The\
    \ primary synchronous search additionally accepts a signed **session token** (`Authorization: Bearer\
    \ <token>`) so the dashboard console can run searches on behalf of a signed-in user. The offenders.io\
    \ compatibility endpoint accepts the key three ways for drop-in parity: `X-API-Key`, `Authorization:\
    \ Bearer <key>`, or `?key=<key>`. Account/dashboard endpoints (`/v1/account`, `/v1/keys`, `/v1/usage`,\
    \ ...) require a session token. Internal ops endpoints require the separate `X-Admin-Key` credential.\n\
    \n## Freshness & billing\n`freshness` is a per-request parameter with two values — `daily` (the DEFAULT\
    \ when omitted) and `weekly`.\n\n* **`daily`** is the freshest data we publish. Our sweep of every\
    \ registry runs\n  on a daily cycle, so a `daily` answer is assembled from the newest snapshot we\n\
    \  hold of each one — in practice, almost real time. Ask for it when currency is\n  the point. It\
    \ bills the **+$0.01/call daily-freshness surcharge** on top of the\n  base per-call rate (admin-overridable\
    \ per customer).\n* **`weekly`** is also fresh. Identity is essentially identical to `daily` — the\n\
    \  same people, names, aliases, offenses, addresses and photos — and what can lag\n  is only the most\
    \ recent movement, a registration or an address change from the\n  last day or so. Right for bulk\
    \ screening and periodic re-screens. **No\n  surcharge.**\n\n\n**`freshness` describes the answer;\
    \ it does not filter it.** No registry is ever withheld from a result because of when it was last\
    \ swept: every registry covering the query contributes, from the newest snapshot we hold of it. `status`\
    \ never becomes `partial` for a snapshot age, and `warnings[]` never carries a staleness sentence.\n\
    \n**★ EVERY DATE IS ISO-8601 — BREAKING CHANGE, 2026-08-04.** Every date-shaped field in a record\
    \ now comes back as ISO-8601: `dob`, the four `offense.*Date` fields, and the five `stateData` date\
    \ fields. They used to be the registry's own string passed through byte-for-byte, so a single response\
    \ could carry `\"2003-03-31\"`, `\"10/11/1988\"`, `\"11-29-1987\"` and `\"Aug. 10, 1987\"` in the\
    \ same key — `offense.offenseDate` was ISO on only 45.4% of its populated values, in seven distinct\
    \ shapes. **If you wrote a lenient parser or a per-state format table, you can delete it; if you compared\
    \ these values as raw strings, or stored them in a text column and matched on it, those comparisons\
    \ will change once.**\nThree rules govern the new values, and the third is the one to read carefully:\n\
    1. A full date is `YYYY-MM-DD`. 2. **A partial date stays partial.** A registry that publishes only\
    \ a month or\n   only a year yields `YYYY-MM` or `YYYY` — we never invent a day. The companion\n \
    \  `datePrecision` object on `offense` and `stateData` names the precision\n   explicitly, exactly\
    \ as `dobPrecision` has always done for `dob`.\n3. **Nothing is discarded.** A value we cannot read\
    \ as a date — a crime\n   description in an offence-date cell, a `registrationEnds` of \"Life\" —\
    \ is NOT\n   served as a fake date and NOT silently blanked. The field is `\"\"`, the\n   precision\
    \ is `unparseable`, and the registry's literal text is preserved in\n   the `datesAsPublished` object\
    \ beside it.\n\n`source.scrapedAt` / `.lastCheckedAt` / `.sourceUpdatedAt` were already ISO-8601 timestamps\
    \ and are unchanged. `dob` was already `YYYY-MM-DD` and is unchanged.\n\n**There is no date FILTER\
    \ on the offense or stateData dates.** `dob` is the one date you can narrow a query on; read the rest\
    \ off the record.\n**Provenance is never traded for normalisation.** The registry's own text is kept\
    \ beside the normalised value, not overwritten by it, which is why `datesAsPublished` still carries\
    \ what the source actually printed — including the 38,818 `registrationEnds` cells that hold a registration\
    \ DURATION (\"15 Years\", \"Lifetime\") rather than a date.\n\n**Where currency is published — and\
    \ where it is not.** Per record, `record.source.scrapedAt` is the moment we ingested the snapshot\
    \ that record came from. Per registry, `GET /v1/sources` publishes `health.lastSuccessAt` and `health.ageSeconds`\
    \ live and without an API key. Both are things you ask for. Neither is attached to a search answer:\
    \ `sourceStatus[]` carries no age fields, because an answer that contains every matching record does\
    \ not need a caveat about our sweep schedule.\n\n★ **Freshness and completeness are different questions,\
    \ and only one of them makes an empty result unsafe.** `freshness` says how OLD an answer is; it says\
    \ nothing about whether the answer is WHOLE. A registry swept ten minutes ago can still fail to be\
    \ searched to the end — a deadline, or a candidate set larger than one search may examine — and then\
    \ a `0` from it means UNKNOWN, not NO MATCH. That is `counts.sourcesIncomplete` / `sourceStatus[].incomplete`,\
    \ it is unrelated to freshness, and it is the one signal that must never be ignored. See API-CONTRACT.md\
    \ §5.0.\n\n**Migrating from a pre-2026-08-04 integration.** `counts.sourcesStale`, `counts.sourcesDegraded`,\
    \ `counts.sourcesOmitted`, `counts.recordsFromStaleSources`, `freshnessDetail`, and `sourceStatus[].freshnessSatisfied`\
    \ / `.degraded` / `.omitted` / `.ageSeconds` / `.lastSuccessAt` were removed and are no longer emitted.\
    \ If you were gating on any of them, gate on `counts.sourcesIncomplete` instead — it asks whether\
    \ your ANSWER is whole, which is the question those keys were being used to ask. `onStale` is deprecated\
    \ but still accepted, so an older request body keeps working.\n\nBilling is required for every account;\
    \ the ONLY free call is one scoped exclusively to statutorily non-commercial jurisdiction(s) (e.g.\
    \ state=CA), which has nothing commercially billable. **Batch billing is per-search:** `POST /v1/batch`\
    \ is one HTTP request but each search in it is billed as its own search (per-row freshness included)\
    \ — a batch of 100 = 100 billable searches. The consolidated verification report (`POST /v1/report`)\
    \ is a separate, callable endpoint any valid key may use (no per-key entitlement), billed **+$0.02\
    \ per document** (admin-overridable per customer). A separate `proof` add-on also carries an extra\
    \ per-document charge and requires billing (402 otherwise); it is NOT the customer verification report.\n"
  contact:
    name: Offendersearch
    url: https://offendersearch.app
    email: support@offendersearch.app
  x-providerName: offendersearch.app
  x-origin:
  - format: openapi
    version: '3.1'
    url: https://offendersearch.app/openapi.json
  x-apisguru-categories:
  - security
  - open_data
servers:
- url: https://api.offendersearch.app
security:
- ApiKeyAuth: []
paths:
  /v1/search:
    post:
      operationId: syncSearch
      summary: Synchronous search (PRIMARY — call and wait)
      description: 'Searches the full dataset by default (or the jurisdictions you name) in a single call
        and returns scored, de-duplicated results in the response. Served from the current snapshot for
        speed. Set `deadlineMs` to bound how long you wait; with `onDeadline: partial` the response returns
        whatever completed within that bound, with per-jurisdiction status in `sourceStatus`; with `onDeadline:
        error` a forced-partial result returns 504 instead. Accepts an API key OR a session token.

        '
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Search results (complete, or partial when a deadlineMs bound is hit)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: 'Billing required for the requested `proof` documents (account has no billing enabled).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '504':
          description: Deadline was hit and `onDeadline=error` was set (forced-partial).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/searches:
    post:
      operationId: asyncSearch
      summary: Asynchronous search — built for batch and high-volume work
      description: '**The batch endpoint.** Submit the search, get a job id back immediately, and collect
        the result when it is ready — poll `GET /v1/searches/{searchId}` or supply a `webhookUrl` and
        we POST the finished envelope to it.


        Because you are not holding a connection open there is no request-timeout ceiling on the work,
        so every named jurisdiction runs to completion. Use it for bulk screening, periodic re-screens
        of a roster you already hold, backfills, unattended scheduled jobs, and broad national sweeps.


        Use `POST /v1/search` instead when a person is waiting on the answer — that is the interactive
        endpoint and it returns in one round trip. Both read the same corpus at the same `freshness` tier
        and return the same envelope; the choice is about how you collect the result, not how current
        it is. To submit many searches at once, `POST /v1/batch` takes up to 1,000 queries in a single
        request.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsyncSearchRequest'
      responses:
        '202':
          description: Search accepted; poll `resultsUrl` for status + results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncSearchAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/searches/{searchId}:
    get:
      operationId: getSearch
      summary: Fetch an async search's status + results
      description: 'Returns the job''s current state. While `pending`/`running` the body carries empty
        `records`/`sourceStatus` and a zeroed `counts`; on `error` it carries an `error` string; when
        finished it is the full SearchResponse.

        '
      parameters:
      - name: searchId
        in: path
        required: true
        schema:
          type: string
        example: srch_9f2c1a7b
      responses:
        '200':
          description: Search status + results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/searches/{searchId}/proof:
    post:
      operationId: makeProof
      summary: Per-registry look-alike proof docs (internal add-on — NOT the verification report)
      description: 'Internal per-registry add-on, distinct from the customer-facing consolidated verification
        report (`POST /v1/report`). Renders a per-registry look-alike PDF/HTML for ONLY the registries
        the caller names. Requires billing (402 otherwise); it carries an extra per-document charge. Never
        generated for all sources implicitly. `registries` is required. A registry with no look-alike
        template yet is skipped and NOT billed (its document row carries an empty `url` + explanatory
        `note`).

        '
      security:
      - ApiKeyAuth: []
      parameters:
      - name: searchId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProofRequest'
      responses:
        '200':
          description: Proof bundle (one verification-report document per requested registry)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofBundle'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: Payment required — billing not enabled on the account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/report:
    post:
      operationId: makeReport
      summary: Consolidated verification / proof PDF for one search
      description: 'Renders a SINGLE consolidated verification PDF for a search that was ALREADY run —
        pass the `searchId` of a prior `POST /v1/search` (or `/v1/searches`) call (valid for 7 days),
        optionally with the `viewerName`/`viewerEmail` of whoever is viewing it (both OPTIONAL, printed
        at the top as a viewer verification — not an access gate). Any valid key or session may call it
        — there is NO per-key entitlement. Because the search call was already billed, the report meters
        ONLY the **+$0.02 per-PDF** charge (admin-overridable per customer via `pdf_rate_cents`). (Legacy
        one-shot: omit `searchId` and pass an inline `query`, which runs the search inline and also bills
        the call.) The PDF shows EVERY matching offender and EVERY field on file (name, aliases, DOB/age
        match state, address/jurisdiction, offense/risk, photo when available, and the full extensive
        field set), plus a source-attribution section with a citation on every record — proving provenance.
        A legal notice (use restrictions; informational only, not an FCRA consumer report) is printed
        on the document. Responds with `application/pdf` as a file attachment (`Content-Disposition: attachment`);
        the report id is echoed in the `X-Report-Id` header. Accepts an API key OR a session token.

        '
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
      responses:
        '200':
          description: The consolidated verification report (a PDF file attachment).
          headers:
            X-Report-Id:
              description: Unique id of the generated report (also printed on the document).
              schema:
                type: string
                example: rpt_9f2c1a7b3e4d
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/batch:
    post:
      operationId: batchSearch
      summary: Batch search (row-in / row-out bulk lookups)
      description: 'Runs many queries in one call — offenders.io CSV-batch parity (one row = one call
        in, one result out). Each row goes through the SAME engine as `/v1/search` (served from the current
        snapshot), with bounded server-side concurrency, and results come back in input order. Send either
        a JSON array of query objects, a JSON envelope `{ "queries": [...], ...batch-wide options }` (the
        non-`queries` keys — `jurisdictions`, `freshness`, `match`, `recordTypes`, `locationScoped`, `include`
        — apply to every row), or a `text/csv` body whose header row names Query fields (`firstName,lastName,state,dob,city,zipcode,address,age,q`).
        A row that fails is reported with `status: error` in place; it never aborts the batch. Max 1000
        rows. Accepts an API key OR a session token.


        **Billing — per search, NOT per request.** A batch is one HTTP call but contains N searches, and
        **each search in the batch is billed as one search** (at the graduated per-call rate, plus its
        own +$0.01 daily-freshness surcharge when that row''s freshness is `daily` — the default). A batch
        of 100 rows = 100 billable searches. Freshness applies per row: set `freshness: weekly` on a row
        (or batch-wide) to bill that search with no surcharge.

        '
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: array
                items:
                  $ref: '#/components/schemas/Query'
              - type: object
                properties:
                  queries:
                    type: array
                    items:
                      $ref: '#/components/schemas/Query'
                  jurisdictions:
                    type: array
                    items:
                      type: string
                  freshness:
                    type: string
                    enum:
                    - daily
                    - weekly
                    default: daily
                    description: Batch-wide default; a per-row `freshness` overrides it for that row.
                  match:
                    type: string
                    enum:
                    - strict
                    - balanced
                    - broad
                  recordTypes:
                    type: array
                    items:
                      type: string
                  locationScoped:
                    type: boolean
                  include:
                    type: array
                    items:
                      type: string
                required:
                - queries
          text/csv:
            schema:
              type: string
              description: Header row of Query field names, then one query per line.
              example: 'firstName,lastName,state

                John,Smith,FL

                Jane,Doe,TX

                '
      responses:
        '200':
          description: Per-row results, in input order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    description: Number of rows processed.
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        index:
                          type: integer
                          description: 0-based input row index.
                        status:
                          type: string
                          description: Row outcome (complete/partial/error).
                        counts:
                          type: object
                          properties:
                            records:
                              type: integer
                            sourcesQueried:
                              type: integer
                            sourcesIncomplete:
                              type: integer
                              description: Registries in THIS ROW that could not be searched to the end.
                                Check it per row — one row can be short while the rest are whole. See
                                API-CONTRACT.md §5.0.
                        warnings:
                          type: array
                          items:
                            type: string
                          description: Per-row warnings, same shape as the envelope's. `[]` when nothing
                            shortened this row. A batch row carries no `sourceStatus`, so this is the
                            only prose signal it has.
                        records:
                          type: array
                          items:
                            $ref: '#/components/schemas/Record'
                        error:
                          type: string
                          description: Present only when status=error.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: Batch exceeded the maximum row count (1000).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/proof-docs/{token}:
    get:
      operationId: getProofDoc
      summary: Fetch a rendered verification-report document
      description: 'Serves the rendered proof document referenced by a ProofBundle document `url`. Returns
        the raw file body with the appropriate content type (`application/pdf` or `text/html`), not JSON.

        '
      security:
      - ApiKeyAuth: []
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
        description: Opaque document token from a ProofBundle document `url`.
      responses:
        '200':
          description: The rendered document.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            text/html:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/records/{recordId}:
    get:
      operationId: getRecord
      summary: Fetch a single normalized record by recordId or uuid
      description: 'Resolves a record by EITHER identifier a search published for it: our `recordId` (`rec_…`)
        or the registry''s own `uuid`. DATABASE-BACKED since 2026-08-04 — it previously read only an in-memory
        index local to one API container, keyed on `recordId` alone, so a `uuid` never resolved and a
        `recordId` resolved only when the follow-up request happened to reach the same container as the
        search.


        A `404` means THIS IDENTIFIER IS NOT CURRENT — never that the person is unregistered. Registries
        re-issue their ids (KY, MO, OR, AZ, IA and WV each re-issued their entire registry within eight
        days to 2026-08-04; CA re-issued ~104,000). Re-search by name and state, then store the new `uuid`.


        An identifier carrying a byte no id of ours can hold — a NUL or any other control character —
        is also a `404`. Until 2026-08-05 `/v1/records/%00` and `/v1/records/a%00b` returned **500**,
        the only 5xx reachable from ~60 hostile inputs, because the NUL reached a database parameter.
        A 5xx is a claim that WE failed, and for a malformed id that claim is false. `%01` and `%25` always
        answered 404; now every impossible id answers the same way.


        A `409` means the id is AMBIGUOUS. A `uuid` is unique only together with its jurisdiction — `20059`
        identifies a Florida, a Pennsylvania and a Wisconsin registrant, and 55,893 ids are shared across
        jurisdictions (147,624 records). This endpoint returns one record and will not guess which you
        meant; use `GET /v1/compat/sexoffender?uuid=…&state=XX`, which returns every match with its jurisdiction,
        or use `recordId`, which is namespaced per jurisdiction and does not collide.

        '
      parameters:
      - name: recordId
        in: path
        required: true
        description: The `recordId` (`rec_…`) or the registry `uuid` from a search result.
        schema:
          type: string
        example: rec_ab12cd34ef56gh78ij90
      responses:
        '200':
          description: The record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Record'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'The identifier matches records in more than one jurisdiction. `detail` names them.
            Disambiguate with the compat endpoint''s `state`, or use `recordId`.

            '
  /v1/sources:
    get:
      operationId: listSources
      summary: Coverage catalog + live health of every jurisdiction
      description: 'The catalog of every jurisdiction we cover, with lightweight health. No API key required
        — this doubles as public coverage transparency.

        '
      security: []
      responses:
        '200':
          description: Coverage catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SourceInfo'
  /v1/support:
    post:
      operationId: submitSupportMessage
      summary: Send a message to the Offendersearch team
      description: 'Sends a message to our support team. **No API key required** — this is the endpoint
        behind the contact form on offendersearch.app, and it is open because the people who need it most
        are the ones who do not have a key yet.


        A `200` means the message is **recorded**: it is stored against the `submissionId` in the response
        and can be looked up by that id if you ever need to refer to it. It does not report that an email
        has arrived anywhere, because that is a separate step we do not make you wait for.


        Replies come from the address in `supportEmail`, normally within one business day. You can also
        write to that address directly; both routes reach the same inbox.


        The endpoint accepts `application/json` or `application/x-www-form-urlencoded`, so an ordinary
        HTML form can post to it without any JavaScript.

        '
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SupportRequest'
      responses:
        '200':
          description: The message was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportResult'
        '413':
          description: 'The body is larger than this endpoint accepts (64 KB). Send a summary and reply
            to our answer with anything bulky.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'A required field is missing or the email address is not a valid address. Nothing
            was stored; correct it and send again.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Too many messages from one address in a short period. Nothing was stored, so nothing
            is duplicated when you retry. `Retry-After` gives the number of seconds to wait, and the same
            value is in `detail.retryAfterSeconds`.

            '
          headers:
            Retry-After:
              description: Seconds to wait before sending the message again.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
        '503':
          description: 'The message could not be recorded, so **do not treat it as sent**. Use the address
            in the error text instead; it is answered by the same team.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/compat/sexoffender:
    post:
      operationId: compatSexoffenderPost
      summary: offenders.io drop-in compatibility (POST)
      description: 'Accepts offenders.io''s exact parameters and returns their exact envelope ({offenders,
        page, totalPages[, error]}). Existing offenders.io integrations switch by changing only the base
        URL and key. Accepts the key via `X-API-Key`, `Authorization: Bearer`, or `?key=`. Echoes/mints
        the offenders.io correlation headers (`X-Request-Id`, `X-Offenders-Request-Id`, `X-Offendersearch-Request-Id`).
        Errors use the offenders.io `{code, message}` shape.


        **Combination-validation (400 with `{code:400, message}`):** `q` cannot be combined with `firstName`/`lastName`,
        nor with `lat`/`lng`; `address` cannot be combined with `q`, nor with `lat`/`lng`.


        **GIS search (`lat`+`lng` supplied):** results are paged **50 per page** (regular searches page
        20), and the query defaults to the **last 90 days** of source updates (`updatedAtStart = now −
        90d`) unless the caller supplies an explicit `updatedAtStart`. A missing `radius` defaults to
        1 mile (capped at 100).

        '
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      - QueryKeyAuth: []
      parameters:
      - name: X-Request-Id
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,64}$
        description: Optional client correlation id; echoed back when valid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OffendersIoRequest'
      responses:
        '200':
          description: offenders.io-shaped response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OffendersIoResponse'
        '400':
          description: 'Invalid parameter combination: `q` with firstName/lastName or lat/lng, or `address`
            with q or lat/lng. Body is `{code:400, message}`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompatError'
        '401':
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompatError'
        '422':
          description: faceId supplied (facial search not supported).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompatError'
    get:
      operationId: compatSexoffenderGet
      summary: offenders.io drop-in compatibility (GET)
      description: 'Identical semantics to the POST form; parameters are supplied as query string values
        (offenders.io demo/GET mode). Accepts the key via `X-API-Key`, `Authorization: Bearer`, or `?key=`.

        '
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      - QueryKeyAuth: []
      parameters:
      - name: firstName
        in: query
        schema:
          type: string
      - name: lastName
        in: query
        schema:
          type: string
      - name: dob
        in: query
        schema:
          type: string
          format: date
      - name: age
        in: query
        schema:
          type: integer
      - name: city
        in: query
        schema:
          type: string
      - name: state
        in: query
        schema:
          type: string
      - name: zipcode
        in: query
        schema:
          type: string
      - name: address
        in: query
        schema:
          type: string
      - name: lat
        in: query
        schema:
          type: number
      - name: lng
        in: query
        schema:
          type: number
      - name: radius
        in: query
        schema:
          type: number
      - name: q
        in: query
        schema:
          type: string
      - name: fuzzy
        in: query
        schema:
          type: boolean
      - name: mode
        in: query
        schema:
          type: string
          enum:
          - extensive
      - name: prefixMatch
        in: query
        schema:
          type: string
          enum:
          - firstName
          - lastName
          - both
      - name: faceId
        in: query
        schema:
          type: string
      - name: createdAtStart
        in: query
        schema:
          type: string
          format: date-time
      - name: createdAtEnd
        in: query
        schema:
          type: string
          format: date-time
      - name: updatedAtStart
        in: query
        schema:
          type: string
          format: date-time
      - name: updatedAtEnd
        in: query
        schema:
          type: string
          format: date-time
      - name: uuid
        in: query
        schema:
          type: string
      - name: personUuid
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: perPage
        in: query
        schema:
          type: integer
      - name: key
        in: query
        schema:
          type: string
        description: API key (offenders.io demo mode); alternative to the header.
      - name: X-Request-Id
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,64}$
      responses:
        '200':
          description: offenders.io-shaped response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OffendersIoResponse'
        '400':
          description: Invalid parameter combination.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompatError'
        '401':
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompatError'
        '422':
          description: faceId supplied (facial search not supported).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompatError'
  /v1/auth/signup:
