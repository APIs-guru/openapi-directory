        billedDocuments:
          type: integer
          description: Count of proof docs billed on this request.
        documents:
          type: array
          items:
            type: object
            properties:
              registry:
                type: string
              format:
                type: string
                enum:
                - pdf
                - html
              url:
                type: string
                description: Fetch via GET /v1/proof-docs/{token}. Empty when the registry has no template
                  yet.
              note:
                type: string
                description: Present (e.g. "no proof template for registry") when the doc was skipped
                  and not billed.
    SourceInfo:
      type: object
      description: One jurisdiction from the public coverage catalog.
      properties:
        id:
          type: string
          example: IL
        name:
          type: string
          example: Illinois Sex Offender Registry
        covers:
          type: array
          items:
            type: string
          description: State/territory codes this source covers (some sources cover many).
        scope:
          type: string
          enum:
          - state
          - national
        status:
          type: string
          enum:
          - building
          - live
        legal:
          type: object
          properties:
            commercialUse:
              type: string
              enum:
              - allowed
              - restricted
              - prohibited
              - unknown
        health:
          type: object
          properties:
            lastSuccessAt:
              type: string
              format: date-time
              nullable: true
              description: When this registry was last ingested successfully — this registry's currency,
                live. null if it never has been. This endpoint needs no API key, so it is auditable before
                purchase.
            typicalLatencyMs:
              type: integer
              nullable: true
              description: p50 latency from local diagnostics. null when not measured on this instance.
            ageSeconds:
              type: number
              nullable: true
              description: Age of the current snapshot, in seconds. null = never ingested (unknown, never
                'fresh').
            freshFor:
              type: array
              items:
                type: string
                enum:
                - daily
                - weekly
              description: 'The freshness tiers this registry''s current snapshot falls inside — a restatement
                of `ageSeconds` in tier labels. `[]` = never ingested. NOT A FILTER: a registry contributes
                its records to a search whatever this says, at every tier. Read it to KNOW a registry''s
                age, not to predict which registries will answer. See API-CONTRACT.md §2.

                '
    OffendersIoRequest:
      type: object
      description: offenders.io parameters, accepted verbatim.
      properties:
        firstName:
          type: string
        lastName:
          type: string
        dob:
          type: string
          format: date
        age:
          type: integer
        city:
          type: string
        state:
          type: string
        zipcode:
          type: string
        address:
          type: string
          description: Cannot be combined with q or lat/lng (400).
        lat:
          type: number
        lng:
          type: number
        radius:
          type: number
          description: Miles; defaults to 1 when a point is given, capped at 100. GIS pages are 50/page.
        q:
          type: string
          description: Cannot be combined with firstName/lastName or lat/lng (400).
        fuzzy:
          type: boolean
        mode:
          type: string
          enum:
          - extensive
        prefixMatch:
          description: 'Partial-name search — the name is treated as the START of a name (min 3 characters),
            matched against aliases too. "both" prefixes first and last name together.

            '
          oneOf:
          - type: string
            enum:
            - firstName
            - lastName
            - both
          - type: array
            items:
              type: string
              enum:
              - firstName
              - lastName
        faceId:
          type: string
          description: Not supported — returns 422.
        createdAtStart:
          type: string
          format: date-time
        createdAtEnd:
          type: string
          format: date-time
        updatedAtStart:
          type: string
          format: date-time
          description: GIS searches default to the last 90 days of updates unless this is set.
        updatedAtEnd:
          type: string
          format: date-time
        uuid:
          type: string
          description: 'Direct record lookup (parity), database-backed since 2026-08-04. Pass the `uuid`
            a search returned. BEFORE that date this accepted only our internal `rec_…` id, so feeding
            back the `uuid` this same endpoint publishes returned an empty `offenders` array 100% of the
            time. An empty result means the id is not CURRENT (registries re-issue ids in bulk), not that
            the person is unregistered — re-search by name and state. Combine with `state` when the id
            may be shared across jurisdictions; without it every match is returned.

            '
        personUuid:
          type: string
          description: Alias of `uuid` for direct record lookup (parity). Same semantics.
        page:
          type: integer
          default: 1
        perPage:
          type: integer
    OffendersIoResponse:
      type: object
      description: offenders.io envelope, returned verbatim for compat.
      properties:
        offenders:
          type: array
          items:
            $ref: '#/components/schemas/OffendersIoOffender'
        page:
          type: integer
        totalPages:
          type: integer
        error:
          type: integer
          nullable: true
          description: 'offenders.io convention: present (e.g. 503) when the result set may be incomplete
            (deadline-partial or a source errored).'
    OffendersIoOffender:
      type: object
      description: 'offenders.io''s flat offender object — every one of their 38 keys, plus additive extras
        (personUuid, county, stateData, matchConfidence). lat/lng default to -1 (their missing/needs-geocoding
        sentinel), not null.

        '
      properties:
        uuid:
          type: string
        personUuid:
          type: string
          description: Additive.
        name:
          type: string
        firstName:
          type: string
        middleName:
          type: string
        lastName:
          type: string
        firstName_nicknames:
          type: array
          items:
            type: string
          description: 'First-name nickname/variant expansion for search recall (parity with offenders.io
            `firstName_nicknames`; e.g. "Jonathan" -> ["john","nathan"]). Mirrors the native Record.nicknames
            field.

            '
          example:
          - john
          - johnny
        aliases:
          type: array
          items:
            type: object
            properties:
              givenName:
                type: string
              middleName:
                type: string
              surName:
                type: string
        dob:
          type: string
          nullable: true
          description: 'UTC midnight ISO, e.g. `1990-01-15T00:00:00.000Z` — the incumbent''s shape, reproduced
            for drop-in compatibility.


            ★ **null when `dobPrecision` is `year`.** This timestamp format has no way to say "a birth
            year, and nothing finer", and we will not fill the gap with a January-1 placeholder. The year
            is not lost: the native `/v1/search` response carries `birthYear: 1976` for the same record.
            Note the incumbent DOES emit a Jan-1 timestamp here for those registrants — so on this field
            they look more complete than us and are in fact less accurate.

            '
        dobPrecision:
          type: string
          enum:
          - exact
          - year
          - year_month
          - unknown
          description: See `Record.dobPrecision`. Authoritative — read it before trusting `dob`.
        sex:
          type: string
          description: 'Free text, registry vocabulary, NOT an enum. "" when we hold nothing. "Male" and
            "M" (and "F"/"Female") occur in the SAME response when a search spans registries — normalize
            before grouping. MAINE and the DISTRICT OF COLUMBIA are a special case worth knowing: neither
            registry''s own website publishes a sex anywhere, so these values come from the jurisdiction''s
            own federal NSOPW feed and use that feed''s "M"/"F"/"U" vocabulary. Fill measured 2026-08-04:
            ME 99.7% (2,880 of 2,888), DC 97.2% (1,028 of 1,058); the residue is records we could not
            join with certainty and is left empty rather than guessed.

            '
        age:
          type: string
        race:
          type: string
          description: 'Free text, registry vocabulary, NOT an enum. "" when unknown. IMPORTANT: several
            registries (California among them) publish ONE column covering race and ethnicity; we route
            Hispanic values to `ethnicity` and everything else to `race`, so for those states the two
            keys are MUTUALLY EXCLUSIVE and reading `race` alone drops every Hispanic registrant. California
            measured 2026-08-04: race 51%, ethnicity 48%, either 99.4%. Compute coverage on (race || ethnicity).
            ME and DC publish NO race on any surface they render (checked live 2026-08-04 on both of Maine''s
            profile renderings, and on DC''s ArcGIS layer, roster and CSOSA bulletin) and their federal
            feeds carry none either, so "" is final there, and there is no ethnicity to fall back to.
            The national index (NSOPW) publishes no race, ethnicity, height, weight, eyeColor, hairColor
            or marks on any record of any of the 158 jurisdictions it federates — its API carries ten
            keys and none of these is among them. A person held by BOTH a state registry and the national
            index is returned as ONE record carrying the STATE registry''s physical description, with
            both registries listed in `sources[]`; a person only the national index reaches carries ""
            for these keys. Tribal registrants are read from the tribe''s own per-registrant page and
            carry them normally.

            '
        ethnicity:
          type: string
          description: 'Free text. "" is the common case (67%). Observed values include "Hispanic", "Non-Hispanic",
            "Not Hispanic", "Unknown" — normalize before grouping. See `race` for the single-column registries.

            '
        height:
          type: string
        weight:
          type: string
        eyeColor:
          type: string
        hairColor:
          type: string
        marks:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        zipcode:
          type: string
        county:
          type: string
          description: Additive.
        lat:
          type: number
          description: -1 when missing.
        lng:
          type: number
          description: -1 when missing.
        locations:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              streetAddress:
                type: string
              city:
                type: string
              state:
                type: string
              zipCode:
                type: string
              county:
                type: string
              latitude:
                type: number
              longitude:
                type: number
              fromDate:
                type: string
              toDate:
                type: string
        crime:
          type: string
        riskLevel:
          type: string
          description: 'The registry''s own classification of this registrant, whichever kind that registry
            publishes: a risk tier where one exists (`"Tier 3"`, `"MODERATE"`), otherwise the statutory
            designation (`"Sexual Predator"`, `"Sexual Offender"`). `""` when the registry publishes neither.
            **Not comparable across states**, and `""` never means low risk — many states run no risk
            scheme at all. It is NOT a registration status: for whether the registrant is confined, absconded,
            deported or deceased, read `stateData.status` or the `isAbsconder` boolean. Where a state
            publishes a statutory DESIGNATION instead of a tier (**Florida**: `"Sexual Predator"` / `"Sexual
            Offender"` / `"Juvenile Sexual Offender"`), that designation is carried in `stateData.designation`
            and mirrored by `isPredator`; send `mode=extensive` and it also fills this key, since `stateData`
            is only resolved in that mode.

            '
        registrationDate:
          type: string
          nullable: true
        isAbsconder:
          type: boolean
          nullable: true
        isPredator:
          type: boolean
          nullable: true
        offenderUrl:
          type: string
        offenderImageUrl:
          type: string
        offenderImageUrlR2:
          type: string
          description: Their rehosted-CDN field — always empty for us.
        jurisdiction:
          type: string
        sources:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              url:
                type: string
        content:
          type: string
          description: Pre-formatted HTML summary (parity).
        createdAt:
          type: string
          nullable: true
        updatedAt:
          type: string
          nullable: true
        stateData:
          oneOf:
          - $ref: '#/components/schemas/StateData'
          - type: 'null'
          description: Additive; null unless mode=extensive.
        matchConfidence:
          type: number
          nullable: true
          description: Additive.
