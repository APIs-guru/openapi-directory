      description: 'One tracked Polymarket market''s odds series: [ts, yesUsd, noUsd] points sampled ~1/min (dense recent
        hour, 5-min buckets older, ~24h horizon) into a normalized ready-to-chart array. History begins when HostDeFi first
        observes a market. Charge-on-success: an untracked market answers an uncharged 404.'
      tags:
      - x402 (machine-payable)
      parameters:
      - name: marketId
        in: query
        required: true
        schema:
          type: string
        description: Polymarket market id (conditionId, as listed by /v1/x402/predict/markets).
        example: '0xabc123'
      responses:
        '200':
          description: The odds series. Settled payment is confirmed by the X-PAYMENT-RESPONSE header and meta.x402.
          headers:
            X-PAYMENT-RESPONSE:
              schema:
                type: string
              description: base64-encoded JSON settlement receipt.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  source:
                    type: string
                  marketId:
                    type: string
                  title:
                    type: string
                    nullable: true
                  slug:
                    type: string
                    nullable: true
                  endDate:
                    type: string
                    nullable: true
                  count:
                    type: integer
                  points:
                    type: array
                    items:
                      type: array
                      items:
                        type: number
                  meta:
                    type: object
        '402':
          description: 'Payment required: the x402 offer (v1 accepts body + v2 PAYMENT-REQUIRED header). Pay one of the accepts
            and retry.'
        '404':
          description: Market not tracked (history begins when HostDeFi first observes a market) — nothing was charged.
        '503':
          description: Prediction data temporarily unavailable — nothing was charged.
      x-payment-info:
        price:
          currency: USD
          mode: fixed
          amount: '0.02'
        protocols:
        - x402: {}
      security: []
  /v1/x402/rpc/{chain}:
    post:
      summary: One JSON-RPC call against the 82-chain relay, paid per call via x402
      security: []
      x-payment-info:
        price:
          currency: USD
          mode: fixed
          amount: '0.002'
        protocols:
        - x402: {}
      description: 'Machine-payable JSON-RPC passthrough to HostDeFi''s 82-chain public relay (the engine behind rpc.hostdefi.com).
        POST a single {"jsonrpc":"2.0","id":1,"method":...,"params":[...]} object or a batch of up to 10; the upstream JSON-RPC
        result is returned verbatim. Chain ids are the published relay ids — ethereum, base, solana, arbitrum, polygon, bsc,
        ... (full list: https://hostdefi.com/api/rpc/chains). Method allowlists apply upstream; an unknown chain or rejected
        call is mirrored uncharged. Volume buyers belong on the relay''s $25/mo USDC key (POST /api/rpc/keys/claim).'
      tags:
      - x402 (machine-payable)
      parameters:
      - name: chain
        in: path
        required: true
        schema:
          type: string
        description: Relay chain id (e.g. ethereum, base, solana)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                required:
                - method
              - type: array
                maxItems: 10
                items:
                  type: object
                  required:
                  - method
            example:
              jsonrpc: '2.0'
              id: 1
              method: eth_blockNumber
              params: []
      responses:
        '200':
          description: The upstream JSON-RPC result verbatim (result or error object). Settlement receipt in the X-PAYMENT-RESPONSE
            header.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Malformed JSON-RPC body or bad chain id - nothing was charged.
        '402':
          $ref: '#/components/responses/X402PaymentRequired'
        '404':
          description: Unknown chain - nothing was charged.
        '413':
          description: Batch exceeds the per-call cap (10) - nothing was charged.
        '503':
          description: RPC relay temporarily unavailable - nothing was charged.
components:
  securitySchemes:
    ApiKeyHeader:
      type: apiKey
      in: header
      name: x-api-key
      description: API key from POST /v1/keys (vx_ + 32 hex chars). Omit it to use the keyless free tier (100 calls/day per
        IP).
  requestBodies:
    AnalyzeTokenRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              text:
                type: string
                description: Token contract address, or an exact token name/ticker. `tokenAddress` is accepted as an alias.
              tokenAddress:
                type: string
                description: Alias for `text`.
          example:
            text: So11111111111111111111111111111111111111112
  responses:
    V1Error:
      description: 'Error. `Cache-Control: no-store`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/V1ErrorBody'
    V1RateLimited:
      description: 'Rate limited: keyless daily fair-use reached, plan quota reached, or per-key burst ceiling (~5 req/s).
        `Cache-Control: no-store`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/V1ErrorBody'
    ScannerResult:
      description: Analysis result.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AnalyzeTokenResult'
    ScannerBadRequest:
      description: Missing or unrecognized input.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ScannerError'
    ScannerNotFound:
      description: No DEX data found for that address.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ScannerError'
    ScannerRateLimited:
      description: Fair-use cap reached (100 free checks/day per IP; resets within 24h).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ScannerError'
    ScannerServerError:
      description: Server error.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    ScannerTimeout:
      description: Analysis timed out.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ScannerError'
    X402PaymentRequired:
      description: Payment required (or payment invalid / settlement failed). Body carries the x402 v1 offer; pay and retry
        with the X-PAYMENT header.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/X402Offer'
  schemas:
    V1ErrorBody:
      type: object
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: string
        pending:
          type: boolean
          description: Present on 202 from /v1/keys while the payment is unconfirmed.
        resetsAt:
          type: integer
          description: Unix ms timestamp when the limit resets (present on some 429s).
        details:
          type: string
      required:
      - ok
      - error
    BatchItemError:
      type: object
      description: Per-item failure inside a batch — the other items still return verdicts.
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: string
        details:
          type: string
      required:
      - ok
      - error
    Verdict:
      type: object
      description: The graded Safety Read for one token — identical to the grade rendered on the HostDeFi token pages.
      properties:
        ok:
          type: boolean
          const: true
        token:
          type: object
          properties:
            chain:
              type:
              - string
              - 'null'
              description: Resolved chain id (e.g. solana, ethereum), or null if undeterminable.
            address:
              type: string
            name:
              type:
              - string
              - 'null'
            symbol:
              type:
              - string
              - 'null'
        risk:
          $ref: '#/components/schemas/RiskBlock'
        signals:
          description: Chain-dependent raw signals behind the grade.
          oneOf:
          - $ref: '#/components/schemas/SolanaSignals'
          - $ref: '#/components/schemas/EvmSignals'
        meta:
          type: object
          properties:
            checkedAt:
              type: string
              format: date-time
            sources:
              type: array
              items:
                type: string
                enum:
                - geckoterminal
                - verixia-onchain
                - goplus
            partial:
              type: boolean
              description: True when the chain's security/authority source was unavailable and the verdict degraded rather
                than blocked.
            plan:
              type: string
              description: free, or the calling key's plan id (week/month/year). Not set on batch items (the batch envelope
                carries it).
            remaining:
              type: integer
              description: Calls remaining on the caller's tier. Not set on batch items.
    RiskBlock:
      type: object
      description: 'Graded verdict, or an honest refusal to grade (`graded: false`) when the token is too new or under-described
        — the API never fakes a grade.'
      properties:
        graded:
          type: boolean
        score:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 97
          description: Safety score, higher is safer. The engine clamps emitted scores to 2–97 (a perfect score is unreachable
            by design). Null when ungraded.
        grade:
          type:
          - string
          - 'null'
          enum:
          - A+
          - A
          - B
          - C
          - D
          - F
          - null
          description: Letter grade band over the score (A+ ≥ 90, A ≥ 82, B ≥ 72, C ≥ 60, D ≥ 35, else F).
        tier:
          type:
          - string
          - 'null'
          enum:
          - low
          - med
          - high
          - null
          description: 'Risk tier: low (A+/A/B), med (C), high (D/F).'
        verdict:
          type:
          - string
          - 'null'
          description: Deterministic one-paragraph verdict prose (no LLM involved).
        knowns:
          type: array
          items:
            type: string
          description: Verified facts the grade rests on.
        unknowns:
          type: array
          items:
            type: string
          description: Checks that could not be verified.
        notGradedReason:
          type:
          - string
          - 'null'
          description: Why no grade was emitted (only when graded is false).
    SolanaSignals:
      type: object
      description: Solana signal set (present when the token resolved to Solana). `authorities` is always emitted (null-valued
        when the on-chain read was unavailable) and is what distinguishes this branch from EvmSignals.
      required:
      - authorities
      properties:
        authorities:
          type: object
          properties:
            mintDisabled:
              type:
              - boolean
              - 'null'
            freezeDisabled:
              type:
              - boolean
              - 'null'
        token2022Extensions:
          type: object
          description: Token-2022 trap flags. All false for classic SPL tokens.
          properties:
            transferFee:
              type: boolean
            defaultAccountState:
              type: boolean
            nonTransferable:
              type: boolean
            permanentDelegate:
              type: boolean
            transferHook:
              type: boolean
            pausable:
              type: boolean
        holders:
          type: object
          properties:
            top10Pct:
              type:
              - number
              - 'null'
              description: Top-10 holder share of supply, percent.
            curveExcluded:
              type:
              - boolean
              - 'null'
              description: Whether bonding-curve/pool accounts were excluded from the concentration read.
        launch:
          type: object
          properties:
            bundled:
              type:
              - boolean
              - 'null'
              description: Bundled-launch detection.
            firstSlotTxs:
              type:
              - integer
              - 'null'
            preGraduation:
              type: boolean
              description: True when the token exists on-chain but has no DEX pair yet.
        market:
          $ref: '#/components/schemas/MarketSignals'
    EvmSignals:
      type: object
      description: EVM signal set (present when the token resolved to an EVM chain). `evmSecurity` is always emitted (all-null
        flags when the security source was unavailable) and is what distinguishes this branch from SolanaSignals.
      required:
      - evmSecurity
      properties:
        market:
          $ref: '#/components/schemas/MarketSignals'
        evmSecurity:
          type: object
          description: Contract security flags. Null = the check could not be evaluated.
          properties:
            honeypot:
              type:
              - boolean
              - 'null'
            buyTaxPct:
              type:
              - integer
              - 'null'
            sellTaxPct:
              type:
              - integer
              - 'null'
            mintable:
              type:
              - boolean
              - 'null'
            pausable:
              type:
              - boolean
              - 'null'
            blacklist:
              type:
              - boolean
              - 'null'
            proxy:
              type:
              - boolean
              - 'null'
            hiddenOwner:
              type:
              - boolean
              - 'null'
            openSource:
              type:
              - boolean
              - 'null'
    MarketSignals:
      type: object
      properties:
        liquidityUsd:
          type:
          - number
          - 'null'
        volume24h:
          type:
          - number
          - 'null'
        priceUsd:
          type:
          - number
          - 'null'
    ScannerError:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
          description: Human-readable explanation safe to show end users.
      required:
      - error
    AnalyzeTokenResult:
      type: object
      description: 'Free scanner analysis: AI narrative (or deterministic fallback) + market metrics + on-chain contract permission
        reads.'
      properties:
        riskLevel:
          type: string
          enum:
          - Low
          - Medium
          - High
        summary:
          type: string
        keySignals:
          type: array
          items:
            type: string
        concerningIndicators:
          type: array
          items:
            type: string
        legitimateElements:
          type: array
          items:
            type: string
        finalTake:
          type: string
        recommendedActions:
          type: array
          items:
            type: string
        tokenName:
          type:
          - string
          - 'null'
        symbol:
          type:
          - string
          - 'null'
        chain:
          type:
          - string
          - 'null'
        contractAddress:
          type:
          - string
          - 'null'
        coinGeckoRank:
          type:
          - integer
          - 'null'
        categories:
          type: array
          items:
            type: string
        score:
          type: string
          description: Liquidity-confidence text (legacy field name).
        aiConfigured:
          type: boolean
        subscriber:
          type: boolean
        checkedAt:
          type: string
          format: date-time
        dataSources:
          type: object
          properties:
            market:
              type: boolean
            coinGecko:
              type: boolean
            onChain:
              type: boolean
        contractData:
          type: object
          description: On-chain contract permission reads (SPL authorities / EVM owner state, holder concentration); shape
            varies by chain and availability.
          additionalProperties: true
        metrics:
          type: object
          properties:
            liquidityUSD:
              type:
              - number
              - 'null'
            volume24h:
              type:
              - number
              - 'null'
            priceChange24h:
              type:
              - number
              - 'null'
            pairAge:
              type:
              - string
              - 'null'
              description: Human-formatted pair age, e.g. "3d 4h".
            fdv:
              type:
              - number
              - 'null'
            marketCap:
              type:
              - number
              - 'null'
            priceUsd:
              type:
              - number
              - 'null'
            buys24h:
              type:
              - number
              - 'null'
            sells24h:
              type:
              - number
              - 'null'
            liquidityConfidence:
              type: string
              enum:
              - HIGH
              - MEDIUM
              - LOW
              - UNKNOWN
            liquidityConfidenceText:
              type: string
            volumeLiquidityRatio:
              type:
              - number
              - 'null'
            fdvLiquidityRatio:
              type:
              - number
              - 'null'
            cgMarketCapToLiquidityRatio:
              type:
              - number
              - 'null'
            cgMarketCapUsd:
              type:
              - number
              - 'null'
            cgVolume24hUsd:
              type:
              - number
              - 'null'
            cgCirculatingSupply:
              type:
              - number
              - 'null'
            cgTotalSupply:
              type:
              - number
              - 'null'
            cgAllTimeHigh:
              type:
              - number
              - 'null'
            cgAthChangePercent:
              type:
              - number
              - 'null'
        aiError:
          type: string
          description: Present when the AI narrative fell back to the deterministic analysis (reason string).
    X402PaymentRequirements:
      type: object
      description: 'One accepted payment option (x402 protocol v1, ''exact'' scheme). Amounts are atomic units of the asset
        (USDC has 6 decimals: ''10000'' = $0.01).'
      properties:
        scheme:
          type: string
          example: exact
        network:
          type: string
          example: solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp
        maxAmountRequired:
          type: string
          example: '10000'
        asset:
          type: string
          description: Token mint / contract address (USDC).
          example: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
        payTo:
          type: string
        resource:
          type: string
          format: uri
        description:
          type: string
        mimeType:
          type: string
          example: application/json
        maxTimeoutSeconds:
          type: integer
          example: 60
        extra:
          type: object
          description: Scheme extras - on Solana includes the facilitator's feePayer.
    X402Offer:
      type: object
      description: 'The 402 Payment Required body: retry the same request with an X-PAYMENT header (base64 JSON payment payload)
        built against one of the ''accepts'' options. Any standard x402 client handles this automatically.'
      properties:
        x402Version:
          type: integer
          example: 1
        error:
          type: string
        accepts:
          type: array
          items:
            $ref: '#/components/schemas/X402PaymentRequirements'
tags:
- name: x402 (machine-payable)
  description: 'Pay-per-call lane for AI agents (x402 protocol): no key, no account - pay USDC per request and get the same
    A+-F Safety Read. Free tier and API-key plans are unchanged and remain the better per-call price for steady use.'
